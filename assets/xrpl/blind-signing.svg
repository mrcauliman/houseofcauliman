<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b1018"/><text x="120" y="110" fill="#eef3f8" font-family="Arial" font-size="52" font-weight="700">Blind Signing</text><rect x="300" y="220" width="1000" height="480" rx="30" fill="#111823" stroke="#ff6b6b"/><text x="530" y="320" fill="#eef3f8" font-family="Arial" font-size="42" font-weight="700">Sign Without Reading</text><text x="500" y="430" fill="#ff6b6b" font-family="Arial" font-size="34" font-weight="700">Destination unknown</text><text x="500" y="490" fill="#ff6b6b" font-family="Arial" font-size="34" font-weight="700">Issuer unknown</text><text x="500" y="550" fill="#ff6b6b" font-family="Arial" font-size="34" font-weight="700">Asset unknown</text><text x="470" y="640" fill="#aeb8c6" font-family="Arial" font-size="30">If you don't know what it is, don't sign it</text></svg>