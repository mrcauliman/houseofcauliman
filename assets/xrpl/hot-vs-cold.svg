<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b1018"/><text x="120" y="110" fill="#eef3f8" font-family="Arial" font-size="52" font-weight="700">Hot Wallet vs Cold Wallet</text><rect x="120" y="180" width="600" height="560" rx="28" fill="#111823" stroke="#58a6ff"/><rect x="880" y="180" width="600" height="560" rx="28" fill="#111823" stroke="#42d392"/><text x="340" y="260" fill="#eef3f8" font-family="Arial" font-size="44" font-weight="700">Hot Wallet</text><text x="1085" y="260" fill="#eef3f8" font-family="Arial" font-size="44" font-weight="700">Cold Wallet</text><text x="180" y="350" fill="#aeb8c6" font-family="Arial" font-size="30">Connected to internet</text><text x="180" y="410" fill="#aeb8c6" font-family="Arial" font-size="30">Fast daily use</text><text x="180" y="470" fill="#aeb8c6" font-family="Arial" font-size="30">Best for active movement</text><text x="180" y="530" fill="#aeb8c6" font-family="Arial" font-size="30">Higher exposure</text><text x="940" y="350" fill="#aeb8c6" font-family="Arial" font-size="30">Offline or isolated</text><text x="940" y="410" fill="#aeb8c6" font-family="Arial" font-size="30">Slower access</text><text x="940" y="470" fill="#aeb8c6" font-family="Arial" font-size="30">Best for long-term storage</text><text x="940" y="530" fill="#aeb8c6" font-family="Arial" font-size="30">Stronger security posture</text></svg>