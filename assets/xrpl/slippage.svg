<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#071018"/>
  <text x="100" y="100" fill="#eef3f8" font-size="52" font-family="Arial" font-weight="700">Slippage Effect</text>

  <text x="140" y="190" fill="#d4a44a" font-size="28" font-family="Arial" font-weight="700">Bigger order. Worse execution.</text>

  <line x1="160" y1="700" x2="1440" y2="700" stroke="#38506a" stroke-width="4"/>
  <line x1="160" y1="180" x2="160" y2="700" stroke="#38506a" stroke-width="4"/>

  <polyline points="220,640 420,590 620,530 820,450 1020,350 1220,230"
            fill="none" stroke="#ff6b6b" stroke-width="8"/>

  <circle cx="420" cy="590" r="14" fill="#58a6ff"/>
  <circle cx="1220" cy="230" r="14" fill="#ff6b6b"/>

  <text x="360" y="560" fill="#58a6ff" font-size="28" font-family="Arial" font-weight="700">Small order</text>
  <text x="1180" y="200" fill="#ff6b6b" font-size="28" font-family="Arial" font-weight="700">Large order</text>

  <text x="240" y="780" fill="#aeb8c6" font-size="28" font-family="Arial">Lower impact</text>
  <text x="1080" y="780" fill="#aeb8c6" font-size="28" font-family="Arial">Higher impact</text>

  <text x="220" y="835" fill="#ff6b6b" font-size="28" font-family="Arial" font-weight="700">The more size you force through, the worse the price gets</text>
</svg>