<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b1018"/><text x="120" y="110" fill="#eef3f8" font-family="Arial" font-size="52" font-weight="700">Exchange vs Wallet</text><rect x="120" y="180" width="600" height="560" rx="28" fill="#111823" stroke="#d4a44a"/><rect x="880" y="180" width="600" height="560" rx="28" fill="#111823" stroke="#58a6ff"/><text x="310" y="260" fill="#eef3f8" font-family="Arial" font-size="44" font-weight="700">Exchange</text><text x="1115" y="260" fill="#eef3f8" font-family="Arial" font-size="44" font-weight="700">Wallet</text><text x="180" y="350" fill="#aeb8c6" font-family="Arial" font-size="30">Company custody</text><text x="180" y="410" fill="#aeb8c6" font-family="Arial" font-size="30">Login and platform rules</text><text x="180" y="470" fill="#aeb8c6" font-family="Arial" font-size="30">Good for buying and selling</text><text x="180" y="530" fill="#aeb8c6" font-family="Arial" font-size="30">You do not hold keys</text><text x="940" y="350" fill="#aeb8c6" font-family="Arial" font-size="30">Direct key control</text><text x="940" y="410" fill="#aeb8c6" font-family="Arial" font-size="30">Direct ledger signing</text><text x="940" y="470" fill="#aeb8c6" font-family="Arial" font-size="30">Best for ownership</text><text x="940" y="530" fill="#aeb8c6" font-family="Arial" font-size="30">You control the assets</text></svg>