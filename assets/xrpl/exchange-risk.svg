<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b1018"/><text x="120" y="110" fill="#eef3f8" font-family="Arial" font-size="52" font-weight="700">Exchange Risk</text><rect x="180" y="230" width="1240" height="460" rx="28" fill="#111823" stroke="#d4a44a"/><text x="610" y="310" fill="#eef3f8" font-family="Arial" font-size="42" font-weight="700">Exchange Account</text><text x="300" y="420" fill="#aeb8c6" font-family="Arial" font-size="30">Good for on-ramp and off-ramp</text><text x="300" y="480" fill="#aeb8c6" font-family="Arial" font-size="30">Company controls access</text><text x="300" y="540" fill="#aeb8c6" font-family="Arial" font-size="30">Outages and restrictions are real</text><text x="300" y="600" fill="#aeb8c6" font-family="Arial" font-size="30">Not the same as self-custody</text></svg>