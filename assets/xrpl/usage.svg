<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1218; }
    .line { stroke: #58a6ff; stroke-width: 2; opacity: 0.8; }
    .node { fill: #111823; stroke: #58a6ff; stroke-width: 1.5; }
    .text { fill: #eef3f8; font-size: 14px; font-family: system-ui; }
  </style>

  <rect class="bg" width="800" height="300" rx="20"/>

  <!-- central rail -->
  <line class="line" x1="200" y1="150" x2="600" y2="150"/>

  <!-- nodes -->
  <circle class="node" cx="200" cy="150" r="20"/>
  <circle class="node" cx="350" cy="150" r="20"/>
  <circle class="node" cx="500" cy="150" r="20"/>
  <circle class="node" cx="600" cy="150" r="20"/>

  <!-- labels -->
  <text class="text" x="170" y="190">Apps</text>
  <text class="text" x="320" y="190">Usage</text>
  <text class="text" x="470" y="190">Liquidity</text>
  <text class="text" x="580" y="190">$XRP</text>
</svg>
