<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b1018"/><text x="120" y="110" fill="#eef3f8" font-family="Arial" font-size="52" font-weight="700">AMM vs DEX</text><rect x="120" y="180" width="600" height="560" rx="28" fill="#111823" stroke="#42d392"/><rect x="880" y="180" width="600" height="560" rx="28" fill="#111823" stroke="#58a6ff"/><text x="355" y="260" fill="#eef3f8" font-family="Arial" font-size="44" font-weight="700">AMM</text><text x="1130" y="260" fill="#eef3f8" font-family="Arial" font-size="44" font-weight="700">DEX</text><text x="180" y="350" fill="#aeb8c6" font-family="Arial" font-size="30">Pool based</text><text x="180" y="410" fill="#aeb8c6" font-family="Arial" font-size="30">Instant swap flow</text><text x="180" y="470" fill="#aeb8c6" font-family="Arial" font-size="30">Price moves with size</text><text x="180" y="530" fill="#aeb8c6" font-family="Arial" font-size="30">Slippage matters</text><text x="940" y="350" fill="#aeb8c6" font-family="Arial" font-size="30">Order book based</text><text x="940" y="410" fill="#aeb8c6" font-family="Arial" font-size="30">Matches buyers and sellers</text><text x="940" y="470" fill="#aeb8c6" font-family="Arial" font-size="30">More price control</text><text x="940" y="530" fill="#aeb8c6" font-family="Arial" font-size="30">Needs active liquidity</text></svg>