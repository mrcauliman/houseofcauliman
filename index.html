  <style>
    :root{
      --bg:#050509;
      --bg-soft:#090910;
      --card:#11121a;
      --border-subtle:#1a1b24;
      --border-strong:#2b3345;
      --accent:#0a74d0;
      --accent-glow:rgba(10,116,208,0.65);
      --text:#f5f7ff;
      --text-muted:#9aa2c3;
      --text-soft:#717895;
      --wck-gold:#d4a44a;
      --rad-blue:#3da0ff;
      --bag-green:#4ade80;
      --augur-mint:#2bf3a2;
      --augur-mint-glow:rgba(43,243,162,0.22);
      --mono-ink:#f5f7ff;
      --mono-glow:rgba(245,247,255,0.12);
      --mono-border:rgba(245,247,255,0.18);
      --radius-lg:18px;
      --radius-xl:22px;
      --shadow-soft:0 18px 45px rgba(0,0,0,0.75);
      --shadow-glow:0 0 32px rgba(10,116,208,0.7);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      width:100%;
      overflow-x:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(circle at top,#111827 0,#020308 55%,#000 100%);
      color:var(--text);
    }
    a{color:inherit;text-decoration:none}

    .hoc-header{
      padding:24px 20px 10px;
      background:radial-gradient(circle at top,#0a74d0 0,#050509 55%,#000 100%);
      border-bottom:1px solid #151827;
      box-shadow:0 20px 40px rgba(0,0,0,0.75);
    }
    .hoc-header-inner{
      max-width:960px;
      margin:0 auto;
      display:flex;
      align-items:center;
      gap:18px;
    }
    .hoc-brand-mark{
      width:82px;
      height:82px;
      object-fit:contain;
      border-radius:20px;
      border:1px solid #1b3a62;
      box-shadow:0 0 28px var(--accent-glow);
      background:radial-gradient(circle at 30% 0,#1f2937 0,#020308 70%);
    }
    .hoc-header-text h1{
      margin:0;
      font-size:1.5rem;
      letter-spacing:0.15em;
      text-transform:uppercase;
    }
    .hoc-header-text p{
      margin:5px 0 0;
      font-size:0.92rem;
      color:#9fb4e2;
      line-height:1.45;
    }

    .hoc-main{padding:22px 16px 40px}
    .hoc-shell{max-width:960px;margin:0 auto}

    .hoc-intro{
      margin-bottom:22px;
      padding:16px 18px 18px;
      border-radius:var(--radius-lg);
      border:1px solid rgba(26,31,55,0.9);
      background:linear-gradient(135deg,rgba(15,23,42,0.9),rgba(5,6,12,0.98));
      box-shadow:0 14px 34px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.14) inset, 0 0 0 1px rgba(88,166,255,.22), 0 0 18px rgba(88,166,255,.12);
    }
    .hoc-intro-title{
      font-size:0.82rem;
      text-transform:uppercase;
      letter-spacing:0.18em;
      color:var(--text-soft);
      margin:0 0 6px;
    }
    .hoc-intro-main{
      font-size:0.97rem;
      color:var(--text-muted);
      margin:0;
      line-height:1.5;
    }

    .hud{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      padding:.35rem .6rem;
      border-radius:999px;
      font:700 12px/1 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      letter-spacing:.08em;
      text-transform:uppercase;
      border:1px solid rgba(255,255,255,.34);
      background:rgba(255,255,255,.06);
      color:#eaf0f7;
      white-space:nowrap;
      margin-right:8px;
      margin-top:6px;
    }
    .hud .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#a9b3bf;
      box-shadow:0 0 0 3px rgba(169,179,191,.18);
    }
    .hud.live .dot{ background:#2fbf6b; box-shadow:0 0 0 3px rgba(47,191,107,.20); }
    .hud.token-live .dot{ background:#4bd08a; box-shadow:0 0 0 3px rgba(75,208,138,.20); }
    .hud.utility-live .dot{ background:#4fb7ff; box-shadow:0 0 0 3px rgba(79,183,255,.20); }
    .hud.active-build .dot{ background:#ffe175; box-shadow:0 0 0 3px rgba(255,225,117,.22); }
    .hud.private-build .dot{ background:#aeb7af; box-shadow:0 0 0 3px rgba(169,179,191,.18); }

    @media (prefers-reduced-motion:no-preference){
      .hud.pulse{animation:hudpulse 1.8s ease-in-out infinite}
      @keyframes hudpulse{0%,100%{opacity:1}50%{opacity:.62}}
    }

    .hud-legend{
      display:flex;
      flex-wrap:wrap;
      gap:.7rem .9rem;
      margin:.8rem 0 1rem;
      padding:.85rem .9rem;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
    }
    .hud-legend .item{
      display:flex;
      align-items:flex-start;
      gap:.5rem;
      font:700 12px/1.15 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:#cfd6de;
      max-width:260px;
    }
    .hud-legend .key{
      width:10px;
      height:10px;
      border-radius:999px;
      margin-top:2px;
      flex:0 0 auto;
    }
    .hud-legend .item small{
      display:block;
      font:500 11px/1.25 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text-soft);
      margin-top:2px;
    }
    .hud-legend .k-live{ background:#2fbf6b; }
    .hud-legend .k-token-live{ background:#4bd08a; }
    .hud-legend .k-utility-live{ background:#4fb7ff; }
    .hud-legend .k-active-build{ background:#ffe175; }
    .hud-legend .k-private-build{ background:#aeb7af; }

    .stack-card{
      margin:0 0 18px;
      padding:18px 18px 16px;
      border-radius:var(--radius-xl);
      border:1px solid rgba(43,243,162,0.18);
      background:
        radial-gradient(circle at 12% 0, rgba(43,243,162,0.16) 0, rgba(2,6,23,0) 55%),
        radial-gradient(circle at 80% 10%, rgba(10,116,208,0.18) 0, rgba(0,0,0,0) 60%),
        linear-gradient(135deg, rgba(15,23,42,0.92), rgba(0,0,0,0.98));
      box-shadow:var(--shadow-soft);
      position:relative;
      overflow:hidden;
    }
    .stack-card.mono{
      border-color:var(--mono-border);
      background:
        radial-gradient(circle at 16% 0, rgba(245,247,255,0.08) 0, rgba(2,6,23,0) 55%),
        radial-gradient(circle at 82% 12%, rgba(10,116,208,0.12) 0, rgba(0,0,0,0) 60%),
        linear-gradient(135deg, rgba(10,12,22,0.92), rgba(0,0,0,0.98));
    }
    .stack-card.gold{
      border-color:rgba(212,164,74,0.28);
      background:
        radial-gradient(circle at 12% 0, rgba(212,164,74,0.18) 0, rgba(2,6,23,0) 55%),
        radial-gradient(circle at 80% 10%, rgba(10,116,208,0.14) 0, rgba(0,0,0,0) 60%),
        linear-gradient(135deg, rgba(20,14,8,0.96), rgba(0,0,0,0.98));
    }
    .stack-card.blue{
      border-color:rgba(61,160,255,0.28);
      background:
        radial-gradient(circle at 12% 0, rgba(61,160,255,0.18) 0, rgba(2,6,23,0) 55%),
        radial-gradient(circle at 80% 10%, rgba(10,116,208,0.16) 0, rgba(0,0,0,0) 60%),
        linear-gradient(135deg, rgba(8,18,34,0.96), rgba(0,0,0,0.98));
    }
    .stack-card.green{
      border-color:rgba(74,222,128,0.28);
      background:
        radial-gradient(circle at 12% 0, rgba(74,222,128,0.18) 0, rgba(2,6,23,0) 55%),
        radial-gradient(circle at 80% 10%, rgba(10,116,208,0.14) 0, rgba(0,0,0,0) 60%),
        linear-gradient(135deg, rgba(6,22,14,0.96), rgba(0,0,0,0.98));
    }

    .stack-head{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:flex-start;
      padding:10px 10px 12px;
      border-radius:18px;
      border:1px solid rgba(43,243,162,0.12);
      background:
        radial-gradient(circle at 10% 10%, rgba(43,243,162,0.14) 0, rgba(0,0,0,0) 55%),
        linear-gradient(135deg, rgba(15,23,42,0.55), rgba(0,0,0,0.55));
      box-shadow:0 10px 26px rgba(0,0,0,0.55);
    }
    .stack-card.mono .stack-head{
      border-color:rgba(245,247,255,0.12);
      background:
        radial-gradient(circle at 10% 10%, rgba(245,247,255,0.08) 0, rgba(0,0,0,0) 55%),
        linear-gradient(135deg, rgba(15,23,42,0.55), rgba(0,0,0,0.55));
    }
    .stack-mark{
      width:112px;
      height:112px;
      border-radius:20px;
      border:1px solid rgba(191,255,227,0.18);
      background:
        radial-gradient(circle at 30% 0, rgba(43,243,162,0.12) 0, rgba(2,6,23,0.0) 60%),
        radial-gradient(circle at 70% 70%, rgba(10,116,208,0.12) 0, rgba(0,0,0,0) 55%),
        linear-gradient(135deg, rgba(15,23,42,0.9), rgba(0,0,0,0.95));
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 0 26px rgba(43,243,162,0.12);
      flex:0 0 auto;
    }
    .stack-card.mono .stack-mark{
      border-color:rgba(245,247,255,0.18);
      background:
        radial-gradient(circle at 30% 0, rgba(245,247,255,0.10) 0, rgba(2,6,23,0.0) 60%),
        radial-gradient(circle at 70% 70%, rgba(10,116,208,0.10) 0, rgba(0,0,0,0) 55%),
        linear-gradient(135deg, rgba(15,23,42,0.9), rgba(0,0,0,0.95));
      box-shadow:0 0 26px rgba(245,247,255,0.08);
    }
    .stack-logo{
      width:102px;
      height:102px;
      object-fit:contain;
      filter:drop-shadow(0 0 22px rgba(0,0,0,0.95)) drop-shadow(0 0 22px rgba(43,243,162,0.18));
    }
    .stack-card.mono .stack-logo{
      filter:drop-shadow(0 0 22px rgba(0,0,0,0.95)) drop-shadow(0 0 18px rgba(245,247,255,0.12));
    }
    .stack-title{
      margin:0;
      font-size:1.05rem;
      letter-spacing:0.14em;
      text-transform:uppercase;
      font-weight:900;
      color:#bfffe3;
    }
    .stack-card.mono .stack-title{color:var(--mono-ink)}
    .stack-card.gold .stack-title{color:var(--wck-gold)}
    .stack-card.blue .stack-title{color:var(--rad-blue)}
    .stack-card.green .stack-title{color:var(--bag-green)}
    .stack-sub{
      margin:6px 0 0;
      font-size:0.78rem;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:#d6ffe9;
      font-weight:900;
      opacity:0.95;
    }
    .stack-card.mono .stack-sub{color:#eef0ff}

    .stack-copy{
      margin:14px 0 12px;
      font-size:0.92rem;
      color:var(--text-muted);
      line-height:1.55;
    }
    .stack-bullets{
      list-style:none;
      padding:0;
      margin:10px 0 14px;
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    @media(min-width:860px){.stack-bullets{grid-template-columns:1fr 1fr}}
    .stack-bullets li{
      position:relative;
      padding:10px 12px 10px 40px;
      border-radius:16px;
      border:1px solid rgba(43,243,162,0.14);
      background:linear-gradient(135deg, rgba(15,23,42,0.98), rgba(3,7,18,0.98));
      box-shadow:0 10px 26px rgba(0,0,0,0.75);
      color:#dbe3ff;
      font-weight:750;
      font-size:0.84rem;
      line-height:1.45;
    }
    .stack-card.mono .stack-bullets li{border-color:rgba(245,247,255,0.12)}
    .stack-card.gold .stack-bullets li{border-color:rgba(212,164,74,0.16)}
    .stack-card.blue .stack-bullets li{border-color:rgba(61,160,255,0.16)}
    .stack-card.green .stack-bullets li{border-color:rgba(74,222,128,0.16)}
    .stack-bullets li:before{
      content:"✓";
      position:absolute;
      left:12px;
      top:10px;
      width:20px;
      height:20px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#03140d;
      background:radial-gradient(circle at 30% 0, rgba(191,255,227,1) 0, rgba(43,243,162,1) 55%, rgba(4,80,55,1) 100%);
      box-shadow:0 0 18px var(--augur-mint-glow);
      border:1px solid rgba(191,255,227,0.35);
      font-weight:900;
    }
    .stack-card.mono .stack-bullets li:before{
      content:"■";
      color:#0a0b10;
      background:radial-gradient(circle at 30% 0, rgba(245,247,255,1) 0, rgba(245,247,255,0.92) 55%, rgba(210,214,230,1) 100%);
      box-shadow:0 0 18px var(--mono-glow);
      border-color:rgba(245,247,255,0.28);
    }
    .stack-card.gold .stack-bullets li:before{
      background:radial-gradient(circle at 30% 0, #f2d38f 0, #d4a44a 60%, #7b5a1f 100%);
      color:#130d02;
      border-color:rgba(242,211,143,0.35);
      box-shadow:0 0 18px rgba(212,164,74,0.22);
    }
    .stack-card.blue .stack-bullets li:before{
      background:radial-gradient(circle at 30% 0, #8ac8ff 0, #3da0ff 60%, #11497c 100%);
      color:#04111d;
      border-color:rgba(138,200,255,0.35);
      box-shadow:0 0 18px rgba(61,160,255,0.22);
    }
    .stack-card.green .stack-bullets li:before{
      background:radial-gradient(circle at 30% 0, #b8f7ca 0, #4ade80 60%, #166534 100%);
      color:#03140d;
      border-color:rgba(184,247,202,0.35);
      box-shadow:0 0 18px rgba(74,222,128,0.22);
    }

    .stack-cta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:6px;
    }
    .stack-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:9px 12px;
      border-radius:999px;
      border:1px solid rgba(43,243,162,0.22);
      background:linear-gradient(135deg, rgba(15,23,42,0.98), rgba(3,7,18,0.98));
      box-shadow:0 8px 22px rgba(0,0,0,0.85);
      text-transform:uppercase;
      letter-spacing:0.16em;
      font-size:0.76rem;
      font-weight:700;
      color:#dbe3ff;
      transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease;
    }
    .stack-btn:hover{
      border-color:rgba(43,243,162,0.55);
      box-shadow:0 0 26px rgba(43,243,162,0.18);
      transform:translateY(-1px);
    }
    .stack-card.mono .stack-btn{border-color:rgba(245,247,255,0.18)}
    .stack-card.mono .stack-btn:hover{
      border-color:rgba(245,247,255,0.38);
      box-shadow:0 0 26px rgba(245,247,255,0.10);
    }
    .stack-btn.primary{
      background:radial-gradient(circle at 20% 0, rgba(191,255,227,1) 0, rgba(43,243,162,1) 55%, rgba(4,80,55,1) 100%);
      border-color:rgba(191,255,227,0.35);
      color:#03140d;
      box-shadow:0 0 30px rgba(43,243,162,0.18);
    }
    .stack-card.mono .stack-btn.primary{
      background:radial-gradient(circle at 20% 0, rgba(245,247,255,1) 0, rgba(245,247,255,0.90) 55%, rgba(210,214,230,1) 100%);
      border-color:rgba(245,247,255,0.18);
      color:#0a0b10;
      box-shadow:0 0 28px rgba(245,247,255,0.12);
    }
    .stack-card.gold .stack-btn.primary{
      background:radial-gradient(circle at 20% 0, #f2d38f 0, #d4a44a 60%, #7b5a1f 100%);
      color:#130d02;
      border-color:rgba(242,211,143,0.35);
    }
    .stack-card.blue .stack-btn.primary{
      background:radial-gradient(circle at 20% 0, #8ac8ff 0, #3da0ff 60%, #11497c 100%);
      color:#04111d;
      border-color:rgba(138,200,255,0.35);
    }
    .stack-card.green .stack-btn.primary{
      background:radial-gradient(circle at 20% 0, #b8f7ca 0, #4ade80 60%, #166534 100%);
      color:#03140d;
      border-color:rgba(184,247,202,0.35);
    }

    .project-card{
      border-radius:var(--radius-xl);
      border:1px solid rgba(255,255,255,.34);
      background:radial-gradient(circle at top,rgba(26,35,58,0.85) 0,#050509 55%,#000 100%);
      box-shadow:var(--shadow-soft);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:300px;
      position:relative;
      isolation:isolate;
    }
    .project-card::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius:inherit;
      background:conic-gradient(from 210deg,rgba(10,116,208,0.4),transparent 18%,transparent 60%,rgba(10,116,208,0.35),rgba(212,164,74,0.3),transparent 88%,rgba(10,116,208,0.4));
      opacity:0;
      transition:opacity .3s ease;
      z-index:-1;
    }
    .project-card:hover::before{opacity:.65}
    .project-media{
      position:relative;
      padding:14px;
      border-bottom:1px solid rgba(37,44,70,0.9);
      background:radial-gradient(circle at top,#111827 0,#020308 70%);
    }
    .project-wallpaper{
      height:120px;
      border-radius:16px;
      border:1px solid rgba(46,57,98,0.9);
      background:radial-gradient(circle at top,rgba(15,23,42,0.95),#020308 65%);
      box-shadow:0 16px 32px rgba(0,0,0,0.9);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    .project-logo{
      width:86px;
      height:86px;
      object-fit:contain;
      filter:drop-shadow(0 0 24px rgba(0,0,0,0.95)) drop-shadow(0 0 24px rgba(10,116,208,0.65));
    }
    .project-tag{
      position:absolute;
      right:10px;
      bottom:8px;
      font-size:0.7rem;
      letter-spacing:0.16em;
      text-transform:uppercase;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.35);
      background:rgba(15,23,42,0.92);
      color:#cbd5f5;
      backdrop-filter:blur(8px);
    }
    .project-body{padding:14px;display:flex;flex-direction:column;gap:6px}
    .project-title{margin:0;font-size:1rem;letter-spacing:0.12em;text-transform:uppercase}
    .project-sub{margin:0;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.18em;color:var(--text-soft)}
    .project-copy{margin:6px 0 10px;font-size:0.86rem;line-height:1.5;color:var(--text-muted)}
    .project-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
    .project-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      font-size:0.78rem;
      padding:7px 11px;
      border-radius:999px;
      border:1px solid var(--border-strong);
      background:linear-gradient(135deg,rgba(15,23,42,0.98),rgba(3,7,18,0.98));
      box-shadow:0 8px 20px rgba(0,0,0,0.9);
      text-transform:uppercase;
      letter-spacing:0.16em;
      color:#dbe3ff;
      transition:border-color .2s ease,box-shadow .2s ease,transform .15s ease;
      cursor:pointer;
    }
    .project-link:hover{
      border-color:var(--accent);
      box-shadow:var(--shadow-glow);
      transform:translateY(-1px);
    }

    .hoc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
    @media (max-width:980px){.hoc-grid{grid-template-columns:1fr}}

    .hoc-footer{
      max-width:960px;
      margin:10px auto 26px;
      padding:10px 18px 0;
      border-top:1px solid #141728;
      color:var(--text-soft);
      font-size:0.78rem;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }

    .thesis-image{
      width:100%;
      height:auto;
      display:block;
      border-radius:14px;
      margin-top:12px;
      box-shadow:0 12px 30px rgba(0,0,0,0.8);
    }

    .nav-link-card{text-align:center;padding:20px}
    .nav-link-card a{
      color:var(--text);
      font-size:0.95rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      padding:10px 20px;
      border:1px solid var(--border-subtle);
      border-radius:var(--radius-xl);
      transition:all .25s ease;
      display:inline-block;
    }
    .nav-link-card a:hover{
      border-color:var(--accent);
      box-shadow:0 0 20px var(--accent-glow);
    }

    @media (max-width:520px){
      .stack-head{gap:14px}
      .stack-mark{width:100px;height:100px;border-radius:18px}
      .stack-logo{width:92px;height:92px}
      .hoc-header-inner{align-items:flex-start}
      .hoc-brand-mark{width:72px;height:72px}
      .hoc-footer{flex-direction:column}
    }
