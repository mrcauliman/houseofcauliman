<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />
  <style>
    :root{
      --bg:#07090b;
      --panel:#0c1116;
      --panel2:#0f151c;
      --line:#1f2a36;
      --fg:#f5f7f4;
      --muted:#a9b3bd;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;
      --shadow:rgba(0,0,0,.55);
      --radius:16px;
      --step:86px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 700px at 50% -10%, rgba(47,191,107,.10), transparent 55%),
                  radial-gradient(900px 520px at 18% 0%, rgba(255,255,255,.05), transparent 55%),
                  var(--bg);
      color:var(--fg);
      overflow:hidden;
    }
    a{color:inherit;text-decoration:none}
    .wrap{position:relative; height:100%; width:100%}

    .hud{
      position:absolute; left:16px; right:16px; top:14px;
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      pointer-events:none;
      z-index:10;
    }
    .hud .left, .hud .right{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap}
    .brand{
      pointer-events:auto;
      display:flex; align-items:center; gap:10px;
      border:1px solid var(--line);
      background: rgba(12,17,22,.78);
      backdrop-filter: blur(8px);
      padding:10px 12px;
      border-radius:999px;
      box-shadow:0 18px 40px var(--shadow);
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background:var(--green);
      box-shadow:0 0 18px rgba(47,191,107,.25);
      flex:0 0 auto;
    }
    .brand b{font-size:12px;letter-spacing:.2px}
    .brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
    .btn{
      pointer-events:auto;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(12,17,22,.78);
      backdrop-filter: blur(8px);
      padding:10px 12px;
      border-radius:999px;
      font-size:12px;
      color:var(--fg);
      display:inline-flex;
      gap:10px;
      align-items:center;
      box-shadow:0 18px 40px var(--shadow);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{border-color:rgba(47,191,107,.45)}
    .btn.primary{border-color:rgba(47,191,107,.45)}
    .btn .k{color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.25px}

    .viewport{
      position:absolute; inset:0;
      touch-action:none;
      cursor:grab;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .viewport.dragging{cursor:grabbing}
    .world{
      position:absolute; left:0; top:0;
      will-change:transform;
    }

    .tcell{
      position:absolute;
      width:var(--step);
      height:var(--step);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      overflow:hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,.35);
      transform: translateZ(0);
    }
    .tcell:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0));
      opacity:.9;
      pointer-events:none;
    }
    .tcell .meta{
      position:absolute; left:10px; top:10px;
      font-size:10px; color:rgba(169,179,189,.85);
      letter-spacing:.25px;
      font-weight:800;
      text-shadow:0 1px 0 rgba(0,0,0,.35);
      pointer-events:none;
    }

    .tcell.taken{
      border-color: rgba(47,191,107,.45);
      background: rgba(47,191,107,.06);
    }
    .tcell.taken:after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(70px 70px at 30% 25%, rgba(255,255,255,.10), transparent 60%),
                  radial-gradient(90px 90px at 70% 75%, rgba(0,0,0,.25), transparent 60%);
      opacity:.65;
      pointer-events:none;
      mix-blend-mode: overlay;
    }

    .mark{
      position:absolute; inset:0;
      padding:12px 10px 10px;
      display:flex;
      flex-direction:column;
      gap:6px;
      justify-content:flex-end;
    }
    .tag{
      display:inline-block;
      max-width:100%;
      font-weight:900;
      letter-spacing:.6px;
      text-transform:uppercase;
      line-height:1.1;
      font-size:12px;
      text-shadow: 0 2px 0 rgba(0,0,0,.55);
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .sig{
      font-size:10px;
      color:rgba(245,247,244,.78);
      font-weight:800;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .sig .w{
      color:rgba(169,179,189,.95);
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:60%;
    }
    .sig .t{
      color:rgba(169,179,189,.75);
      font-weight:800;
      white-space:nowrap;
    }

    .spray{
      position:absolute;
      inset:-10px;
      opacity:.92;
      pointer-events:none;
      mix-blend-mode: screen;
      filter: blur(.0px);
    }

    .hint{
      pointer-events:none;
      position:absolute;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      padding:9px 12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(12,17,22,.70);
      backdrop-filter: blur(10px);
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      box-shadow:0 18px 40px var(--shadow);
      z-index:10;
      max-width:92vw;
      text-align:center;
    }
    .hint b{color:var(--fg)}
    .hint .ok{color:var(--green); font-weight:900}
    .hint .warn{color:var(--warn); font-weight:900}

    .panel{
      position:absolute;
      right:16px;
      top:84px;
      width:min(420px, calc(100vw - 32px));
      border:1px solid var(--line);
      background: rgba(12,17,22,.88);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      box-shadow: 0 24px 60px var(--shadow);
      z-index:11;
      overflow:hidden;
      display:none;
      pointer-events:auto;
    }
    .panel.open{display:block}
    .panel .ph{
      padding:14px 14px 0;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .panel h3{margin:0;font-size:14px}
    .panel .x{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      color:var(--fg);
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-size:12px;
      user-select:none;
    }
    .panel .x:hover{border-color:rgba(47,191,107,.45)}
    .panel .pc{
      padding:12px 14px 16px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .kv{
      display:grid;
      grid-template-columns: 92px 1fr;
      gap:8px 10px;
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .k{color:rgba(169,179,189,.85); font-weight:900; letter-spacing:.2px}
    .v{color:var(--fg); font-weight:800; word-break:break-word}
    .pill{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      margin-top:10px;
    }

    @media(max-width:640px){
      .panel{right:16px; left:16px; width:auto}
      .hud{top:10px; left:10px; right:10px}
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="hud">
      <div class="left">
        <div class="brand">
          <div class="dot"></div>
          <div>
            <b>MONOLITH</b>
            <span>Drag to move. Tap a tile to inspect.</span>
          </div>
        </div>

        <a class="btn primary" href="/monolith/claim/">
          <span class="k">ACTION</span>
          <span>Claim a Tile</span>
        </a>
      </div>

      <div class="right">
        <button class="btn" id="recenter" type="button">
          <span class="k">VIEW</span>
          <span>Recenter</span>
        </button>
        <a class="btn" href="/assets/monolith/feed.json" target="_blank" rel="noreferrer">
          <span class="k">DATA</span>
          <span>feed.json</span>
        </a>
      </div>
    </div>

    <div class="panel" id="panel" role="dialog" aria-label="tile details">
      <div class="ph">
        <div>
          <h3 id="ptitle">Tile</h3>
          <div class="pill" id="pstate">Status</div>
        </div>
        <div class="x" id="pclose">Close</div>
      </div>
      <div class="pc" id="pbody">
        Tap a tile to inspect details.
      </div>
    </div>

    <div class="hint" id="hint">
      <b>Move</b> freely in any direction. Inertia is on. <span class="ok">Endless wall</span>.
    </div>

    <div class="viewport" id="vp" aria-label="monolith wall viewport">
      <div class="world" id="world" aria-label="monolith wall world"></div>
    </div>

  </div>

  <script>
  ;(() => {
    const FEED_URL = "/assets/monolith/feed.json";

    const vp = document.getElementById("vp");
    const world = document.getElementById("world");

    const panel = document.getElementById("panel");
    const ptitle = document.getElementById("ptitle");
    const pstate = document.getElementById("pstate");
    const pbody  = document.getElementById("pbody");
    const pclose = document.getElementById("pclose");
    const recenterBtn = document.getElementById("recenter");

    const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step"), 10) || 86;
    const PAD = 3;            // extra ring of tiles around viewport
    const MAX_VEL = 52;       // max inertia
    const FRICTION = 0.92;    // inertia decay
    const DRAG_GAIN = 1.0;    // drag sensitivity

    const state = {
      camX: 0,
      camY: 0,
      vx: 0,
      vy: 0,
      dragging: false,
      pid: null,
      lastX: 0,
      lastY: 0,
      lastT: 0,
      w: 0,
      h: 0,
      cols: 0,
      rows: 0,
      pool: [],
      used: new Map(),    // key -> element
      takenByKey: new Map(), // key -> mark
      takenStamp: 0,
      loadedOnce: false,
      lastFeedFetch: 0,
      selectedKey: null
    };

    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    function key(gx, gy){ return gx + ":" + gy; }

    function formatTileId(gx, gy){
      // stable visible id, not “infinite index”
      // centered around 0,0. show signed coords.
      const sx = gx >= 0 ? "+" + gx : "" + gx;
      const sy = gy >= 0 ? "+" + gy : "" + gy;
      return sx + "," + sy;
    }

    function seededHash(str){
      let h = 2166136261;
      for(let i=0;i<str.length;i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0);
    }

    function colorForKey(k){
      const h = seededHash(k);
      const hue = (h % 360);
      const sat = 62 + (h % 18);
      const lit = 54 + (h % 10);
      return `hsl(${hue} ${sat}% ${lit}%)`;
    }

    function spraySvg(k){
      const h = seededHash(k);
      const a = 0.22 + ((h % 30) / 100);
      const b = 0.12 + (((h >>> 5) % 25) / 100);
      const c = 0.10 + (((h >>> 9) % 20) / 100);
      const r1 = 28 + (h % 28);
      const r2 = 22 + ((h >>> 6) % 36);
      const r3 = 18 + ((h >>> 11) % 42);
      const x1 = 22 + (h % 40);
      const y1 = 18 + ((h >>> 4) % 44);
      const x2 = 52 + ((h >>> 7) % 38);
      const y2 = 58 + ((h >>> 8) % 36);
      const x3 = 78 + ((h >>> 10) % 34);
      const y3 = 30 + ((h >>> 12) % 42);

      const col = colorForKey(k);
      const svg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%">
      <stop offset="0%" stop-color="${col}" stop-opacity="${a}"/>
      <stop offset="55%" stop-color="${col}" stop-opacity="${b}"/>
      <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="${x1}" cy="${y1}" r="${r1}" fill="url(#g)"/>
  <circle cx="${x2}" cy="${y2}" r="${r2}" fill="url(#g)"/>
  <circle cx="${x3}" cy="${y3}" r="${r3}" fill="url(#g)"/>
  <g fill="${col}" opacity="${c}">
    <circle cx="${(h%100)}" cy="${((h>>>3)%100)}" r="2.2"/>
    <circle cx="${((h>>>2)%100)}" cy="${((h>>>6)%100)}" r="1.8"/>
    <circle cx="${((h>>>5)%100)}" cy="${((h>>>9)%100)}" r="1.6"/>
    <circle cx="${((h>>>8)%100)}" cy="${((h>>>12)%100)}" r="1.4"/>
  </g>
</svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function takeFromPool(){
      let el = state.pool.pop();
      if(!el){
        el = document.createElement("div");
        el.className = "tcell";
        el.innerHTML = `
          <div class="meta"></div>
          <div class="mark" hidden>
            <div class="tag"></div>
            <div class="sig">
              <div class="w"></div>
              <div class="t"></div>
            </div>
          </div>
          <img class="spray" alt="" />
        `;
        el.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const gx = parseInt(el.getAttribute("data-gx"), 10);
          const gy = parseInt(el.getAttribute("data-gy"), 10);
          openPanel(gx, gy);
        });
      }
      return el;
    }

    function releaseToPool(el){
      el.className = "tcell";
      el.style.left = "0px";
      el.style.top  = "0px";
      el.removeAttribute("data-gx");
      el.removeAttribute("data-gy");
      el.removeAttribute("data-key");

      const meta = el.querySelector(".meta");
      if(meta) meta.textContent = "";

      const mark = el.querySelector(".mark");
      if(mark) mark.hidden = true;

      const tag = el.querySelector(".tag");
      if(tag) tag.textContent = "";

      const w = el.querySelector(".w");
      if(w) w.textContent = "";

      const t = el.querySelector(".t");
      if(t) t.textContent = "";

      const spray = el.querySelector(".spray");
      if(spray) spray.removeAttribute("src");

      state.pool.push(el);
    }

    function setCell(el, gx, gy){
      const k = key(gx, gy);
      el.setAttribute("data-gx", gx);
      el.setAttribute("data-gy", gy);
      el.setAttribute("data-key", k);

      el.style.left = (gx * STEP) + "px";
      el.style.top  = (gy * STEP) + "px";

      const meta = el.querySelector(".meta");
      meta.textContent = formatTileId(gx, gy);

      const markObj = state.takenByKey.get(k);
      if(markObj){
        el.classList.add("taken");
        renderMark(el, k, markObj);
      }else{
        el.classList.remove("taken");
        const mark = el.querySelector(".mark");
        if(mark) mark.hidden = true;
      }

      // selection outline via box shadow
      if(state.selectedKey === k){
        el.style.boxShadow = "0 0 0 2px rgba(47,191,107,.35) inset, 0 10px 26px rgba(0,0,0,.35)";
      }else{
        el.style.boxShadow = "0 10px 26px rgba(0,0,0,.35)";
      }
    }

    function renderMark(el, k, obj){
      const mark = el.querySelector(".mark");
      const tag = el.querySelector(".tag");
      const w   = el.querySelector(".w");
      const t   = el.querySelector(".t");
      const spray = el.querySelector(".spray");

      // pick a label: tag/name/mark/text
      const labelRaw = (obj && (obj.tag || obj.name || obj.mark || obj.text || obj.handle || obj.wallet || "")) + "";
      const label = labelRaw.trim() ? labelRaw.trim() : "MARK";

      const walletRaw = (obj && (obj.wallet || obj.address || obj.account || obj.owner || "")) + "";
      const wallet = walletRaw.trim();

      const ts = (obj && (obj.ts || obj.time || obj.created || obj.date || "")) + "";
      const when = ts ? ("" + ts).slice(0, 19).replace("T", " ") : "";

      const col = colorForKey(k);

      tag.textContent = label;
      tag.style.color = col;

      w.textContent = wallet ? wallet : "unknown";
      t.textContent = when ? when : "";

      spray.src = spraySvg(k);

      mark.hidden = false;
    }

    function updateViewportSize(){
      const r = vp.getBoundingClientRect();
      state.w = Math.max(1, Math.floor(r.width));
      state.h = Math.max(1, Math.floor(r.height));
      state.cols = Math.ceil(state.w / STEP) + PAD * 2;
      state.rows = Math.ceil(state.h / STEP) + PAD * 2;
    }

    function worldTransform(){
      world.style.transform = `translate(${-state.camX}px, ${-state.camY}px)`;
    }

    function visibleGridRange(){
      const startGX = Math.floor(state.camX / STEP) - PAD;
      const startGY = Math.floor(state.camY / STEP) - PAD;
      return { startGX, startGY };
    }

    function paint(){
      const { startGX, startGY } = visibleGridRange();

      // release anything not in current window
      const keep = new Set();
      for(let y=0; y<state.rows; y++){
        for(let x=0; x<state.cols; x++){
          const gx = startGX + x;
          const gy = startGY + y;
          const k = key(gx, gy);
          keep.add(k);

          let el = state.used.get(k);
          if(!el){
            el = takeFromPool();
            state.used.set(k, el);
            world.appendChild(el);
          }
          setCell(el, gx, gy);
        }
      }

      for(const [k, el] of state.used.entries()){
        if(!keep.has(k)){
          state.used.delete(k);
          if(el && el.parentNode) el.parentNode.removeChild(el);
          releaseToPool(el);
        }
      }
    }

    function openPanel(gx, gy){
      const k = key(gx, gy);
      state.selectedKey = k;

      // repaint selection outline without full rebuild
      for(const [kk, el] of state.used.entries()){
        if(!el) continue;
        if(kk === k){
          el.style.boxShadow = "0 0 0 2px rgba(47,191,107,.35) inset, 0 10px 26px rgba(0,0,0,.35)";
        }else{
          el.style.boxShadow = "0 10px 26px rgba(0,0,0,.35)";
        }
      }

      const mark = state.takenByKey.get(k);
      ptitle.textContent = "Tile " + formatTileId(gx, gy);

      if(mark){
        pstate.textContent = "TAKEN";
        pstate.style.borderColor = "rgba(47,191,107,.55)";
        pstate.style.color = "rgba(47,191,107,.95)";
        pstate.style.background = "rgba(47,191,107,.10)";
      }else{
        pstate.textContent = "OPEN";
        pstate.style.borderColor = "rgba(255,255,255,.10)";
        pstate.style.color = "rgba(169,179,189,.95)";
        pstate.style.background = "rgba(255,255,255,.03)";
      }

      const wallet = mark ? (mark.wallet || mark.address || mark.account || mark.owner || "") : "";
      const label  = mark ? (mark.tag || mark.name || mark.mark || mark.text || mark.handle || "") : "";
      const ts     = mark ? (mark.ts || mark.time || mark.created || mark.date || "") : "";

      const cleanTs = ts ? (""+ts).slice(0, 32) : "";

      const html = `
        <div><b>${mark ? "This tile has a mark." : "This tile is unclaimed."}</b></div>
        <div class="kv">
          <div class="k">Key</div><div class="v">${k}</div>
          <div class="k">Label</div><div class="v">${label ? esc(label) : (mark ? "MARK" : "-")}</div>
          <div class="k">Wallet</div><div class="v">${wallet ? esc(wallet) : "-"}</div>
          <div class="k">Time</div><div class="v">${cleanTs ? esc(cleanTs) : "-"}</div>
        </div>
        <div class="pill" style="margin-top:12px;">
          Tap again to close. Drag wall any direction.
        </div>
      `;
      pbody.innerHTML = html;

      panel.classList.add("open");
    }

    function closePanel(){
      panel.classList.remove("open");
      state.selectedKey = null;
      for(const [, el] of state.used.entries()){
        if(el) el.style.boxShadow = "0 10px 26px rgba(0,0,0,.35)";
      }
    }

    function esc(s){
      return (""+s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function onDown(e){
      state.dragging = true;
      vp.classList.add("dragging");
      state.pid = e.pointerId;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      state.lastT = performance.now();
      state.vx = 0;
      state.vy = 0;
      vp.setPointerCapture(state.pid);
    }

    function onMove(e){
      if(!state.dragging || e.pointerId !== state.pid) return;
      const now = performance.now();
      const dx = (e.clientX - state.lastX) * DRAG_GAIN;
      const dy = (e.clientY - state.lastY) * DRAG_GAIN;

      state.camX -= dx;
      state.camY -= dy;

      const dt = Math.max(1, now - state.lastT);
      state.vx = clamp((-dx) / dt * 16, -MAX_VEL, MAX_VEL);
      state.vy = clamp((-dy) / dt * 16, -MAX_VEL, MAX_VEL);

      state.lastX = e.clientX;
      state.lastY = e.clientY;
      state.lastT = now;

      worldTransform();
      paint();
    }

    function onUp(e){
      if(e.pointerId !== state.pid) return;
      state.dragging = false;
      vp.classList.remove("dragging");
      try{ vp.releasePointerCapture(state.pid); }catch(_){}
      state.pid = null;
    }

    function tick(){
      if(!state.dragging){
        if(Math.abs(state.vx) > 0.05 || Math.abs(state.vy) > 0.05){
          state.camX += state.vx;
          state.camY += state.vy;
          state.vx *= FRICTION;
          state.vy *= FRICTION;
          worldTransform();
          paint();
        }
      }
      maybeRefreshFeed();
      requestAnimationFrame(tick);
    }

    async function loadFeed(){
      try{
        const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
        if(!res.ok) throw new Error("feed http " + res.status);
        const data = await res.json();

        // Expect array or object with entries
        let entries = [];
        if(Array.isArray(data)) entries = data;
        else if(data && Array.isArray(data.entries)) entries = data.entries;
        else if(data && Array.isArray(data.marks)) entries = data.marks;
        else entries = [];

        const map = new Map();

        for(const it of entries){
          if(!it) continue;

          // Accept either {gx,gy} or {x,y} or {tile:"x:y"} or {key:"x:y"}
          let gx = null, gy = null;
          if(Number.isFinite(it.gx) && Number.isFinite(it.gy)){ gx = it.gx; gy = it.gy; }
          else if(Number.isFinite(it.x) && Number.isFinite(it.y)){ gx = it.x; gy = it.y; }
          else if(typeof it.tile === "string" && it.tile.includes(":")){
            const [a,b] = it.tile.split(":");
            gx = parseInt(a,10); gy = parseInt(b,10);
          }else if(typeof it.key === "string" && it.key.includes(":")){
            const [a,b] = it.key.split(":");
            gx = parseInt(a,10); gy = parseInt(b,10);
          }

          if(!Number.isFinite(gx) || !Number.isFinite(gy)) continue;

          const k = key(gx, gy);
          map.set(k, it);
        }

        state.takenByKey = map;
        state.takenStamp = Date.now();
        state.loadedOnce = true;

        // repaint visible window to apply marks
        paint();

      } catch(err){
        // keep going, offline safe
      }
    }

    function maybeRefreshFeed(){
      const now = Date.now();
      if(now - state.lastFeedFetch < 15000) return; // 15s
      state.lastFeedFetch = now;
      loadFeed();
    }

    function recenter(){
      // start somewhere not near origin to feel “infinite”
      state.camX = 3000;
      state.camY = 1800;
      state.vx = 0;
      state.vy = 0;
      worldTransform();
      paint();
    }

    // panel interactions
    pclose.addEventListener("click", (e) => { e.preventDefault(); closePanel(); });
    panel.addEventListener("click", (e) => {
      // clicking inside panel does nothing
      e.stopPropagation();
    });

    // tap background closes panel
    vp.addEventListener("click", (e) => {
      // if click came from a tile, tile handler already ran
      // close on empty-space click
      const t = e.target;
      if(t && t.classList && (t.classList.contains("tcell") || t.closest(".tcell"))) return;
      if(panel.classList.contains("open")) closePanel();
    });

    recenterBtn.addEventListener("click", (e) => {
      e.preventDefault();
      closePanel();
      recenter();
    });

    // pointer navigation
    vp.addEventListener("pointerdown", onDown);
    vp.addEventListener("pointermove", onMove);
    vp.addEventListener("pointerup", onUp);
    vp.addEventListener("pointercancel", onUp);
    vp.addEventListener("pointerleave", onUp);

    // init
    function init(){
      updateViewportSize();
      recenter();
      loadFeed();
      requestAnimationFrame(tick);
    }
    window.addEventListener("resize", () => {
      updateViewportSize();
      paint();
    });
    init();
  })();
  </script>
</body>
</html>
