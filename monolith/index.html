<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />

  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#050607;
      --panel:rgba(12,17,22,.78);
      --panel2:rgba(15,21,28,.86);
      --line:rgba(255,255,255,.10);
      --fg:#f5f7f4;
      --muted:#a9b3bd;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;

      --tile:168px;
      --gap:10px;
      --radius:18px;
      --shadow:rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1400px 700px at 50% -10%, rgba(47,191,107,.10), transparent 55%),
        radial-gradient(900px 600px at 15% 0%, rgba(255,255,255,.05), transparent 55%),
        var(--bg);
      color:var(--fg);
      overflow:hidden;
    }
    a{color:inherit;text-decoration:none}

    .hud{
      position:fixed;
      top:14px; left:14px; right:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      z-index:30;
      pointer-events:none;
    }
    .hud > *{pointer-events:auto}

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 12px;
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:999px;
      box-shadow:0 14px 34px var(--shadow);
      backdrop-filter: blur(6px);
    }
    .brand img{
      width:34px;height:34px;object-fit:contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }
    .brand .t{
      display:flex;flex-direction:column;gap:2px;
      line-height:1.1;
    }
    .brand .t b{
      font-size:12px;letter-spacing:.35px;text-transform:uppercase;
    }
    .brand .t span{
      font-size:11px;color:var(--muted);
    }

    .rightbar{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:999px;
      padding:9px 11px;
      font-size:12px;
      color:var(--muted);
      box-shadow:0 14px 34px var(--shadow);
      backdrop-filter: blur(6px);
    }
    .pill b{color:var(--fg)}

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius:999px;
      padding:10px 14px;
      border:1px solid rgba(47,191,107,.55);
      background:rgba(47,191,107,.14);
      color:var(--fg);
      font-weight:900;
      letter-spacing:.2px;
      box-shadow:0 14px 34px var(--shadow);
      backdrop-filter: blur(6px);
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{border-color:rgba(47,191,107,.90)}
    .btn.secondary{
      border-color:rgba(255,255,255,.14);
      background:rgba(255,255,255,.05);
      color:var(--fg);
      font-weight:800;
    }
    .btn.secondary:hover{border-color:rgba(255,255,255,.22)}

    .hint{
      position:fixed;
      left:14px; bottom:14px;
      max-width:min(560px, calc(100vw - 28px));
      border:1px solid var(--line);
      background:var(--panel2);
      border-radius:var(--radius);
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
      z-index:30;
      box-shadow:0 14px 34px var(--shadow);
      backdrop-filter: blur(8px);
      pointer-events:none;
    }
    .hint b{color:var(--fg)}
    .hint .g{color:rgba(47,191,107,.95);font-weight:900}
    .hint .w{color:rgba(255,225,117,.95);font-weight:900}

    .viewport{
      position:fixed;
      inset:0;
      overflow:hidden;
      touch-action:none;
      cursor:grab;
      user-select:none;
    }
    .viewport.dragging{cursor:grabbing}

    .world{
      position:absolute;
      left:0; top:0;
      will-change: transform;
    }

    .tcell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      box-shadow:0 10px 26px rgba(0,0,0,.32);
      overflow:hidden;
    }

    .tcell:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(420px 220px at 30% 0%, rgba(255,255,255,.06), transparent 60%),
        radial-gradient(320px 200px at 70% 20%, rgba(47,191,107,.06), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.08));
      opacity:.95;
      pointer-events:none;
    }

    .tcell .meta{
      position:absolute;
      inset:auto 10px 10px 10px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      z-index:2;
    }
    .tag{
      font-size:10px;
      letter-spacing:.4px;
      text-transform:uppercase;
      font-weight:900;
      color:rgba(245,247,244,.78);
    }
    .id{
      font-size:10px;
      color:rgba(169,179,189,.85);
      font-weight:800;
    }

    .tcell.taken{
      border-color:rgba(47,191,107,.45);
      background:rgba(47,191,107,.08);
    }
    .tcell.taken:after{
      content:"TAKEN";
      position:absolute;
      inset:10px 10px auto auto;
      font-size:10px;
      font-weight:900;
      letter-spacing:.45px;
      padding:5px 8px;
      border-radius:999px;
      border:1px solid rgba(47,191,107,.55);
      background:rgba(47,191,107,.14);
      color:rgba(245,247,244,.92);
      z-index:3;
    }

    .spray{
      position:absolute;
      inset:0;
      z-index:1;
      opacity:.0;
      transition: opacity .15s ease;
      pointer-events:none;
    }
    .tcell.taken .spray{opacity:1}
    .spray svg{width:100%;height:100%}
    .spray .paint{
      opacity:.90;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.25));
    }

    .gridlines{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.10;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: calc(var(--tile) + var(--gap)) calc(var(--tile) + var(--gap));
      z-index:0;
    }
  </style>
</head>

<body>
  <div class="hud">
    <div class="brand">
      <img src="/assets/monolith/monolith_logo.webp" alt="MONOLITH" />
      <div class="t">
        <b>MONOLITH</b>
        <span>The Wall of Record</span>
      </div>
    </div>

    <div class="rightbar">
      <div class="pill" id="kpi">tiles <b id="kpiTotal">0</b> taken <b id="kpiTaken">0</b></div>
      <a class="btn" href="/monolith/claim/">Claim a Tile</a>
      <a class="btn secondary" href="/monolith/rules.html">Rules</a>
    </div>
  </div>

  <div class="hint" id="hint">
    Drag to pan in any direction. Diagonal works. Release for inertia.
    <span class="g">Green</span> is taken.
    Feed source <b>/assets/monolith/feed.json</b>
  </div>

  <div class="viewport" id="vp" aria-label="monolith wall viewport">
    <div class="gridlines" aria-hidden="true"></div>
    <div class="world" id="world" aria-label="monolith wall world"></div>
  </div>

  <script>
    "use strict";

    const FEED_URL = "/assets/monolith/feed.json";

    const TILE = 168;
    const GAP  = 10;
    const STEP = TILE + GAP;

    const vp = document.getElementById("vp");
    const world = document.getElementById("world");
    const kpiTotal = document.getElementById("kpiTotal");
    const kpiTaken = document.getElementById("kpiTaken");

    const state = {
      camX: 0,
      camY: 0,
      vx: 0,
      vy: 0,
      dragging: false,
      pid: null,
      lastX: 0,
      lastY: 0,
      lastT: 0,
      pool: [],
      cols: 0,
      rows: 0,
      poolW: 0,
      poolH: 0,
      taken: new Set(),
      takenMap: new Map(),
      feedCount: 0,
      lastFeedAt: 0
    };

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    function pad4(n){
      const s = String(n);
      return s.length >= 4 ? s : ("0000".slice(s.length) + s);
    }

    function normalizeTileKey(v){
      const raw = String(v || "").trim();
      if(!raw) return "";
      if(raw.includes(",") || raw.includes(":") || raw.includes("_")){
        return raw.replace(/\s+/g,"");
      }
      const digits = raw.replace(/[^\d]/g, "");
      if(!digits) return "";
      if(digits.length <= 4) return pad4(parseInt(digits, 10));
      return digits.slice(0, 8);
    }

    function keyToXY(key){
      key = normalizeTileKey(key);

      if(key.includes(",") || key.includes(":") || key.includes("_")){
        const parts = key.split(/[:,_]/).map(x => x.trim()).filter(Boolean);
        const x = parseInt(parts[0] || "0", 10);
        const y = parseInt(parts[1] || "0", 10);
        if(Number.isFinite(x) && Number.isFinite(y)) return {x,y, id:key};
      }

      const n = parseInt(key, 10);
      if(Number.isFinite(n) && n > 0){
        const W = 100;
        const idx = n - 1;
        const x = idx % W;
        const y = Math.floor(idx / W);
        return {x,y, id: pad4(n)};
      }

      return {x:0,y:0,id:key || "0000"};
    }

    function makeSpraySVG(seed){
      let h = 0;
      for(let i=0;i<seed.length;i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;

      const a = 18 + (h % 18);
      const b = 22 + ((h >>> 6) % 18);
      const c = 26 + ((h >>> 12) % 18);

      const p1x = 24 + ((h >>> 3) % 40);
      const p1y = 30 + ((h >>> 9) % 36);
      const p2x = 64 + ((h >>> 15) % 48);
      const p2y = 58 + ((h >>> 21) % 40);

      return `
        <svg viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <filter id="blur">
              <feGaussianBlur stdDeviation="1.2" />
            </filter>
          </defs>
          <g class="paint" filter="url(#blur)">
            <path d="M ${p1x} ${p1y} C ${p1x+a} ${p1y-b}, ${p2x-c} ${p2y+a}, ${p2x} ${p2y}
                     C ${p2x+b} ${p2y+c}, ${p1x-b} ${p1y+c}, ${p1x} ${p1y} Z"
                  fill="rgba(47,191,107,.22)"/>
            <circle cx="${40 + ((h>>>5)%70)}" cy="${46 + ((h>>>11)%60)}" r="${10 + ((h>>>17)%16)}"
                    fill="rgba(255,255,255,.06)"/>
            <circle cx="${26 + ((h>>>7)%90)}" cy="${28 + ((h>>>13)%90)}" r="${6 + ((h>>>19)%10)}"
                    fill="rgba(47,191,107,.14)"/>
          </g>
        </svg>
      `;
    }

    function createCell(){
      const d = document.createElement("div");
      d.className = "tcell";
      d.innerHTML = `
        <div class="spray"></div>
        <div class="meta">
          <div class="tag">tile</div>
          <div class="id"></div>
        </div>
      `;
      world.appendChild(d);
      return d;
    }

    function setCell(cell, gx, gy){
      const px = gx * STEP;
      const py = gy * STEP;
      cell.style.transform = `translate(${px}px, ${py}px)`;

      const key = gx + "," + gy;
      const taken = state.taken.has(key);

      cell.classList.toggle("taken", taken);

      const idEl = cell.querySelector(".id");
      if(idEl) idEl.textContent = key;

      const spray = cell.querySelector(".spray");
      if(spray){
        if(taken){
          const entry = state.takenMap.get(key) || {};
          const seed = normalizeTileKey(entry.tile || entry.id || entry.key || key);
          spray.innerHTML = makeSpraySVG(seed);
        } else {
          spray.innerHTML = "";
        }
      }
    }

    function resizePool(){
      const w = vp.clientWidth;
      const h = vp.clientHeight;

      const cols = Math.ceil(w / STEP) + 4;
      const rows = Math.ceil(h / STEP) + 4;

      if(cols === state.cols && rows === state.rows) return;

      state.cols = cols;
      state.rows = rows;
      state.poolW = cols;
      state.poolH = rows;

      const need = cols * rows;

      while(state.pool.length < need){
        state.pool.push(createCell());
      }
      while(state.pool.length > need){
        const c = state.pool.pop();
        if(c && c.parentNode) c.parentNode.removeChild(c);
      }
    }

    function render(){
      resizePool();

      world.style.transform = `translate(${-state.camX}px, ${-state.camY}px)`;

      const startGX = Math.floor(state.camX / STEP) - 2;
      const startGY = Math.floor(state.camY / STEP) - 2;

      let idx = 0;
      for(let r=0;r<state.rows;r++){
        for(let c=0;c<state.cols;c++){
          const gx = startGX + c;
          const gy = startGY + r;
          const cell = state.pool[idx++];
          setCell(cell, gx, gy);
        }
      }
    }

    function tick(){
      if(!state.dragging){
        const friction = 0.92;
        state.vx *= friction;
        state.vy *= friction;

        if(Math.abs(state.vx) < 0.02) state.vx = 0;
        if(Math.abs(state.vy) < 0.02) state.vy = 0;

        state.camX += state.vx;
        state.camY += state.vy;
      }

      render();
      requestAnimationFrame(tick);
    }

    function onDown(e){
      if(state.dragging) return;

      state.dragging = true;
      vp.classList.add("dragging");
      state.pid = e.pointerId;
      vp.setPointerCapture(state.pid);

      state.lastX = e.clientX;
      state.lastY = e.clientY;
      state.lastT = performance.now();

      state.vx = 0;
      state.vy = 0;
    }

    function onMove(e){
      if(!state.dragging) return;
      if(state.pid !== null && e.pointerId !== state.pid) return;

      const now = performance.now();
      const dt = Math.max(1, now - state.lastT);

      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;

      state.camX -= dx;
      state.camY -= dy;

      state.vx = (-dx) / dt * 16;
      state.vy = (-dy) / dt * 16;

      state.lastX = e.clientX;
      state.lastY = e.clientY;
      state.lastT = now;
    }

    function onUp(e){
      if(!state.dragging) return;
      if(state.pid !== null && e.pointerId !== state.pid) return;

      state.dragging = false;
      vp.classList.remove("dragging");
      try{ vp.releasePointerCapture(state.pid); }catch(_){}
      state.pid = null;
    }

    function parseFeed(json){
      const taken = new Set();
      const takenMap = new Map();

      const ingest = (it) => {
        if(!it) return;

        if(typeof it === "string" || typeof it === "number"){
          const k = normalizeTileKey(it);
          const pos = keyToXY(k);
          const key = pos.x + "," + pos.y;
          taken.add(key);
          takenMap.set(key, { tile:k });
          return;
        }

        if(typeof it === "object"){
          const tileRaw = it.tile ?? it.t ?? it.id ?? it.tile_id ?? it.tileId ?? it.key;
          const k = normalizeTileKey(tileRaw);
          if(!k) return;
          const pos = keyToXY(k);
          const key = pos.x + "," + pos.y;
          taken.add(key);
          takenMap.set(key, it);
        }
      };

      if(Array.isArray(json)){
        json.forEach(ingest);
      } else if(json && typeof json === "object"){
        const arr =
          (Array.isArray(json.items) && json.items) ||
          (Array.isArray(json.entries) && json.entries) ||
          (Array.isArray(json.claims) && json.claims) ||
          (Array.isArray(json.marks) && json.marks) ||
          (Array.isArray(json.feed) && json.feed) ||
          [];
        if(arr.length) arr.forEach(ingest);
      }

      state.taken = taken;
      state.takenMap = takenMap;
      state.feedCount = taken.size;
      state.lastFeedAt = Date.now();

      kpiTotal.textContent = "∞";
      kpiTaken.textContent = String(taken.size);
    }

    async function loadFeed(){
      try{
        const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
        const txt = await res.text();
        const json = JSON.parse(txt);
        parseFeed(json);
      } catch(e){
        kpiTotal.textContent = "∞";
        kpiTaken.textContent = String(state.taken.size || 0);
      }
    }

    function init(){
      state.camX = 3000;
      state.camY = 1800;

      vp.addEventListener("pointerdown", onDown);
      vp.addEventListener("pointermove", onMove);
      vp.addEventListener("pointerup", onUp);
      vp.addEventListener("pointercancel", onUp);

      window.addEventListener("resize", () => {
        state.cols = 0;
        state.rows = 0;
        render();
      });

      loadFeed();
      setInterval(loadFeed, 30000);

      render();
      requestAnimationFrame(tick);
    }

    init();
  </script>
</body>
</html>
