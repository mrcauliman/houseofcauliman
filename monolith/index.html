<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />

  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b0f14;
      --ink:#f5f7f4;
      --muted:rgba(245,247,244,.72);
      --line:rgba(255,255,255,.08);
      --shadow:rgba(0,0,0,.45);
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;

      --radius:18px;

      --step:128px;     /* tile spacing */
      --tile:118px;     /* visible tile size */
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* top bar */
    .topbar{
      position:fixed;
      left:16px; right:16px; top:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      z-index:50;
      pointer-events:none;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;
      background:rgba(0,0,0,.35);
      border:1px solid var(--line);
      border-radius:999px;
      box-shadow:0 10px 30px var(--shadow);
      pointer-events:auto;
      backdrop-filter: blur(10px);
    }
    .brand img{width:28px;height:28px;display:block}
    .brand .t{
      font-weight:1000;
      letter-spacing:.6px;
      font-size:12px;
      line-height:1;
    }
    .brand .s{
      margin-top:4px;
      font-size:11px;
      color:var(--muted);
      line-height:1;
      font-weight:700;
    }

    .actions{display:flex;gap:10px;pointer-events:auto}
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.35);
      color:var(--ink);
      text-decoration:none;
      font-weight:1000;
      letter-spacing:.35px;
      font-size:12px;
      box-shadow:0 10px 30px var(--shadow);
      backdrop-filter: blur(10px);
      cursor:pointer;
      user-select:none;
    }
    .btn.primary{
      border-color:rgba(47,191,107,.45);
      box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 2px rgba(47,191,107,.08) inset;
    }
    .btn:active{transform:translateY(1px)}
    .hint{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      top:72px;
      z-index:45;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.35);
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.2px;
      pointer-events:none;
      backdrop-filter: blur(10px);
    }

    /* viewport world */
    .viewport{
      position:fixed;
      inset:0;
      overflow:hidden;
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
      cursor:grab;
    }
    .viewport:active{cursor:grabbing}
    .world{
      position:absolute;
      inset:0;
      transform:translate(0px,0px);
      will-change:transform;
    }

    /* tile cell */
    .tcell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      box-shadow:0 18px 40px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .tcell:before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.06), transparent 45%);
      pointer-events:none;
    }
    .tcell .spray{
      position:absolute;
      inset:0;
      opacity:.18;
      transition:opacity .18s ease;
      pointer-events:none;
    }
    .tcell.taken .spray{opacity:.9}
    .tcell .meta{
      position:absolute;
      left:10px;
      right:10px;
      bottom:8px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:10px;
      pointer-events:none;
    }
    .tcell .id{
      font-size:10px;
      font-weight:1000;
      color:rgba(245,247,244,.78);
      letter-spacing:.35px;
      text-shadow:0 10px 24px rgba(0,0,0,.75);
    }
    .tcell .tag{
      font-size:10px;
      font-weight:1000;
      color:rgba(245,247,244,.78);
      letter-spacing:.35px;
      text-transform:uppercase;
      text-align:right;
      text-shadow:0 10px 24px rgba(0,0,0,.75);
      opacity:.0;
    }
    .tcell.taken .tag{opacity:1}

    /* panel */
    .panel{
      position:fixed;
      right:14px;
      top:86px;
      width:min(360px, calc(100vw - 28px));
      background:rgba(11,15,20,.92);
      border:1px solid rgba(255,255,255,.10);
      border-radius:var(--radius);
      box-shadow:0 20px 70px rgba(0,0,0,.55);
      z-index:60;
      overflow:hidden;
      backdrop-filter: blur(14px);
      transform:translateY(8px);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s ease, transform .16s ease;
    }
    .panel.open{
      opacity:1;
      transform:translateY(0px);
      pointer-events:auto;
    }
    .panel .hd{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:14px 14px 10px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .panel .hd .t{
      font-size:13px;
      font-weight:1000;
      letter-spacing:.35px;
      margin:0;
    }
    .panel .hd .s{
      margin-top:6px;
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      letter-spacing:.2px;
      line-height:1.25;
    }
    .panel .close{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.25);
      color:var(--ink);
      border-radius:999px;
      padding:8px 10px;
      font-weight:1000;
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }
    .panel .close:active{transform:translateY(1px)}
    .panel .bd{
      padding:12px 14px 14px 14px;
    }
    .row{
      display:grid;
      grid-template-columns: 90px 1fr;
      gap:10px;
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .row:last-child{border-bottom:none}
    .k{
      font-size:11px;
      font-weight:1000;
      color:rgba(245,247,244,.70);
      letter-spacing:.4px;
      text-transform:uppercase;
    }
    .v{
      font-size:12px;
      font-weight:900;
      color:rgba(245,247,244,.92);
      line-height:1.25;
      word-break:break-word;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.25);
      font-weight:1000;
      letter-spacing:.35px;
      font-size:11px;
      color:rgba(245,247,244,.90);
    }

    /* toast */
    .toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:18px;
      z-index:70;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.55);
      color:rgba(245,247,244,.92);
      font-weight:900;
      letter-spacing:.25px;
      font-size:12px;
      opacity:0;
      pointer-events:none;
      transition:opacity .16s ease, transform .16s ease;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0px)}
    .toast.good{border-color:rgba(47,191,107,.45)}
    .toast.warn{border-color:rgba(255,225,117,.45)}
    .toast.bad{border-color:rgba(255,91,91,.45)}
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand" aria-label="monolith brand">
      <img src="/assets/monolith/monolith_logo.webp" alt="MONOLITH" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">One tile. One mark. No edits. No deletes.</div>
      </div>
    </div>

    <div class="actions">
      <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile">Claim a Tile</a>
    </div>
  </div>

  <div class="hint">Drag to move. Tap a tile to inspect.</div>

  <div class="viewport" id="vp" aria-label="monolith wall viewport">
    <div class="world" id="world" aria-label="monolith wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="hd">
      <div>
        <div class="t" id="ptitle">Tile</div>
        <div class="s" id="psub">Tap a tile to inspect details.</div>
      </div>
      <button class="close" id="pclose" type="button">Close</button>
    </div>
    <div class="bd">
      <div class="row"><div class="k">Tile</div><div class="v" id="vTile">None</div></div>
      <div class="row"><div class="k">Coords</div><div class="v" id="vCoords">0, 0</div></div>
      <div class="row"><div class="k">Tag</div><div class="v" id="vTag">Open</div></div>
      <div class="row"><div class="k">Date</div><div class="v" id="vTs">None</div></div>
      <div class="row"><div class="k">Body</div><div class="v" id="vBody">Open tile.</div></div>
    </div>
  </aside>

  <div class="toast" id="toast">Ready</div>

<script>
(() => {
  "use strict";

  const FEED_URL = "/assets/monolith/feed.json";

  const vp = document.getElementById("vp");
  const world = document.getElementById("world");
  const panel = document.getElementById("panel");
  const pclose = document.getElementById("pclose");
  const ptitle = document.getElementById("ptitle");
  const psub = document.getElementById("psub");

  const vTile = document.getElementById("vTile");
  const vCoords = document.getElementById("vCoords");
  const vTag = document.getElementById("vTag");
  const vTs = document.getElementById("vTs");
  const vBody = document.getElementById("vBody");

  const toast = document.getElementById("toast");

  const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;
  const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 118;

  const state = {
    camX: 0,
    camY: 0,
    vx: 0,
    vy: 0,
    dragging: false,
    lastX: 0,
    lastY: 0,
    lastT: 0,

    cols: 0,
    rows: 0,

    pool: [],
    poolKey: "",
    marksByTile: new Map(),
    taken: new Set(),

    firstMark: null,
    didStart: false
  };

  function toastShow(msg, kind){
    toast.textContent = msg;
    toast.classList.remove("good","warn","bad","show");
    if(kind) toast.classList.add(kind);
    requestAnimationFrame(() => toast.classList.add("show"));
    setTimeout(() => toast.classList.remove("show"), 1100);
  }

  function tileIdFromCoords(gx, gy){
    const ax = Math.abs(gx);
    const ay = Math.abs(gy);
    const sx = gx < 0 ? "W" : "E";
    const sy = gy < 0 ? "N" : "S";
    return sx + ax + "-" + sy + ay;
  }

  function parseTileToCoords(raw){
    if(!raw) return null;
    const s = String(raw).trim().toUpperCase();
    const m = s.match(/^([EW])(\d+)-([NS])(\d+)$/);
    if(!m) return null;
    const gx = (m[1] === "W" ? -1 : 1) * parseInt(m[2], 10);
    const gy = (m[3] === "N" ? -1 : 1) * parseInt(m[4], 10);
    if(!Number.isFinite(gx) || !Number.isFinite(gy)) return null;
    return { gx, gy, tile: tileIdFromCoords(gx, gy), raw: s };
  }

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  function makeSpraySVG(seedStr){
    // deterministic pseudo-random
    let h = 2166136261 >>> 0;
    const s = String(seedStr || "0");
    for(let i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    function rand(){
      h += 0x6D2B79F5;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    const p = [];
    const blobs = 10 + Math.floor(rand()*8);
    for(let i=0;i<blobs;i++){
      const cx = (rand()*TILE);
      const cy = (rand()*TILE);
      const r  = 10 + rand()*42;
      const a  = 0.10 + rand()*0.20;
      p.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="rgba(47,191,107,${a.toFixed(3)})" />`);
    }
    const streaks = 6 + Math.floor(rand()*6);
    for(let i=0;i<streaks;i++){
      const x1 = rand()*TILE, y1 = rand()*TILE;
      const x2 = clamp(x1 + (rand()*120-60), 0, TILE);
      const y2 = clamp(y1 + (rand()*120-60), 0, TILE);
      const w = 2 + rand()*7;
      const a = 0.10 + rand()*0.22;
      p.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(255,255,255,${a.toFixed(3)})" stroke-width="${w.toFixed(1)}" stroke-linecap="round" />`);
    }

    return `<svg viewBox="0 0 ${TILE} ${TILE}" width="${TILE}" height="${TILE}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
  }

  function openPanel(tile, gx, gy){
    const mark = state.marksByTile.get(tile) || null;
    const taken = state.taken.has(tile);

    ptitle.textContent = "Tile " + tile;
    psub.textContent = taken ? "Taken tile." : "Open tile.";

    vTile.textContent = tile;
    vCoords.textContent = `${gx}, ${gy}`;

    if(mark){
      vTag.textContent = mark.tag || "TAKEN";
      vTs.textContent = mark.ts || "None";
      vBody.textContent = mark.body || (mark.title || "Taken tile.");
    } else {
      vTag.textContent = taken ? "TAKEN" : "OPEN";
      vTs.textContent = "None";
      vBody.textContent = taken ? "Taken tile." : "Open tile.";
    }

    panel.classList.add("open");
  }

  function closePanel(){
    panel.classList.remove("open");
  }

  function makeCell(){
    const d = document.createElement("div");
    d.className = "tcell";
    d.innerHTML = `
      <div class="spray"></div>
      <div class="meta">
        <div class="id"></div>
        <div class="tag"></div>
      </div>
    `;
    d.addEventListener("click", (e) => {
      e.preventDefault();
      const gx = parseInt(d.getAttribute("data-gx") || "0", 10);
      const gy = parseInt(d.getAttribute("data-gy") || "0", 10);
      const tile = d.getAttribute("data-tile") || tileIdFromCoords(gx, gy);
      openPanel(tile, gx, gy);
    });
    return d;
  }

  function setCell(cell, gx, gy){
    const tile = tileIdFromCoords(gx, gy);
    const taken = state.taken.has(tile);
    const mark = state.marksByTile.get(tile) || null;

    cell.style.left = (gx * STEP) + "px";
    cell.style.top  = (gy * STEP) + "px";
    cell.setAttribute("data-gx", String(gx));
    cell.setAttribute("data-gy", String(gy));
    cell.setAttribute("data-tile", tile);

    cell.className = "tcell" + (taken ? " taken" : "");
    const idEl = cell.querySelector(".id");
    const tagEl = cell.querySelector(".tag");
    const spray = cell.querySelector(".spray");

    if(idEl) idEl.textContent = tile;
    if(tagEl) tagEl.textContent = (mark && mark.tag) ? mark.tag : (taken ? "TAKEN" : "");
    if(spray) spray.innerHTML = makeSpraySVG(tile);
  }

  function ensurePool(){
    const w = vp.clientWidth;
    const h = vp.clientHeight;

    const cols = Math.ceil(w / STEP) + 5;
    const rows = Math.ceil(h / STEP) + 5;

    if(cols === state.cols && rows === state.rows && state.pool.length) return;

    state.cols = cols;
    state.rows = rows;

    world.innerHTML = "";
    state.pool = [];

    const total = cols * rows;
    for(let i=0;i<total;i++){
      const c = makeCell();
      state.pool.push(c);
      world.appendChild(c);
    }
  }

  function renderPool(){
    ensurePool();

    const pad = 2;
    const startGX = Math.floor(state.camX / STEP) - pad;
    const startGY = Math.floor(state.camY / STEP) - pad;

    const key = `${startGX},${startGY},${state.cols},${state.rows},${state.taken.size}`;
    if(key === state.poolKey) return;
    state.poolKey = key;

    let i = 0;
    for(let ry=0; ry<state.rows; ry++){
      for(let rx=0; rx<state.cols; rx++){
        const gx = startGX + rx;
        const gy = startGY + ry;
        setCell(state.pool[i++], gx, gy);
      }
    }
  }

  function applyCam(){
    world.style.transform = `translate(${-state.camX}px, ${-state.camY}px)`;
  }

  function tick(){
    // inertia
    if(!state.dragging){
      state.camX += state.vx;
      state.camY += state.vy;
      state.vx *= 0.92;
      state.vy *= 0.92;
      if(Math.abs(state.vx) < 0.01) state.vx = 0;
      if(Math.abs(state.vy) < 0.01) state.vy = 0;
    }

    applyCam();
    renderPool();
    requestAnimationFrame(tick);
  }

  function onDown(e){
    state.dragging = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    state.lastT = performance.now();
    state.vx = 0;
    state.vy = 0;
    vp.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
  function onMove(e){
    if(!state.dragging) return;
    const now = performance.now();
    const dx = e.clientX - state.lastX;
    const dy = e.clientY - state.lastY;

    state.camX -= dx;
    state.camY -= dy;

    const dt = Math.max(1, now - state.lastT);
    state.vx = (-dx) / dt * 16;
    state.vy = (-dy) / dt * 16;

    state.lastX = e.clientX;
    state.lastY = e.clientY;
    state.lastT = now;
    e.preventDefault();
  }
  function onUp(e){
    state.dragging = false;
    try{ vp.releasePointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  }

  async function loadFeed(){
    try{
      const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
      if(!res.ok) throw new Error("feed http " + res.status);
      const data = await res.json();

      state.marksByTile = new Map();
      state.taken = new Set();
      state.firstMark = null;

      if(Array.isArray(data)){
        for(const m of data){
          const gx = Number.isFinite(+m.gx) ? +m.gx : null;
          const gy = Number.isFinite(+m.gy) ? +m.gy : null;

          let tile = (typeof m.tile === "string" && m.tile) ? String(m.tile).trim() : null;
          const fromTile = tile ? parseTileToCoords(tile) : null;

          if(fromTile){
            tile = fromTile.tile;
          } else if(!tile && gx !== null && gy !== null){
            tile = tileIdFromCoords(gx, gy);
          } else if(tile){
            tile = String(tile).trim().toUpperCase();
          }

          if(!tile) continue;

          state.taken.add(tile);

          const mgx = (fromTile && Number.isFinite(fromTile.gx)) ? fromTile.gx : (gx !== null ? gx : 0);
          const mgy = (fromTile && Number.isFinite(fromTile.gy)) ? fromTile.gy : (gy !== null ? gy : 0);

          const mark = {
            id: (m.id ? String(m.id) : ""),
            tile,
            gx: mgx,
            gy: mgy,
            tag: (m.tag ? String(m.tag) : "TAKEN"),
            ts: (m.ts ? String(m.ts) : ""),
            title: (m.title ? String(m.title) : ""),
            body: (m.body ? String(m.body) : "")
          };

          state.marksByTile.set(tile, mark);

          if(!state.firstMark){
            state.firstMark = { gx: mark.gx, gy: mark.gy, tile };
          }
        }
      }

      // keep panel closed, only user tap opens it
      if(panel.classList.contains("open")){
        const currentTile = vTile.textContent || "";
        const mark = state.marksByTile.get(currentTile) || null;
        if(!mark && !state.taken.has(currentTile)){
          closePanel();
        }
      }

    } catch(err){
      toastShow("Feed load failed", "warn");
    }
  }

  function startNearSeed(){
    if(state.didStart) return;
    state.didStart = true;

    // Prefer first mark if present, otherwise origin
    if(state.firstMark && Number.isFinite(state.firstMark.gx) && Number.isFinite(state.firstMark.gy)){
      const gx = state.firstMark.gx;
      const gy = state.firstMark.gy;
      state.camX = gx * STEP - (vp.clientWidth * 0.35);
      state.camY = gy * STEP - (vp.clientHeight * 0.35);
    } else {
      state.camX = 0;
      state.camY = 0;
    }

    closePanel();
    state.poolKey = "";
    toastShow("Wall ready", "good");
  }

  // events
  pclose.addEventListener("click", closePanel);

  vp.addEventListener("pointerdown", onDown, { passive:false });
  vp.addEventListener("pointermove", onMove, { passive:false });
  vp.addEventListener("pointerup", onUp, { passive:false });
  vp.addEventListener("pointercancel", onUp, { passive:false });

  window.addEventListener("resize", () => {
    state.cols = 0;
    state.rows = 0;
    state.poolKey = "";
    ensurePool();
    renderPool();
  });

  // boot
  ensurePool();
  applyCam();
  requestAnimationFrame(tick);

  loadFeed().then(() => {
    startNearSeed();
    setInterval(loadFeed, 15000);
  });
})();
