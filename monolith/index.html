<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --panel2:#0d2217;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#173524;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;
      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
        var(--bg);
      color:var(--fg);
      overflow:hidden;
    }

    a{color:inherit;text-decoration:none}

    .topbar{
      position:fixed;left:12px;right:12px;top:12px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:12px 12px;
      border:1px solid rgba(23,53,36,.9);
      border-radius:18px;
      background:rgba(7,9,11,.62);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      z-index:50;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:40px;height:40px;object-fit:contain}
    .brand .t{font-weight:1000;letter-spacing:.6px;font-size:13px;text-transform:uppercase;line-height:1.1}
    .brand .s{margin-top:3px;color:rgba(245,247,244,.72);font-size:12px;line-height:1.2}
    .sp{flex:1}
    .btn{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 12px;border-radius:14px;
      border:1px solid rgba(23,53,36,.9);
      background:rgba(11,27,19,.72);
      box-shadow:0 10px 26px rgba(0,0,0,.25);
      font-weight:900;letter-spacing:.4px;font-size:12px;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{border-color:rgba(47,191,107,.6)}
    .btn.primary{
      background:linear-gradient(180deg, rgba(47,191,107,.22), rgba(11,27,19,.80));
      border-color:rgba(47,191,107,.6);
    }
    .btn .k{opacity:.75;font-weight:1000;font-size:11px;text-transform:uppercase}

    .hintbar{
      position:fixed;left:12px;right:12px;top:86px;
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(23,53,36,.75);
      border-radius:16px;
      background:rgba(7,9,11,.42);
      backdrop-filter: blur(10px);
      z-index:45;
    }
    .hintbar .h{font-weight:900;font-size:12px;letter-spacing:.3px}
    .hintbar .m{color:rgba(245,247,244,.74);font-size:12px}
    .pill{
      margin-left:auto;
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;
      border:1px solid rgba(23,53,36,.75);
      background:rgba(11,27,19,.58);
      font-size:12px;color:rgba(245,247,244,.78);
    }
    .dot{width:8px;height:8px;border-radius:99px;background:rgba(47,191,107,.9);box-shadow:0 0 0 3px rgba(47,191,107,.14)}

    .viewport{
      position:fixed;inset:0;
      overflow:hidden;
      touch-action:none;
      cursor:grab;
    }
    .viewport:active{cursor:grabbing}
    .world{
      position:absolute;left:0;top:0;
      transform: translate3d(0,0,0);
      will-change: transform;
    }

    .cell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:18px;
      border:1px solid rgba(23,53,36,.65);
      background:
        radial-gradient(90px 90px at 20% 20%, rgba(47,191,107,.06), transparent 60%),
        radial-gradient(90px 90px at 80% 30%, rgba(255,225,117,.05), transparent 65%),
        rgba(11,27,19,.22);
      box-shadow: 0 16px 34px rgba(0,0,0,.18);
      user-select:none;
      overflow:hidden;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
    }
    .cell:hover{border-color:rgba(47,191,107,.40)}
    .cell .meta{
      position:absolute;inset:auto 10px 10px 10px;
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      font-size:10px;letter-spacing:.2px;color:rgba(245,247,244,.72);
      font-weight:900;
    }
    .cell .tag{
      position:absolute;left:10px;top:10px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.7px;
      text-transform:uppercase;
      color:rgba(245,247,244,.82);
      padding:6px 9px;
      border-radius:999px;
      border:1px solid rgba(23,53,36,.75);
      background:rgba(7,9,11,.35);
      backdrop-filter: blur(8px);
      max-width:calc(100% - 20px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .spray{
      position:absolute;inset:0;
      opacity:.78;
      pointer-events:none;
      mix-blend-mode:screen;
      filter:saturate(1.1);
    }
    .cell.openOnly .spray{opacity:.26;mix-blend-mode:normal}

    .panel{
      position:fixed;
      right:12px;
      top:86px;
      width:min(420px, calc(100vw - 24px));
      max-height:calc(100vh - 98px);
      border-radius:18px;
      border:1px solid rgba(23,53,36,.9);
      background:linear-gradient(180deg, rgba(13,34,23,.92), rgba(7,9,11,.74));
      box-shadow:0 24px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      overflow:hidden;
      display:none;
      z-index:60;
    }
    .panel.open{display:block}
    .panel .hd{
      padding:12px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      border-bottom:1px solid rgba(23,53,36,.8);
      background:rgba(7,9,11,.35);
    }
    .panel .hd .t{
      font-size:12px;font-weight:1000;letter-spacing:.6px;text-transform:uppercase;
    }
    .panel .close{
      width:38px;height:38px;border-radius:12px;
      border:1px solid rgba(23,53,36,.85);
      background:rgba(11,27,19,.65);
      cursor:pointer;
      font-weight:1000;
      color:rgba(245,247,244,.9);
    }
    .panel .close:hover{border-color:rgba(47,191,107,.6)}
    .panel .bd{padding:12px;display:flex;flex-direction:column;gap:10px}
    .kv{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:10px;
      padding:10px 10px;
      border-radius:16px;
      border:1px solid rgba(23,53,36,.65);
      background:rgba(11,27,19,.40);
    }
    .kv .k{color:rgba(245,247,244,.70);font-size:11px;font-weight:1000;letter-spacing:.5px;text-transform:uppercase}
    .kv .v{font-size:13px;font-weight:900}
    .small{font-size:12px;color:rgba(245,247,244,.72);line-height:1.35}
    .toast{
      position:fixed;left:12px;bottom:12px;
      padding:10px 12px;
      border-radius:16px;
      border:1px solid rgba(23,53,36,.75);
      background:rgba(7,9,11,.70);
      backdrop-filter: blur(10px);
      box-shadow:0 18px 46px rgba(0,0,0,.35);
      font-size:12px;font-weight:900;letter-spacing:.2px;
      color:rgba(245,247,244,.86);
      opacity:0;
      transform: translateY(10px);
      transition: opacity .18s ease, transform .18s ease;
      z-index:80;
    }
    .toast.show{opacity:1;transform: translateY(0)}
    .toast.good{border-color:rgba(47,191,107,.65)}
    .toast.warn{border-color:rgba(255,225,117,.65)}
    .toast.bad{border-color:rgba(255,91,91,.65)}
  </style>
</head>
<body>

  <header class="topbar" aria-label="monolith topbar">
    <a class="brand" href="/monolith/" aria-label="monolith home">
      <img src="/assets/monolith/monolith_logo.webp" alt="MONOLITH logo" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">The Wall of Record</div>
      </div>
    </a>
    <div class="sp"></div>
    <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile">
      <span class="k">Action</span> Claim a Tile
    </a>
  </header>

  <div class="hintbar" aria-label="monolith hint">
    <div>
      <div class="h">Drag to move</div>
      <div class="m">Tap a tile to inspect. Nothing opens until you tap.</div>
    </div>
    <div class="pill"><span class="dot"></span><span id="kTaken">0</span>&nbsp;taken</div>
  </div>

  <div class="viewport" id="vp" aria-label="monolith wall viewport">
    <div class="world" id="world" aria-label="monolith wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="hd">
      <div class="t" id="ptitle">Tile</div>
      <button class="close" id="pclose" type="button" aria-label="close panel">X</button>
    </div>
    <div class="bd">
      <div class="kv">
        <div class="k">Tile</div><div class="v" id="vTile">None</div>
        <div class="k">Coords</div><div class="v" id="vCoords">0, 0</div>
      </div>
      <div class="kv">
        <div class="k">Status</div><div class="v" id="vStatus">Open</div>
        <div class="k">Tag</div><div class="v" id="vTag">None</div>
      </div>
      <div class="kv">
        <div class="k">Timestamp</div><div class="v" id="vTs">None</div>
      </div>
      <div class="small" id="vBody">
        This is the wall preview. Claim flow and on-chain proof come next.
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" aria-label="toast"></div>

<script>
(() => {
  "use strict";

  const FEED_URL = "/assets/monolith/feed.json";

  const vp = document.getElementById("vp");
  const world = document.getElementById("world");
  const panel = document.getElementById("panel");
  const toast = document.getElementById("toast");

  const vTile = document.getElementById("vTile");
  const vCoords = document.getElementById("vCoords");
  const vStatus = document.getElementById("vStatus");
  const vTag = document.getElementById("vTag");
  const vTs = document.getElementById("vTs");
  const vBody = document.getElementById("vBody");
  const kTaken = document.getElementById("kTaken");

  const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 118;
  const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;

  const state = {
    camX: 0,
    camY: 0,
    dragging: false,
    pid: null,
    px: 0,
    py: 0,
    vx: 0,
    vy: 0,
    lastT: 0,

    cols: 0,
    rows: 0,
    pool: [],
    poolPad: 4,

    taken: new Set(),
    marksByTile: new Map(),

    firstMark: null,
    didStartCenter: false
  };

  function toastShow(msg, kind){
    toast.className = "toast" + (kind ? " " + kind : "");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1200);
  }

  function tileIdFromCoords(gx, gy){
    const ax = Math.abs(gx);
    const ay = Math.abs(gy);
    const sx = gx < 0 ? "W" : "E";
    const sy = gy < 0 ? "N" : "S";
    return `${sx}${ax}-${sy}${ay}`;
  }

  function parseCoordMaybe(n){
    const v = Number(n);
    return Number.isFinite(v) ? v : null;
  }

  function makeMulberry32(seed){
    let t = seed >>> 0;
    return function() {
      t += 0x6D2B79F5;
      let x = t;
      x = Math.imul(x ^ (x >>> 15), x | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashStr(s){
    let h = 2166136261;
    for(let i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeSpraySVG(seedStr){
    const seed = hashStr(String(seedStr || "0"));
    const rnd = makeMulberry32(seed);

    const p = [];
    const blobs = 16 + Math.floor(rnd() * 10);

    for(let i=0;i<blobs;i++){
      const cx = Math.floor(rnd() * TILE);
      const cy = Math.floor(rnd() * TILE);
      const r = 12 + Math.floor(rnd() * 38);
      const a = 0.05 + rnd() * 0.12;

      const hue = 90 + Math.floor(rnd() * 60);
      const sat = 55 + Math.floor(rnd() * 30);
      const lit = 45 + Math.floor(rnd() * 25);

      p.push(
        `<circle cx="${cx}" cy="${cy}" r="${r}" fill="hsla(${hue},${sat}%,${lit}%,${a})"></circle>`
      );
    }

    const streaks = 6 + Math.floor(rnd() * 8);
    for(let i=0;i<streaks;i++){
      const x1 = Math.floor(rnd() * TILE);
      const y1 = Math.floor(rnd() * TILE);
      const x2 = Math.floor(rnd() * TILE);
      const y2 = Math.floor(rnd() * TILE);
      const w = 2 + Math.floor(rnd() * 5);
      const a = 0.05 + rnd() * 0.10;

      const hue = 90 + Math.floor(rnd() * 60);
      const sat = 55 + Math.floor(rnd() * 30);
      const lit = 45 + Math.floor(rnd() * 25);

      p.push(
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="hsla(${hue},${sat}%,${lit}%,${a})" stroke-width="${w}" stroke-linecap="round"></line>`
      );
    }

    return `<svg viewBox="0 0 ${TILE} ${TILE}" width="${TILE}" height="${TILE}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
  }

  function closePanel(){
    panel.classList.remove("open");
  }

  function openPanel(tile, gx, gy){
    const mark = state.marksByTile.get(tile) || null;
    const taken = state.taken.has(tile);

    vTile.textContent = tile;
    vCoords.textContent = `${gx}, ${gy}`;

    if(taken){
      vStatus.textContent = "Taken";
      vTag.textContent = mark && mark.tag ? String(mark.tag) : "Taken";
      vTs.textContent = mark && mark.ts ? String(mark.ts) : "Unknown";
      vBody.textContent = "This tile is already taken on the preview wall.";
    } else {
      vStatus.textContent = "Open";
      vTag.textContent = "None";
      vTs.textContent = "None";
      vBody.textContent = "This tile is open. Claim flow is on the Claim page.";
    }

    panel.classList.add("open");
  }

  document.getElementById("pclose").addEventListener("click", closePanel);
  vp.addEventListener("pointerdown", onDown, { passive:false });
  window.addEventListener("pointermove", onMove, { passive:false });
  window.addEventListener("pointerup", onUp, { passive:true });
  window.addEventListener("resize", onResize, { passive:true });

  function onResize(){
    const w = window.innerWidth;
    const h = window.innerHeight;

    state.cols = Math.ceil(w / STEP) + state.poolPad * 2;
    state.rows = Math.ceil(h / STEP) + state.poolPad * 2;

    const need = state.cols * state.rows;

    while(state.pool.length < need){
      const d = document.createElement("div");
      d.className = "cell openOnly";
      d.innerHTML = `
        <div class="spray"></div>
        <div class="tag" style="display:none"></div>
        <div class="meta"><span class="t"></span><span class="c"></span></div>
      `;
      d.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        if(state.dragging) return;

        const gx = parseInt(d.getAttribute("data-gx") || "0", 10);
        const gy = parseInt(d.getAttribute("data-gy") || "0", 10);
        const tile = d.getAttribute("data-tile") || tileIdFromCoords(gx, gy);

        openPanel(tile, gx, gy);
      });

      world.appendChild(d);
      state.pool.push(d);
    }

    for(let i=0;i<state.pool.length;i++){
      state.pool[i].style.display = (i < need) ? "" : "none";
    }
  }

  function setCell(cell, gx, gy){
    const tile = tileIdFromCoords(gx, gy);
    const taken = state.taken.has(tile);
    const mark = state.marksByTile.get(tile) || null;

    cell.style.left = (gx * STEP) + "px";
    cell.style.top  = (gy * STEP) + "px";
    cell.setAttribute("data-gx", String(gx));
    cell.setAttribute("data-gy", String(gy));
    cell.setAttribute("data-tile", tile);
    cell.setAttribute("aria-label", `Tile ${tile} ${taken ? "taken" : "open"}`);

    const tagEl = cell.querySelector(".tag");
    const metaT = cell.querySelector(".meta .t");
    const metaC = cell.querySelector(".meta .c");
    const spray = cell.querySelector(".spray");

    metaT.textContent = tile;
    metaC.textContent = `${gx},${gy}`;

    if(spray) spray.innerHTML = makeSpraySVG(tile);

    if(taken){
      cell.classList.remove("openOnly");
      if(tagEl){
        const t = (mark && mark.tag) ? String(mark.tag) : "TAKEN";
        tagEl.textContent = t;
        tagEl.style.display = "";
      }
      cell.style.opacity = "1";
    } else {
      cell.classList.add("openOnly");
      if(tagEl){
        tagEl.textContent = "";
        tagEl.style.display = "none";
      }
      cell.style.opacity = "0.92";
    }
  }

  function renderPool(){
    const startGX = Math.floor(state.camX / STEP) - state.poolPad;
    const startGY = Math.floor(state.camY / STEP) - state.poolPad;

    let i = 0;
    for(let ry=0; ry<state.rows; ry++){
      for(let rx=0; rx<state.cols; rx++){
        const gx = startGX + rx;
        const gy = startGY + ry;
        setCell(state.pool[i++], gx, gy);
      }
    }
  }

  function onDown(ev){
    ev.preventDefault();
    state.dragging = true;
    state.pid = ev.pointerId;
    state.px = ev.clientX;
    state.py = ev.clientY;
    state.vx = 0;
    state.vy = 0;
    vp.setPointerCapture(ev.pointerId);
  }

  function onMove(ev){
    if(!state.dragging) return;
    if(state.pid !== ev.pointerId) return;

    const dx = ev.clientX - state.px;
    const dy = ev.clientY - state.py;
    state.px = ev.clientX;
    state.py = ev.clientY;

    state.camX -= dx;
    state.camY -= dy;

    state.vx = dx;
    state.vy = dy;
  }

  function onUp(ev){
    if(state.pid !== null && ev.pointerId !== state.pid) return;
    state.dragging = false;
    state.pid = null;
  }

  function tick(t){
    if(!state.lastT) state.lastT = t;
    const dt = Math.min(34, t - state.lastT);
    state.lastT = t;

    if(!state.dragging){
      const k = Math.pow(0.86, dt / 16);
      state.vx *= k;
      state.vy *= k;
      if(Math.abs(state.vx) > 0.05 || Math.abs(state.vy) > 0.05){
        state.camX -= state.vx;
        state.camY -= state.vy;
      } else {
        state.vx = 0;
        state.vy = 0;
      }
    }

    world.style.transform = `translate3d(${-(state.camX)}px, ${-(state.camY)}px, 0)`;
    renderPool();

    requestAnimationFrame(tick);
  }

  function centerOn(gx, gy){
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    state.camX = gx * STEP - cx + (TILE / 2);
    state.camY = gy * STEP - cy + (TILE / 2);
  }

  function startNearSeed(){
    if(state.didStartCenter) return;
    state.didStartCenter = true;

    if(state.firstMark && Number.isFinite(state.firstMark.gx) && Number.isFinite(state.firstMark.gy)){
      centerOn(state.firstMark.gx, state.firstMark.gy);
      toastShow("wall ready", "good");
      return;
    }

    centerOn(0, 0);
    toastShow("wall ready", "good");
  }

  async function loadFeed(){
    try{
      const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
      if(!res.ok) throw new Error("feed http " + res.status);
      const data = await res.json();

      state.taken = new Set();
      state.marksByTile = new Map();
      state.firstMark = null;

      if(Array.isArray(data)){
        for(const m of data){
          const gx = parseCoordMaybe(m && m.gx);
          const gy = parseCoordMaybe(m && m.gy);
          let tile = (m && typeof m.tile === "string" && m.tile) ? String(m.tile).trim().toUpperCase() : null;

          if(!tile && gx !== null && gy !== null){
            tile = tileIdFromCoords(gx, gy);
          }
          if(!tile) continue;

          state.taken.add(tile);
          state.marksByTile.set(tile, {
            tile,
            gx: gx !== null ? gx : 0,
            gy: gy !== null ? gy : 0,
            tag: (m && m.tag) ? String(m.tag) : null,
            ts: (m && m.ts) ? String(m.ts) : null
          });

          if(!state.firstMark && gx !== null && gy !== null){
            state.firstMark = { gx, gy, tile };
          }
        }
      }

      if(kTaken) kTaken.textContent = String(state.taken.size);
      return true;
    } catch (e){
      if(kTaken) kTaken.textContent = "0";
      toastShow("feed load failed", "warn");
      return false;
    }
  }

  onResize();
  requestAnimationFrame(tick);

  loadFeed().then(() => {
    startNearSeed();
    setInterval(loadFeed, 15000);
  });

})();
</script>
</body>
</html>
