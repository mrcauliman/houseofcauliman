<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />
  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --panel2:#0d2217;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#173524;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;

      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
                  radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
                  var(--bg);
      color:var(--fg);
      overflow:hidden;
    }
    a{color:inherit;text-decoration:none}

    .top{
      position:absolute;left:0;right:0;top:0;
      padding:14px 14px 10px 14px;
      pointer-events:none;
      z-index:20;
    }
    .bar{
      display:flex;align-items:center;gap:12px;
      pointer-events:auto;
      background:rgba(7,9,11,.62);
      border:1px solid rgba(23,53,36,.9);
      box-shadow:0 12px 32px rgba(0,0,0,.35);
      border-radius:18px;
      padding:10px 10px;
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex;align-items:center;gap:10px;
      min-width:210px;
    }
    .brand img{
      width:38px;height:38px;object-fit:contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.35));
    }
    .brand .t{
      font-weight:1000;letter-spacing:.6px;font-size:13px;
      text-transform:uppercase;
      line-height:1.1;
    }
    .brand .s{
      margin-top:3px;
      color:rgba(245,247,244,.7);
      font-size:12px;
      line-height:1.2;
    }
    .sp{flex:1}

    .btn{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.9);
      background: linear-gradient(180deg, rgba(11,27,19,.92), rgba(7,9,11,.92));
      box-shadow:0 10px 22px rgba(0,0,0,.35);
      font-weight:900;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    .btn .k{
      display:block;
      font-size:10px;
      color:rgba(245,247,244,.62);
      letter-spacing:.6px;
      text-transform:uppercase;
    }
    .btn.primary{
      border-color:rgba(47,191,107,.7);
      background: linear-gradient(180deg, rgba(47,191,107,.18), rgba(11,27,19,.9));
    }
    .btn:active{transform:translateY(1px)}

    .viewport{
      position:absolute;inset:0;
      touch-action:none;
      cursor:grab;
    }
    .viewport.dragging{cursor:grabbing}

    .world{
      position:absolute;left:0;top:0;
      width:1px;height:1px;
      transform:translate(0px,0px);
      will-change:transform;
    }

    .tcell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:16px;
      border:1px solid rgba(23,53,36,.85);
      background: linear-gradient(180deg, rgba(11,27,19,.70), rgba(7,9,11,.72));
      box-shadow:0 10px 24px rgba(0,0,0,.35);
      overflow:hidden;
      user-select:none;
    }
    .tcell:before{
      content:"";
      position:absolute;inset:0;
      background:
        radial-gradient(140px 80px at 30% 20%, rgba(47,191,107,.10), transparent 60%),
        radial-gradient(120px 80px at 85% 75%, rgba(255,225,117,.08), transparent 60%);
      pointer-events:none;
    }
    .tcell .id{
      position:absolute;left:10px;top:8px;
      font-size:10px;font-weight:1000;
      color:rgba(245,247,244,.72);
      letter-spacing:.3px;
    }
    .tcell .meta{
      position:absolute;left:10px;right:10px;bottom:10px;
      display:flex;gap:8px;align-items:flex-end;justify-content:space-between;
    }
    .pill{
      display:inline-flex;align-items:center;
      padding:6px 8px;
      border-radius:999px;
      border:1px solid rgba(23,53,36,.9);
      background:rgba(7,9,11,.58);
      font-size:10px;
      font-weight:900;
      letter-spacing:.3px;
      color:rgba(245,247,244,.75);
      text-transform:uppercase;
      max-width:100%;
      overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap;
    }
    .spray{
      position:absolute;inset:0;
      opacity:.0;
      transition:opacity .18s ease;
      pointer-events:none;
      mix-blend-mode:screen;
    }
    .tcell.taken{
      border-color:rgba(47,191,107,.55);
      box-shadow:0 0 0 2px rgba(47,191,107,.12) inset, 0 10px 24px rgba(0,0,0,.35);
    }
    .tcell.taken .spray{opacity:1}
    .tcell:hover{border-color:rgba(47,191,107,.55)}

    .panel{
      position:absolute;
      right:14px;top:74px;
      width:min(420px, calc(100vw - 28px));
      max-height:calc(100vh - 88px);
      border-radius:18px;
      border:1px solid rgba(23,53,36,.9);
      background:rgba(7,9,11,.72);
      box-shadow:0 18px 44px rgba(0,0,0,.42);
      backdrop-filter: blur(10px);
      overflow:hidden;
      z-index:30;
      pointer-events:auto;
    }
    .panelHeader{
      padding:12px 12px;
      display:flex;align-items:flex-start;gap:10px;
      border-bottom:1px solid rgba(23,53,36,.65);
      background:linear-gradient(180deg, rgba(11,27,19,.70), rgba(7,9,11,.72));
    }
    .panelHeader .h{
      flex:1;
      min-width:0;
    }
    .panelHeader h2{
      margin:0;
      font-size:14px;
      font-weight:1000;
      letter-spacing:.4px;
      text-transform:uppercase;
    }
    .panelHeader .sub{
      margin-top:6px;
      color:rgba(245,247,244,.72);
      font-size:12px;
      line-height:1.25;
    }
    .xbtn{
      width:38px;height:38px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.9);
      background:rgba(7,9,11,.55);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-weight:1000;
      user-select:none;
    }
    .panelBody{
      padding:12px 12px 14px 12px;
      display:grid;
      gap:10px;
    }
    .row{
      display:grid;
      grid-template-columns: 90px 1fr;
      gap:10px;
      align-items:start;
      padding:10px 10px;
      border:1px solid rgba(23,53,36,.65);
      border-radius:16px;
      background:rgba(11,27,19,.55);
    }
    .row .k{
      color:rgba(245,247,244,.68);
      font-size:11px;
      letter-spacing:.5px;
      text-transform:uppercase;
      font-weight:900;
    }
    .row .v{
      font-size:13px;
      font-weight:900;
      color:rgba(245,247,244,.92);
      word-break:break-word;
      line-height:1.25;
    }
    .monoLink{
      display:flex;gap:10px;flex-wrap:wrap;
      padding-top:4px;
    }
    .linkBtn{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.85);
      background:rgba(7,9,11,.55);
      font-weight:900;
      cursor:pointer;
      user-select:none;
    }

    .toast{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:14px;
      background:rgba(7,9,11,.78);
      border:1px solid rgba(23,53,36,.9);
      border-radius:999px;
      padding:10px 14px;
      box-shadow:0 16px 42px rgba(0,0,0,.45);
      font-weight:900;
      font-size:12px;
      color:rgba(245,247,244,.92);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      z-index:40;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
    .toast.good{border-color:rgba(47,191,107,.7)}
    .toast.bad{border-color:rgba(255,91,91,.7)}
    .toast.warn{border-color:rgba(255,225,117,.7)}
  </style>
</head>
<body>

  <div class="top">
    <div class="bar">
      <div class="brand" aria-label="monolith header">
        <img src="/assets/monolith/monolith_logo.webp" alt="MONOLITH" />
        <div>
          <div class="t">MONOLITH</div>
          <div class="s">Drag to move. Tap a tile to inspect.</div>
        </div>
      </div>
      <div class="sp"></div>
      <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile">
        <span class="k">ACTION</span>
        <span>Claim a Tile</span>
      </a>
      <a class="btn" href="/assets/monolith/feed.json" target="_blank" rel="noreferrer" aria-label="view feed json">
        <span class="k">SOURCE</span>
        <span>feed.json</span>
      </a>
    </div>
  </div>

  <div class="viewport" id="vp" aria-label="monolith wall viewport">
    <div class="world" id="world" aria-label="monolith wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="panelHeader">
      <div class="h">
        <h2 id="ptitle">Tile</h2>
        <div class="sub" id="psub">Tap a tile to inspect details.</div>
      </div>
      <div class="xbtn" id="pclose" aria-label="close panel">X</div>
    </div>
    <div class="panelBody">
      <div class="row"><div class="k">Tile</div><div class="v" id="vTile">None</div></div>
      <div class="row"><div class="k">Coords</div><div class="v" id="vCoords">0, 0</div></div>
      <div class="row"><div class="k">Tag</div><div class="v" id="vTag">Open</div></div>
      <div class="row"><div class="k">Date</div><div class="v" id="vTs">None</div></div>
      <div class="row"><div class="k">Status</div><div class="v" id="vStatus">Open</div></div>
      <div class="monoLink" aria-label="tile links">
        <a class="linkBtn" id="toClaim" href="/monolith/claim/" aria-label="go to claim">Claim page</a>
        <button class="linkBtn" id="copyTile" type="button" aria-label="copy tile id">Copy tile</button>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" aria-label="toast"></div>

<script>
(() => {
  "use strict";

  const FEED_URL = "/assets/monolith/feed.json";
  const vp = document.getElementById("vp");
  const world = document.getElementById("world");

  const panel = document.getElementById("panel");
  const pclose = document.getElementById("pclose");
  const ptitle = document.getElementById("ptitle");
  const psub = document.getElementById("psub");
  const vTile = document.getElementById("vTile");
  const vCoords = document.getElementById("vCoords");
  const vTag = document.getElementById("vTag");
  const vTs = document.getElementById("vTs");
  const vStatus = document.getElementById("vStatus");
  const toClaim = document.getElementById("toClaim");
  const copyTile = document.getElementById("copyTile");
  const toast = document.getElementById("toast");

  const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;
  const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 118;

  const state = {
    camX: 0,
    camY: 0,
    vx: 0,
    vy: 0,
    dragging: false,
    downX: 0,
    downY: 0,
    lastX: 0,
    lastY: 0,
    moved: 0,
    cols: 0,
    rows: 0,
    pool: [],
    poolGX0: 0,
    poolGY0: 0,
    taken: new Set(),
    marksByTile: new Map(),
    lastTouchTs: 0
  };

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  function toastShow(msg, cls){
    toast.className = "toast";
    if(cls) toast.classList.add(cls);
    toast.textContent = msg;
    requestAnimationFrame(() => toast.classList.add("show"));
    setTimeout(() => toast.classList.remove("show"), 1400);
  }

  function tileIdFromCoords(gx, gy){
    const ax = Math.abs(gx);
    const ay = Math.abs(gy);
    const sx = gx < 0 ? "W" : "E";
    const sy = gy < 0 ? "N" : "S";
    return sx + ax + "-" + sy + ay;
  }

  function parseCoordsFromAny(raw){
    if(!raw) return null;
    const s = String(raw).trim().toUpperCase();

    // Accept E23-N11
    let m = s.match(/^(E|W)\s*(\d+)\s*-\s*(N|S)\s*(\d+)$/i);
    if(m){
      const gx = (m[1].toUpperCase()==="W") ? -parseInt(m[2],10) : parseInt(m[2],10);
      const gy = (m[3].toUpperCase()==="N") ? -parseInt(m[4],10) : parseInt(m[4],10);
      if(Number.isFinite(gx) && Number.isFinite(gy)) return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
    }

    // Accept 23,-11
    m = s.match(/^(-?\d+)\s*,\s*(-?\d+)$/);
    if(m){
      const gx = parseInt(m[1],10);
      const gy = parseInt(m[2],10);
      if(Number.isFinite(gx) && Number.isFinite(gy)) return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
    }

    // Accept gx gy
    m = s.match(/^(-?\d+)\s+(-?\d+)$/);
    if(m){
      const gx = parseInt(m[1],10);
      const gy = parseInt(m[2],10);
      if(Number.isFinite(gx) && Number.isFinite(gy)) return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
    }

    return null;
  }

  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashSeed(str){
    const s = String(str);
    let h = 2166136261;
    for(let i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeSpraySVG(seedStr){
    const seed = hashSeed(seedStr);
    const rnd = mulberry32(seed);
    const p = [];
    const blobs = 16 + Math.floor(rnd()*10);
    for(let i=0;i<blobs;i++){
      const cx = Math.floor(rnd()*TILE);
      const cy = Math.floor(rnd()*TILE);
      const r  = 10 + Math.floor(rnd()*28);
      const a  = 0.10 + rnd()*0.18;
      const hue = 105 + Math.floor(rnd()*30);
      p.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="hsla(${hue},70%,60%,${a})"/>`);
    }
    for(let i=0;i<14;i++){
      const x1 = Math.floor(rnd()*TILE), y1 = Math.floor(rnd()*TILE);
      const x2 = Math.floor(rnd()*TILE), y2 = Math.floor(rnd()*TILE);
      const w = 1 + Math.floor(rnd()*2);
      const a = 0.10 + rnd()*0.14;
      p.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,225,117,${a})" stroke-width="${w}" stroke-linecap="round"/>`);
    }
    return `<svg viewBox="0 0 ${TILE} ${TILE}" width="${TILE}" height="${TILE}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
  }

  function openPanel(tile, gx, gy){
    const mark = state.marksByTile.get(tile) || null;
    const taken = state.taken.has(tile);

    ptitle.textContent = "Tile " + tile;
    vTile.textContent = tile;
    vCoords.textContent = gx + ", " + gy;

    if(mark){
      vTag.textContent = mark.tag || "Taken";
      vTs.textContent = mark.ts || "Unknown";
      psub.textContent = "Taken tile from feed";
    } else {
      vTag.textContent = "Open";
      vTs.textContent = "None";
      psub.textContent = taken ? "Taken tile" : "Open tile";
    }

    vStatus.textContent = taken ? "Taken" : "Open";
    toClaim.href = "/monolith/claim/?tile=" + encodeURIComponent(tile);

    panel.style.display = "block";
  }

  function closePanel(){
    panel.style.display = "none";
  }

  async function copyText(txt){
    try{
      await navigator.clipboard.writeText(txt);
      toastShow("copied", "good");
    } catch(e){
      toastShow("clipboard blocked", "warn");
    }
  }

  copyTile.addEventListener("click", () => copyText(vTile.textContent || ""));
  pclose.addEventListener("click", closePanel);

  function makeCell(){
    const d = document.createElement("div");
    d.className = "tcell";
    d.innerHTML = `
      <div class="spray"></div>
      <div class="id"></div>
      <div class="meta">
        <div class="pill"></div>
      </div>
    `;
    d.addEventListener("click", (ev) => {
      if(state.dragging) return;
      const gx = parseInt(d.getAttribute("data-gx") || "0", 10);
      const gy = parseInt(d.getAttribute("data-gy") || "0", 10);
      const tile = d.getAttribute("data-tile") || tileIdFromCoords(gx, gy);
      openPanel(tile, gx, gy);
      ev.stopPropagation();
    });
    return d;
  }

  function setCell(cell, gx, gy){
    const tile = tileIdFromCoords(gx, gy);
    const taken = state.taken.has(tile);
    const mark = state.marksByTile.get(tile) || null;

    cell.style.left = (gx * STEP) + "px";
    cell.style.top  = (gy * STEP) + "px";
    cell.setAttribute("data-gx", String(gx));
    cell.setAttribute("data-gy", String(gy));
    cell.setAttribute("data-tile", tile);
    cell.setAttribute("aria-label", "Tile " + tile + " " + (taken ? "taken" : "open"));

    const id = cell.querySelector(".id");
    if(id) id.textContent = tile;

    const pill = cell.querySelector(".pill");
    if(pill){
      pill.textContent = (mark && mark.tag) ? String(mark.tag) : (taken ? "TAKEN" : "OPEN");
    }

    const spray = cell.querySelector(".spray");
    if(taken){
      cell.classList.add("taken");
      if(spray) spray.innerHTML = makeSpraySVG(tile);
    } else {
      cell.classList.remove("taken");
      if(spray) spray.innerHTML = "";
    }
  }

  function renderPool(){
    const w = vp.clientWidth;
    const h = vp.clientHeight;
    const cols = Math.ceil(w / STEP) + 4;
    const rows = Math.ceil(h / STEP) + 4;

    if(cols !== state.cols || rows !== state.rows){
      state.cols = cols;
      state.rows = rows;
      world.innerHTML = "";
      state.pool = [];
      const total = cols * rows;
      for(let i=0;i<total;i++){
        const c = makeCell();
        state.pool.push(c);
        world.appendChild(c);
      }
    }

    world.style.transform = "translate(" + (-state.camX) + "px, " + (-state.camY) + "px)";

    const startGX = Math.floor(state.camX / STEP) - 2;
    const startGY = Math.floor(state.camY / STEP) - 2;

    let i = 0;
    for(let ry=0;ry<rows;ry++){
      for(let rx=0;rx<cols;rx++){
        const gx = startGX + rx;
        const gy = startGY + ry;
        setCell(state.pool[i++], gx, gy);
      }
    }
  }

  function tick(){
    if(!state.dragging){
      state.vx *= 0.92;
      state.vy *= 0.92;
      if(Math.abs(state.vx) < 0.05) state.vx = 0;
      if(Math.abs(state.vy) < 0.05) state.vy = 0;
      state.camX += state.vx;
      state.camY += state.vy;
    }
    renderPool();
    requestAnimationFrame(tick);
  }

  function onDown(ev){
    state.dragging = true;
    state.downX = ev.clientX;
    state.downY = ev.clientY;
    state.lastX = ev.clientX;
    state.lastY = ev.clientY;
    state.moved = 0;
    vp.classList.add("dragging");
    vp.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  }

  function onMove(ev){
    if(!state.dragging) return;
    const dx = ev.clientX - state.lastX;
    const dy = ev.clientY - state.lastY;
    state.lastX = ev.clientX;
    state.lastY = ev.clientY;

    state.camX -= dx;
    state.camY -= dy;

    state.vx = -dx;
    state.vy = -dy;

    state.moved += Math.abs(dx) + Math.abs(dy);
    ev.preventDefault();
  }

  function onUp(ev){
    if(!state.dragging) return;
    state.dragging = false;
    vp.classList.remove("dragging");
    try{ vp.releasePointerCapture(ev.pointerId); } catch(e) {}
    ev.preventDefault();
  }

  async function loadFeed(){
    try{
      const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
      if(!res.ok) throw new Error("bad feed");
      const json = await res.json();

      state.taken = new Set();
      state.marksByTile = new Map();

      if(Array.isArray(json)){
        for(const m of json){
          const gx = Number.isFinite(+m.gx) ? +m.gx : null;
          const gy = Number.isFinite(+m.gy) ? +m.gy : null;

          let tile = (typeof m.tile === "string" && m.tile) ? String(m.tile).trim().toUpperCase() : null;
          if(!tile && gx !== null && gy !== null) tile = tileIdFromCoords(gx, gy);
          if(!tile) continue;

          state.taken.add(tile);
          state.marksByTile.set(tile, {
            id: (m.id ? String(m.id) : ""),
            tile,
            gx: gx !== null ? gx : 0,
            gy: gy !== null ? gy : 0,
            tag: (m.tag ? String(m.tag) : ""),
            ts: (m.ts ? String(m.ts) : "")
          });
        }
      }

      renderPool();
      return true;
    } catch(e){
      toastShow("feed load failed", "warn");
      return false;
    }
  }

  function startNearSeed(){
    for(const v of state.marksByTile.values()){
      const gx = v.gx || 0;
      const gy = v.gy || 0;
      state.camX = gx * STEP - Math.floor(vp.clientWidth/2) + Math.floor(TILE/2);
      state.camY = gy * STEP - Math.floor(vp.clientHeight/2) + Math.floor(TILE/2);
      toastShow("start " + tileIdFromCoords(gx, gy), "good");
      const t = tileIdFromCoords(gx, gy);
      openPanel(t, gx, gy);
      return;
    }
    state.camX = 0;
    state.camY = 0;
    toastShow("start origin", "good");
  }

  vp.addEventListener("pointerdown", onDown, { passive:false });
  vp.addEventListener("pointermove", onMove, { passive:false });
  vp.addEventListener("pointerup", onUp, { passive:false });
  vp.addEventListener("pointercancel", onUp, { passive:false });

  panel.style.display = "block";
  renderPool();
  requestAnimationFrame(tick);

  loadFeed().then(() => startNearSeed());
  setInterval(loadFeed, 15000);

})();
</script>
</body>
</html>
