<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --panel2:#0d2217;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#173524;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;

      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
        var(--bg);
      color:var(--fg);
      overflow:hidden;
    }
    a{color:inherit;text-decoration:none}

    /* top bar */
    .top{
      position:fixed;left:12px;right:12px;top:12px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(23,53,36,.9);
      border-radius:18px;
      background:rgba(7,9,11,.62);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      z-index:20;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:34px;height:34px;object-fit:contain}
    .brand .t{font-weight:1000;letter-spacing:.6px;font-size:13px;text-transform:uppercase;line-height:1.1}
    .brand .s{margin-top:3px;color:rgba(245,247,244,.72);font-size:12px;line-height:1.2}

    .sp{flex:1}

    .btn{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.85);
      color:var(--fg);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      letter-spacing:.3px;
      cursor:pointer;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{border-color:rgba(47,191,107,.55)}
    .btn.primary{
      background:linear-gradient(180deg, rgba(47,191,107,.22), rgba(11,27,19,.88));
      border-color:rgba(47,191,107,.65);
    }

    .kpi{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      color:rgba(245,247,244,.84);
      font-size:12px;
    }
    .pill{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.72);
      padding:8px 10px;
      border-radius:999px;
      font-weight:900;
      letter-spacing:.2px;
      display:inline-flex;align-items:center;gap:8px;
    }
    .dot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 0 3px rgba(47,191,107,.18)}

    /* search */
    .search{
      display:flex;align-items:center;gap:8px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.72);
      border-radius:14px;
      padding:8px 10px;
    }
    .search input{
      width:240px;
      max-width:42vw;
      border:0;
      outline:0;
      background:transparent;
      color:var(--fg);
      font-weight:900;
      letter-spacing:.2px;
      font-size:12px;
    }
    .search input::placeholder{color:rgba(174,183,175,.70)}
    .search .btn{
      padding:8px 10px;
      border-radius:12px;
    }

    /* viewport */
    #vp{
      position:absolute;inset:0;
      touch-action:none;
      cursor:grab;
    }
    #vp.dragging{cursor:grabbing}
    #world{
      position:absolute;left:0;top:0;
      width:1px;height:1px;
      transform:translate3d(0,0,0);
      will-change:transform;
    }

    /* tile cell */
    .cell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:16px;
      border:1px solid rgba(23,53,36,.75);
      background:
        radial-gradient(120px 90px at 30% 25%, rgba(47,191,107,.14), transparent 55%),
        rgba(11,27,19,.45);
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
      overflow:hidden;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .cell:hover{border-color:rgba(47,191,107,.45)}
    .cell .spray{position:absolute;inset:0;opacity:.95}
    .cell .id{
      position:absolute;left:10px;bottom:8px;right:10px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.35px;
      color:rgba(245,247,244,.72);
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .cell .tag{
      position:absolute;left:10px;top:8px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.5px;
      color:rgba(255,225,117,.85);
      text-transform:uppercase;
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      max-width:calc(100% - 20px);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .cell.taken{border-color:rgba(47,191,107,.85)}
    .cell.taken .tag{color:rgba(47,191,107,.92)}

    /* side panel */
    .panel{
      position:fixed;
      right:12px;
      top:70px;
      bottom:12px;
      width:min(420px, calc(100vw - 24px));
      border-radius:18px;
      border:1px solid rgba(23,53,36,.95);
      background:linear-gradient(180deg, rgba(13,34,23,.86), rgba(11,27,19,.92));
      box-shadow:0 18px 44px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      z-index:30;
      transform:translate3d(110%,0,0);
      transition:transform .18s ease;
      display:flex;flex-direction:column;
    }
    .panel.open{transform:translate3d(0,0,0)}
    .ph{
      display:flex;align-items:center;gap:10px;
      padding:12px;
      border-bottom:1px solid rgba(23,53,36,.9);
    }
    .ph .ttl{font-weight:1000;letter-spacing:.4px}
    .ph .sub{margin-top:3px;color:rgba(245,247,244,.70);font-size:12px}
    .ph .sp{flex:1}
    .xbtn{
      width:40px;height:40px;border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.4);
      color:rgba(245,247,244,.9);
      font-weight:1000;
      cursor:pointer;
    }
    .pb{padding:12px;overflow:auto}
    .kv{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:10px 12px;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.75);
      background:rgba(7,9,11,.22);
    }
    .kv .k{color:rgba(174,183,175,.85);font-size:12px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
    .kv .v{font-size:13px;font-weight:1000;letter-spacing:.2px}
    .muted{color:rgba(174,183,175,.86);font-size:12px;line-height:1.45;margin-top:10px}

    /* toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:14px;
      transform:translate3d(-50%, 90px, 0);
      opacity:0;
      transition:transform .18s ease, opacity .18s ease;
      z-index:40;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.72);
      backdrop-filter: blur(10px);
      font-weight:1000;
      letter-spacing:.2px;
      font-size:12px;
      max-width:90vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.show{transform:translate3d(-50%, 0, 0);opacity:1}
    .toast.good{border-color:rgba(47,191,107,.75)}
    .toast.warn{border-color:rgba(255,225,117,.75)}
    .toast.bad{border-color:rgba(255,91,91,.75)}
  </style>
</head>

<body>
  <header class="top">
    <div class="brand">
      <img src="/assets/monolith/monolith_logo.webp" alt="MONOLITH" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">Drag to move. Tap a tile to inspect.</div>
      </div>
    </div>

    <div class="sp"></div>

    <div class="search" aria-label="search tiles">
      <input id="q" autocomplete="off" spellcheck="false" placeholder="Search tile E23-N11 or E23N11 or 23,-11" />
      <button class="btn" id="go" type="button">Go</button>
    </div>

    <div class="kpi">
      <div class="pill"><span class="dot"></span><span id="kTaken">0</span> taken</div>
      <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile"><span>Claim a Tile</span></a>
    </div>
  </header>

  <div id="vp" aria-label="wall viewport">
    <div id="world" aria-label="wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="ph">
      <div>
        <div class="ttl" id="ptitle">Tile</div>
        <div class="sub" id="psub">Tap a tile to inspect details.</div>
      </div>
      <div class="sp"></div>
      <button class="xbtn" id="close" type="button" aria-label="close panel">X</button>
    </div>
    <div class="pb">
      <div class="kv" aria-label="tile details">
        <div class="k">Tile</div><div class="v" id="vTile">None</div>
        <div class="k">Coords</div><div class="v" id="vCoords">0, 0</div>
        <div class="k">Tag</div><div class="v" id="vTag">Open</div>
        <div class="k">Date</div><div class="v" id="vTs">None</div>
      </div>
      <div class="muted" id="vBody">Tap a tile to inspect details.</div>
    </div>
  </aside>

  <div class="toast" id="toast" aria-label="toast"></div>

  <script>
    const FEED_URL = "/assets/monolith/feed.json";

    const vp = document.getElementById("vp");
    const world = document.getElementById("world");
    const panel = document.getElementById("panel");
    const toast = document.getElementById("toast");

    const el = {
      q: document.getElementById("q"),
      go: document.getElementById("go"),
      kTaken: document.getElementById("kTaken"),
      close: document.getElementById("close"),

      ptitle: document.getElementById("ptitle"),
      psub: document.getElementById("psub"),
      vTile: document.getElementById("vTile"),
      vCoords: document.getElementById("vCoords"),
      vTag: document.getElementById("vTag"),
      vTs: document.getElementById("vTs"),
      vBody: document.getElementById("vBody")
    };

    const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;
    const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 118;

    const state = {
      camX: 0,
      camY: 0,
      vx: 0,
      vy: 0,

      down: false,
      pid: null,
      lastX: 0,
      lastY: 0,
      moved: false,

      cols: 0,
      rows: 0,
      pool: [],
      POOL_PAD: 3,

      taken: new Set(),
      marksByTile: new Map(),

      lastKey: "",
      raf: 0
    };

    function toastShow(msg, kind){
      toast.className = "toast " + (kind || "");
      toast.textContent = msg;
      requestAnimationFrame(() => toast.classList.add("show"));
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function tileIdFromCoords(gx, gy){
      const ax = Math.abs(gx);
      const ay = Math.abs(gy);
      const sx = gx < 0 ? "W" : "E";

      // CANON LAW
      // Zero lives on the North axis, not South
      // gy <= 0 => N, gy > 0 => S
      const sy = gy <= 0 ? "N" : "S";

      return sx + ax + "-" + sy + ay;
    }

    function parseTileToCoords(raw){
      if(!raw) return null;
      const s = String(raw).trim().toUpperCase().replace(/[–—−]/g, "-");

      // "23,-11"
      if(/^-?\d+\s*,\s*-?\d+$/.test(s)){
        const parts = s.split(",");
        const gx = parseInt(parts[0].trim(), 10);
        const gy = parseInt(parts[1].trim(), 10);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw: s };
        }
      }

      // "E23-N11"
      const m = s.match(/^([EW])(\d+)-([NS])(\d+)$/);
      if(m){
        const gx = parseInt(m[2], 10) * (m[1] === "W" ? -1 : 1);
        const gy = parseInt(m[4], 10) * (m[3] === "N" ? -1 : 1);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw: s };
        }
      }

      return null;
    }

    // deterministic spray
    function mulberry32(seed){
      let t = seed >>> 0;
      return function(){
        t += 0x6D2B79F5;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }
    function hashStr(str){
      let h = 2166136261 >>> 0;
      for(let i=0;i<str.length;i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    function makeSpraySVG(seedStr){
      const rnd = mulberry32(hashStr(seedStr));
      const p = [];
      const count = 26;

      for(let i=0;i<count;i++){
        const x = Math.floor(rnd() * TILE);
        const y = Math.floor(rnd() * TILE);
        const r = 6 + Math.floor(rnd() * 20);
        const a = 0.10 + rnd() * 0.22;
        const g = rnd() < 0.72 ? "47,191,107" : "255,225,117";
        p.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(${g},${a.toFixed(3)})" />`);
      }
      return `<svg viewBox="0 0 ${TILE} ${TILE}" width="${TILE}" height="${TILE}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
    }

    function closePanel(){
      panel.classList.remove("open");
    }

    function openPanel(tile, gx, gy){
      const mark = state.marksByTile.get(tile) || null;
      const taken = state.taken.has(tile);

      el.vTile.textContent = tile;
      el.vCoords.textContent = `${gx}, ${gy}`;

      if(mark){
        el.vTag.textContent = mark.tag || "TAKEN";
        el.vTs.textContent = mark.ts || "None";
        el.vBody.textContent = "Taken tile. Locked in feed.";
      } else {
        el.vTag.textContent = taken ? "TAKEN" : "OPEN";
        el.vTs.textContent = "None";
        el.vBody.textContent = taken ? "This tile exists in feed but has no display fields." : "This tile is open.";
      }

      el.ptitle.textContent = "Tile " + tile;
      el.psub.textContent = "Tap a tile to inspect. Drag to move.";
      panel.classList.add("open");
    }

    function ensurePool(){
      const w = vp.clientWidth;
      const h = vp.clientHeight;
      const cols = Math.ceil(w / STEP) + state.POOL_PAD * 2;
      const rows = Math.ceil(h / STEP) + state.POOL_PAD * 2;

      if(cols === state.cols && rows === state.rows && state.pool.length) return;

      state.cols = cols;
      state.rows = rows;
      state.pool = [];
      world.innerHTML = "";

      const n = cols * rows;
      for(let i=0;i<n;i++){
        const d = document.createElement("div");
        d.className = "cell";
        d.innerHTML = `<div class="spray"></div><div class="tag"></div><div class="id"></div>`;
        world.appendChild(d);
        state.pool.push(d);

        d.addEventListener("click", () => {
          if(state.moved) return;
          const gx = parseInt(d.getAttribute("data-gx") || "0", 10);
          const gy = parseInt(d.getAttribute("data-gy") || "0", 10);
          const tile = d.getAttribute("data-tile") || tileIdFromCoords(gx, gy);
          openPanel(tile, gx, gy);
        }, { passive:true });
      }
    }

    function setCell(cell, gx, gy){
      const tile = tileIdFromCoords(gx, gy);
      const mark = state.marksByTile.get(tile) || null;
      const taken = state.taken.has(tile);

      cell.style.left = (gx * STEP) + "px";
      cell.style.top  = (gy * STEP) + "px";

      cell.setAttribute("data-gx", String(gx));
      cell.setAttribute("data-gy", String(gy));
      cell.setAttribute("data-tile", tile);

      cell.className = "cell" + (taken ? " taken" : "");
      cell.setAttribute("aria-label", `Tile ${tile} ${taken ? "taken" : "open"}`);

      const spray = cell.querySelector(".spray");
      const tag = cell.querySelector(".tag");
      const id = cell.querySelector(".id");

      if(id) id.textContent = tile;

      if(tag){
        if(mark && mark.tag) tag.textContent = mark.tag;
        else tag.textContent = taken ? "TAKEN" : "";
      }

      if(spray) spray.innerHTML = makeSpraySVG(tile);
    }

    function renderPool(){
      ensurePool();

      const startGX = Math.floor(state.camX / STEP) - state.POOL_PAD;
      const startGY = Math.floor(state.camY / STEP) - state.POOL_PAD;

      const key = `${startGX},${startGY},${state.cols},${state.rows},${state.taken.size},${state.marksByTile.size}`;
      if(key === state.lastKey) return;
      state.lastKey = key;

      let i = 0;
      for(let ry=0; ry<state.rows; ry++){
        for(let rx=0; rx<state.cols; rx++){
          const gx = startGX + rx;
          const gy = startGY + ry;
          setCell(state.pool[i++], gx, gy);
        }
      }
    }

    function updateWorldTransform(){
      const w = vp.clientWidth;
      const h = vp.clientHeight;
      const tx = Math.round(w * 0.5 - state.camX);
      const ty = Math.round(h * 0.5 - state.camY);
      world.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
    }

    function tick(){
      // inertia
      if(!state.down){
        state.vx *= 0.92;
        state.vy *= 0.92;
        if(Math.abs(state.vx) < 0.02) state.vx = 0;
        if(Math.abs(state.vy) < 0.02) state.vy = 0;
        state.camX -= state.vx;
        state.camY -= state.vy;
      }

      updateWorldTransform();
      renderPool();

      state.raf = requestAnimationFrame(tick);
    }

    function onDown(e){
      state.down = true;
      state.pid = e.pointerId;
      state.lastX = e.clientX;
      state.lastY = e.clientY;
      state.moved = false;

      vp.classList.add("dragging");
      try{ vp.setPointerCapture(state.pid); } catch(_){}
    }

    function onMove(e){
      if(!state.down || e.pointerId !== state.pid) return;

      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;

      state.lastX = e.clientX;
      state.lastY = e.clientY;

      if(Math.abs(dx) + Math.abs(dy) > 2) state.moved = true;

      state.camX -= dx;
      state.camY -= dy;

      state.vx = dx;
      state.vy = dy;
    }

    function onUp(e){
      if(e.pointerId !== state.pid) return;
      state.down = false;
      state.pid = null;
      vp.classList.remove("dragging");

      // prevent click after drag
      setTimeout(() => { state.moved = false; }, 0);
    }

    async function loadFeed(){
      try{
        const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
        const data = await res.json();

        state.taken = new Set();
        state.marksByTile = new Map();

        if(Array.isArray(data)){
          for(const m of data){
            const gx = Number.isFinite(+m.gx) ? +m.gx : null;
            const gy = Number.isFinite(+m.gy) ? +m.gy : null;
            let tile = (typeof m.tile === "string" && m.tile) ? String(m.tile).trim().toUpperCase().replace(/[–—−]/g, "-") : null;
            if(!tile && gx !== null && gy !== null) tile = tileIdFromCoords(gx, gy);
            if(!tile) continue;

            state.taken.add(tile);

            state.marksByTile.set(tile, {
              tile,
              gx: gx !== null ? gx : 0,
              gy: gy !== null ? gy : 0,
              tag: (typeof m.tag === "string" ? m.tag : "") || "",
              ts: (typeof m.ts === "string" ? m.ts : "") || ""
            });
          }
        }

        if(el.kTaken) el.kTaken.textContent = String(state.taken.size);
      } catch(_){
        if(el.kTaken) el.kTaken.textContent = "0";
        toastShow("feed load failed", "warn");
      }
    }

    // IMPORTANT: no auto-open, ever
    function startNearSeed(){
      // center near first mark if it exists, but do NOT open panel
      let gx = 0, gy = 0;

      for(const v of state.marksByTile.values()){
        gx = Number.isFinite(v.gx) ? v.gx : 0;
        gy = Number.isFinite(v.gy) ? v.gy : 0;
        break;
      }

      state.camX = gx * STEP;
      state.camY = gy * STEP;

      closePanel();
      toastShow("start " + tileIdFromCoords(gx, gy), "good");
    }

    function parseQueryToCoords(str){
      let raw = String(str || "").trim().toUpperCase().replace(/[–—−]/g, "-");
      raw = raw.replace(/\s+/g, "");

      // coords: "23,-11"
      if(/^-?\d+,\s*-?\d+$/.test(raw)){
        const parts = raw.split(",");
        const gx = parseInt(parts[0].trim(), 10);
        const gy = parseInt(parts[1].trim(), 10);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      // tile: "E23-N11"
      let m = raw.match(/^([EW])(\d+)-([NS])(\d+)$/);
      if(m){
        const gx = parseInt(m[2], 10) * (m[1] === "W" ? -1 : 1);
        const gy = parseInt(m[4], 10) * (m[3] === "N" ? -1 : 1);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      // tile: "E23N11"
      m = raw.match(/^([EW])(\d+)([NS])(\d+)$/);
      if(m){
        const gx = parseInt(m[2], 10) * (m[1] === "W" ? -1 : 1);
        const gy = parseInt(m[4], 10) * (m[3] === "N" ? -1 : 1);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      return null;
    }

    function handleGo(){
      const q = (el.q && el.q.value) ? el.q.value : "";
      const p = parseQueryToCoords(q);
      if(!p){
        toastShow("bad search", "warn");
        return;
      }

      // canonicalize input to wall tile id
      el.q.value = p.tile;

      state.camX = p.gx * STEP;
      state.camY = p.gy * STEP;

      // do NOT open the panel on search
      closePanel();

      toastShow("jump " + p.tile, "good");
    }

    // wire up
    el.close.addEventListener("click", closePanel, { passive:true });
    el.go.addEventListener("click", handleGo, { passive:true });
    el.q.addEventListener("keydown", (e) => {
      if(e.key === "Enter") handleGo();
    }, { passive:true });

    vp.addEventListener("pointerdown", onDown, { passive:false });
    vp.addEventListener("pointermove", onMove, { passive:false });
    vp.addEventListener("pointerup", onUp, { passive:false });
    vp.addEventListener("pointercancel", onUp, { passive:false });

    // boot
    updateWorldTransform();
    renderPool();
    requestAnimationFrame(tick);

    loadFeed().then(() => startNearSeed());
    setInterval(loadFeed, 15000);
  </script>
</body>
</html>
