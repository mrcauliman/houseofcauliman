<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
  <title>MONOLITH | The Wall</title>
<meta name="monolith-build" content="402aa48-66fe4f1" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0e1116;
      --panel2:#0b0f14;
      --text:#e9eef7;
      --muted:#a6b0c2;
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.16);
      --good:#8bf28b;
      --bad:#ff6b6b;
      --warn:#ffd166;
      --accent:#6aa9ff;

      --shadow:rgba(0,0,0,.45);
      --radius:18px;
      --green:#2fbf6b;

      /* grid */
      --step:128px;
      --gap:2px;
      --tile:126px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,209,102,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      line-height:1.45;
      letter-spacing:.2px;
      overflow:hidden;
    }

    a{color:inherit;text-decoration:none}

    .top{
      position:fixed;left:12px;right:12px;top:12px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(23,53,36,.9);
      border-radius:18px;
      background:rgba(7,9,11,.62);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      z-index:999;
    }

    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:34px;height:34px;object-fit:contain}
    .brand .t{font-weight:1000;letter-spacing:.6px;font-size:13px;text-transform:uppercase;line-height:1.1}
    .brand .s{margin-top:3px;color:rgba(233,238,247,.72);font-size:12px;line-height:1.2}
    .sp{flex:1}

    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:10px 12px;border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.85);
      font-size:13px;color:var(--text);
      cursor:pointer;user-select:none;
      letter-spacing:.3px;
      font-weight:900;
      -webkit-tap-highlight-color: transparent;
      white-space:nowrap;
    }
    .btn:hover{border-color:rgba(47,191,107,.55)}
    .btn.primary{
      background:linear-gradient(180deg, rgba(47,191,107,.22), rgba(11,27,19,.88));
      border-color:rgba(47,191,107,.65);
    }

    .search{
      display:flex;gap:8px;align-items:center;
      padding:8px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.20);
      max-width:520px;
      flex: 1 1 380px;
    }
    .search input{
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:13px;
      padding:6px 8px;
    }
    .search input::placeholder{color:rgba(166,176,194,.75)}

    .kpi{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:9px 12px;border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
      color:rgba(233,238,247,.85);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;
      background:rgba(47,191,107,.9);
      box-shadow:0 0 0 4px rgba(47,191,107,.15);
    }

    .nav{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      justify-content:flex-end;
    }

    #vp{
      position:fixed;left:0;top:0;right:0;bottom:0;
      padding-top:86px;
      touch-action:none;
      overflow:hidden;
    }
    #world{
      position:absolute;left:50%;top:50%;
      transform:translate3d(-50%, -50%, 0);
      will-change:transform;
    }

    .tile{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(14,17,22,.92);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }
    .tile.open{
      background:rgba(14,17,22,.55);
      border-color:rgba(255,255,255,.08);
    }
    .tile img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .panel{
      position:fixed;
      right:12px;
      top:96px;
      bottom:12px;
      width:min(420px, calc(100vw - 24px));
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(14,17,22,.92);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      overflow:hidden;
      display:none;
      z-index:998;
    }
    .panel.show{display:block}

    .ph{
      display:flex;gap:10px;align-items:center;
      padding:12px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.14);
    }
    .ttl{font-weight:1000;letter-spacing:.4px;text-transform:uppercase;font-size:12px}
    .sub{color:rgba(233,238,247,.72);font-size:12px;margin-top:4px}
    .xbtn{
      padding:10px 12px;border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.85);
      font-size:12px;color:var(--text);
      cursor:pointer;font-weight:1000;
    }

    .pb{
      padding:12px;
      overflow:auto;
      height:calc(100% - 58px);
    }
    .kv{
      display:grid;
      grid-template-columns: 110px 1fr;
      gap:8px 10px;
      align-items:start;
      font-size:13px;
    }
    .k{color:rgba(166,176,194,.82);font-size:12px}
    .v{color:rgba(233,238,247,.92);overflow-wrap:anywhere}
    .muted{color:rgba(166,176,194,.82);font-size:13px;margin-top:10px}

    .badge{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 10px;border-radius:999px;
      border:1px solid rgba(47,191,107,.55);
      background:rgba(47,191,107,.12);
      color:rgba(233,238,247,.92);
      font-size:12px;font-weight:1000;
      margin-right:10px;
    }

    .copy{
      margin-left:8px;
      padding:7px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.20);
      color:rgba(233,238,247,.92);
      cursor:pointer;
      font-size:12px;
      font-weight:900;
    }
    .copy:hover{border-color:rgba(47,191,107,.45)}

    .toast{
      position:fixed;
      left:50%;
      bottom:16px;
      transform:translate3d(-50%, 10px, 0);
      opacity:0;
      pointer-events:none;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.72);
      backdrop-filter: blur(10px);
      font-weight:1000;
      letter-spacing:.2px;
      font-size:12px;
      max-width:90vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      z-index:1000;
      transition:opacity .18s ease, transform .18s ease;
    }
    .toast.show{transform:translate3d(-50%, 0, 0);opacity:1}
    .toast.good{border-color:rgba(47,191,107,.75)}
    .toast.warn{border-color:rgba(255,225,117,.75)}
    .toast.bad{border-color:rgba(255,91,91,.75)}

    @media (max-width: 900px){
      .search{max-width:100%;flex:1 1 100%}
      .kpi{justify-content:flex-start}
      .nav{justify-content:flex-start}
      .panel{left:12px;right:12px;width:auto}
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="brand">
      <img src="/monolith/assets/monolith_logo.webp" alt="MONOLITH" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">Leave your mark. Live forever.</div>
      </div>
    </div>

    <div class="sp"></div>

    <div class="search" aria-label="search tiles">
      <input id="q" autocomplete="off" spellcheck="false" placeholder="Search tile E23-N11 or E23N11 or 23,-11" />
      <button class="btn" id="go" type="button">Go</button>
    </div>

    <div class="kpi">
      <div class="pill"><span class="dot"></span><span id="kTaken">0</span> taken</div>
      <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile"><span>Claim a Tile</span></a>
      <button class="btn" id="btnCenter" type="button" aria-label="return to center"><span>Return to Center</span></button>
      <div class="nav" aria-label="nav">
        <a class="btn" href="/monolith/rules.html" aria-label="rules"><span>Rules</span></a>
        <a class="btn" href="/monolith/monolith_laws.html" aria-label="laws"><span>Laws</span></a>
      </div>
    </div>
  </header>

  <div id="vp" aria-label="wall viewport">
    <div id="world" aria-label="wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="ph">
      <div>
        <div class="ttl" id="ptitle">Tile</div>
        <div class="sub" id="psub">Tap a tile to inspect details.</div>
      </div>
      <div class="sp"></div>
      <button class="xbtn" id="close" type="button" aria-label="close panel">X</button>
    </div>
    <div class="pb">
      <div class="kv" aria-label="tile details">
        <div class="k">Tile</div><div class="v" id="vTile">None</div>
        <div class="k">Coords</div><div class="v" id="vCoords">0, 0</div>
        <div class="k">Tag</div><div class="v" id="vTag">Open</div>
        <div class="k">Date</div><div class="v" id="vTs">None</div>

        <div class="k">Wallet</div>
        <div class="v" id="vWalletWrap">
          <span class="badge" id="vVerified" style="display:none">Verified owner</span>
          <span id="vWalletMasked">None</span>
          <span id="vWalletFull" style="display:none">None</span>
          <button class="copy" id="revealWallet" type="button" style="display:none">Reveal</button>
          <button class="copy" id="hideWallet" type="button" style="display:none">Hide</button>
          <button class="copy" id="copyWallet" type="button" style="display:none">Copy</button>
        </div>

        <div class="k">Link or Handle</div>
        <div class="v" id="vLinkWrap">
          <span id="vLink">None</span>
        </div>

        <div class="k">Note</div><div class="v" id="vNote">None</div>
      </div>
      <div class="muted" id="vBody">Tap a tile to inspect details.</div>
    </div>
  </aside>

  <div class="toast" id="toast" aria-label="toast"></div>

  <script>
  (() => {
    const FEED_URL = "/assets/monolith/feed_live_v2.json?cb=" + Date.now();

    const MONOLITH_TILE = "E0-N0";
    const MONOLITH_TAG  = "MONOLITH";
    const MONOLITH_LOGO = "/monolith/assets/monolith_logo.webp";

    const MONOLITH_WALLET = "r9iKXkMGF2HxAEsCLqdrghWpJmfFZN1Gw8";

    const CREATOR_TILE = "E1-N0";
    const CREATOR_TAG  = "MRCAULIMAN";
    const CREATOR_LOGO_CANDIDATES = [
      "/assets/monolith/mrcauliman_logo.webp",
      "/assets/monolith/mrcauliman_logo.png"
    ];
    let CREATOR_LOGO = CREATOR_LOGO_CANDIDATES[0];

    const vp    = document.getElementById("vp");
    const world = document.getElementById("world");
    const panel = document.getElementById("panel");
    const toast = document.getElementById("toast");

    const el = {
      q: document.getElementById("q"),
      go: document.getElementById("go"),
      kTaken: document.getElementById("kTaken"),
      close: document.getElementById("close"),

      ptitle: document.getElementById("ptitle"),
      psub: document.getElementById("psub"),
      vTile: document.getElementById("vTile"),
      vCoords: document.getElementById("vCoords"),
      vTag: document.getElementById("vTag"),
      vTs: document.getElementById("vTs"),

      vVerified: document.getElementById("vVerified"),

      vWalletWrap: document.getElementById("vWalletWrap"),
      vWalletMasked: document.getElementById("vWalletMasked"),
      vWalletFull: document.getElementById("vWalletFull"),
      revealWallet: document.getElementById("revealWallet"),
      hideWallet: document.getElementById("hideWallet"),
      copyWallet: document.getElementById("copyWallet"),

      vLinkWrap: document.getElementById("vLinkWrap"),
      vLink: document.getElementById("vLink"),

      vNote: document.getElementById("vNote"),
      vBody: document.getElementById("vBody"),

      btnCenter: document.getElementById("btnCenter")
    };

    const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;
    const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 126;

    const state = {
      scale: 1,
      x: 0,
      y: 0,
      dragging: false,
      lastX: 0,
      lastY: 0,
      pointers: new Map(),
      pinching: false,
      startDist: 0,
      startScale: 1,
      feed: [],
      tileMap: new Map(),
      takenCount: 0,
      selectedKey: null,
      toastT: null
    };

    function showToast(msg, kind) {
      if (state.toastT) clearTimeout(state.toastT);
      toast.classList.remove("good","warn","bad","show");
      toast.textContent = String(msg || "");
      if (kind) toast.classList.add(kind);
      toast.classList.add("show");
      state.toastT = setTimeout(() => {
        toast.classList.remove("show");
      }, 1400);
    }

    function applyTransform() {
      world.style.transform = `translate3d(calc(-50% + ${state.x}px), calc(-50% + ${state.y}px), 0) scale(${state.scale})`;
    }

    function clampScale(s) {
      if (!Number.isFinite(s)) return 1;
      if (s < 0.2) return 0.2;
      if (s > 4) return 4;
      return s;
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx*dx + dy*dy);
    }

    function getTwoPointers() {
      const arr = Array.from(state.pointers.values());
      if (arr.length < 2) return null;
      return [arr[0], arr[1]];
    }

    function onDown(e) {
      vp.setPointerCapture(e.pointerId);
      state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (state.pointers.size === 1) {
        state.dragging = true;
        state.lastX = e.clientX;
        state.lastY = e.clientY;
        state.pinching = false;
      } else if (state.pointers.size >= 2) {
        const p = getTwoPointers();
        if (!p) return;
        state.pinching = true;
        state.startDist = dist(p[0], p[1]);
        state.startScale = state.scale;
      }
    }

    function onMove(e) {
      if (!state.pointers.has(e.pointerId)) return;

      state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (state.pinching && state.pointers.size >= 2) {
        const p = getTwoPointers();
        if (!p) return;
        const d = dist(p[0], p[1]);
        if (!state.startDist) return;
        const factor = d / state.startDist;
        state.scale = clampScale(state.startScale * factor);
        applyTransform();
        return;
      }

      if (!state.dragging) return;

      const dx = e.clientX - state.lastX;
      const dy = e.clientY - state.lastY;
      state.lastX = e.clientX;
      state.lastY = e.clientY;

      state.x += dx;
      state.y += dy;
      applyTransform();
    }

    function onUp(e) {
      state.pointers.delete(e.pointerId);

      if (state.pointers.size === 0) {
        state.dragging = false;
        state.pinching = false;
        return;
      }

      if (state.pointers.size === 1) {
        const last = Array.from(state.pointers.values())[0];
        state.dragging = true;
        state.pinching = false;
        state.lastX = last.x;
        state.lastY = last.y;
      } else if (state.pointers.size >= 2) {
        const p = getTwoPointers();
        if (!p) return;
        state.pinching = true;
        state.startDist = dist(p[0], p[1]);
        state.startScale = state.scale;
      }
    }

    function onWheel(e) {
      e.preventDefault();
      const delta = -e.deltaY;
      const boost = e.ctrlKey ? 0.0025 : 0.0015;
      const next = clampScale(state.scale * (1 + delta * boost));
      state.scale = next;
      applyTransform();
    }

    function tileKey(e, n) { return `E${e}-N${n}`; }

    function parseTile(s) {
      const raw = String(s || "").trim().toUpperCase();
      if (!raw) return null;

      let m = raw.match(/^E(-?\d+)\s*-\s*N(-?\d+)$/);
      if (m) return { e: parseInt(m[1],10), n: parseInt(m[2],10) };

      m = raw.match(/^E(-?\d+)\s*N(-?\d+)$/);
      if (m) return { e: parseInt(m[1],10), n: parseInt(m[2],10) };

      m = raw.match(/^(-?\d+)\s*,\s*(-?\d+)$/);
      if (m) return { e: parseInt(m[1],10), n: parseInt(m[2],10) };

      return null;
    }

    function centerOn(e, n) {
      const x = e * STEP;
      const y = n * STEP;
      state.x = -x;
      state.y = -y;
      applyTransform();
    }

    function setPanel(open) {
      if (open) panel.classList.add("show");
      else panel.classList.remove("show");
    }

    function maskWallet(w) {
      const s = String(w || "");
      if (s.length < 12) return s;
      return s.slice(0, 6) + "…" + s.slice(-6);
    }

    function setWalletUI(full) {
      const w = String(full || "");
      if (!w) {
        el.vWalletMasked.textContent = "None";
        el.vWalletFull.textContent = "None";
        el.vWalletFull.style.display = "none";
        el.vWalletMasked.style.display = "inline";
        el.revealWallet.style.display = "none";
        el.hideWallet.style.display = "none";
        el.copyWallet.style.display = "none";
        return;
      }

      el.vWalletMasked.textContent = maskWallet(w);
      el.vWalletFull.textContent = w;

      el.vWalletMasked.style.display = "inline";
      el.vWalletFull.style.display = "none";
      el.revealWallet.style.display = "inline-flex";
      el.hideWallet.style.display = "none";
      el.copyWallet.style.display = "inline-flex";
    }

    function selectTile(key) {
      state.selectedKey = key;

      const rec = state.tileMap.get(key) || null;
      if (!rec) {
        el.ptitle.textContent = "Tile";
        el.psub.textContent = "Open tile";
        el.vTile.textContent = key || "None";
        el.vCoords.textContent = "0, 0";
        el.vTag.textContent = "Open";
        el.vTs.textContent = "None";
        el.vLink.textContent = "None";
        el.vNote.textContent = "None";
        el.vBody.textContent = "Open tile";
        el.vVerified.style.display = "none";
        setWalletUI("");
        setPanel(true);
        return;
      }

      el.ptitle.textContent = rec.tile || "Tile";
      el.psub.textContent = rec.tag ? `Tag: ${rec.tag}` : "Taken tile";
      el.vTile.textContent = rec.tile || key;
      el.vCoords.textContent = `${rec.e}, ${rec.n}`;
      el.vTag.textContent = rec.tag || "Taken";
      el.vTs.textContent = rec.ts || "None";
      el.vLink.textContent = rec.link || "None";
      el.vNote.textContent = rec.note || "None";
      el.vBody.textContent = rec.body || "";

      const isVerified = rec.wallet && (String(rec.wallet) === String(MONOLITH_WALLET));
      if (isVerified) el.vVerified.style.display = "inline-flex";
      else el.vVerified.style.display = "none";

      setWalletUI(rec.wallet || "");

      setPanel(true);
    }

    function buildWorld() {
      world.innerHTML = "";
      state.tileMap.clear();
      state.takenCount = 0;

      for (const r of state.feed) {
        if (!r || !r.tile) continue;
        const t = String(r.tile).trim().toUpperCase();
        const m = t.match(/^E(-?\d+)-N(-?\d+)$/);
        if (!m) continue;
        const e = parseInt(m[1],10);
        const n = parseInt(m[2],10);

        const key = tileKey(e, n);

        const rec = {
          tile: key,
          e, n,
          ts: r.ts || "",
          tag: r.tag || "",
          wallet: r.wallet || "",
          link: r.link || "",
          note: r.note || "",
          body: r.body || ""
        };

        let img = r.img || r.image || "";
        if (!img && key === MONOLITH_TILE) img = MONOLITH_LOGO;
        if (!img && key === CREATOR_TILE) img = CREATOR_LOGO;

        rec.img = img;

        state.tileMap.set(key, rec);
      }

      state.takenCount = state.tileMap.size;
      el.kTaken.textContent = String(state.takenCount);

      const keys = Array.from(state.tileMap.keys());
      for (const key of keys) {
        const rec = state.tileMap.get(key);
        if (!rec) continue;

        const d = document.createElement("div");
        d.className = "tile";
        d.style.left = `${rec.e * STEP}px`;
        d.style.top  = `${rec.n * STEP}px`;

        if (!rec.img) d.classList.add("open");
        else {
          const im = document.createElement("img");
          im.loading = "lazy";
          im.alt = rec.tile;
          im.src = rec.img;
          d.appendChild(im);
        }

        d.dataset.tile = rec.tile;
        d.addEventListener("click", (ev) => {
          ev.stopPropagation();
          selectTile(rec.tile);
        });

        world.appendChild(d);
      }
    }

    async function loadFeed() {
      try {
        const r = await fetch(FEED_URL, { cache: "no-store" });
        if (!r.ok) throw new Error("feed http " + r.status);
        const data = await r.json();
        if (!Array.isArray(data)) throw new Error("feed bad format");
        state.feed = data;
      } catch (e) {
        state.feed = [];
        showToast("Feed load failed", "bad");
      }
    }

    function startNearSeed() {
      centerOn(0, 0);
      state.scale = 1;
      applyTransform();
    }

    function goSearch() {
      const q = el.q.value;
      const t = parseTile(q);
      if (!t) {
        showToast("Tile not recognized", "warn");
        return;
      }
      const key = tileKey(t.e, t.n);
      centerOn(t.e, t.n);
      showToast(`Centered ${key}`, "good");
      if (state.tileMap.has(key)) selectTile(key);
      else {
        setPanel(false);
      }
    }

    vp.addEventListener("pointerdown", onDown);
    vp.addEventListener("pointermove", onMove);
    vp.addEventListener("pointerup", onUp);
    vp.addEventListener("pointercancel", onUp);
    vp.addEventListener("wheel", onWheel, { passive:false });

    vp.addEventListener("click", () => setPanel(false));
    el.close.addEventListener("click", (ev) => { ev.stopPropagation(); setPanel(false); });

    el.go.addEventListener("click", goSearch);
    el.q.addEventListener("keydown", (e) => {
      if (e.key === "Enter") goSearch();
    });

    // Return to Center uses the same path as Search -> Go
    // This avoids duplicating camera math and guarantees identical behavior
    el.btnCenter.addEventListener("click", () => {
      try {
        el.q.value = "E0-N0";
        el.q.dispatchEvent(new Event("input", { bubbles: true }));
        el.go.click();
        el.q.blur();
      } catch (e) {
      }
    });

    el.revealWallet.addEventListener("click", (ev) => {
      ev.stopPropagation();
      el.vWalletMasked.style.display = "none";
      el.vWalletFull.style.display = "inline";
      el.revealWallet.style.display = "none";
      el.hideWallet.style.display = "inline-flex";
    });

    el.hideWallet.addEventListener("click", (ev) => {
      ev.stopPropagation();
      el.vWalletMasked.style.display = "inline";
      el.vWalletFull.style.display = "none";
      el.revealWallet.style.display = "inline-flex";
      el.hideWallet.style.display = "none";
    });

    el.copyWallet.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      const w = (el.vWalletFull.textContent || "").trim();
      if (!w || w === "None") return;

      let ok = false;
      try {
        await navigator.clipboard.writeText(w);
        ok = true;
      } catch (e) {
        ok = false;
      }
      showToast(ok ? "Copied" : "Copy failed", ok ? "good" : "bad");
    });

    (async () => {
      for (const u of CREATOR_LOGO_CANDIDATES) {
        try {
          const r = await fetch(u, { method: "HEAD", cache: "no-store" });
          if (r.ok) { CREATOR_LOGO = u; break; }
        } catch (e) {
        }
      }

      await loadFeed();
      buildWorld();
      startNearSeed();
    })();
  })();
  </script>
</body>
</html>
