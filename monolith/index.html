<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0c1116;
      --panel2:#0f151c;
      --line:#1f2a36;
      --fg:#f5f7f4;
      --muted:#a9b3bd;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;
      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      overflow:hidden;
    }
    a{color:inherit;text-decoration:none}

    .hud{
      position:fixed;
      top:12px;
      left:12px;
      right:12px;
      z-index:50;
      display:flex;
      align-items:stretch;
      justify-content:space-between;
      gap:12px;
      pointer-events:none;
    }
    .hud .card{
      pointer-events:auto;
      border:1px solid var(--line);
      background:rgba(12,17,22,.86);
      backdrop-filter: blur(6px);
      border-radius:var(--radius);
      box-shadow:0 14px 34px var(--shadow);
      padding:12px 12px;
    }
    .brand{
      display:flex;
      gap:10px;
      align-items:center;
      min-width:320px;
    }
    .dot{width:10px;height:10px;border-radius:999px;background:var(--green);box-shadow:0 0 18px rgba(47,191,107,.25)}
    .brand h1{margin:0;font-size:14px;letter-spacing:.2px}
    .brand .sub{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}

    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      border-radius:999px;
      padding:9px 12px;
      font-size:12px;
      color:var(--muted);
      user-select:none;
    }
    .btn:hover{color:var(--fg);border-color:rgba(47,191,107,.55)}
    .btn.primary{
      background:rgba(47,191,107,.15);
      border-color:rgba(47,191,107,.45);
      color:var(--fg);
      font-weight:800;
    }

    .viewport{
      position:fixed;
      inset:0;
      overflow:hidden;
      touch-action:none;
      cursor:grab;
    }
    .viewport.dragging{cursor:grabbing}

    .world{
      position:absolute;
      left:0;
      top:0;
      transform:translate(0px,0px);
      will-change:transform;
    }

    .tcell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:16px;
      border:1px solid rgba(31,42,54,.95);
      background:rgba(255,255,255,.02);
      overflow:hidden;
      user-select:none;
      box-shadow:0 10px 24px rgba(0,0,0,.28);
    }
    .tcell:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.06), transparent 40%),
        radial-gradient(circle at 70% 80%, rgba(255,255,255,.05), transparent 45%);
      pointer-events:none;
    }
    .tcell .meta{
      position:absolute;
      inset:auto 10px 10px 10px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:8px;
      pointer-events:none;
    }
    .tcell .id{
      font-size:10px;
      font-weight:900;
      color:rgba(245,247,244,.85);
      letter-spacing:.2px;
    }
    .tcell .coord{
      font-size:10px;
      color:rgba(169,179,189,.85);
    }

    .tcell .spray{
      position:absolute;
      inset:0;
      opacity:.0;
      transform:scale(1.02);
      transition:opacity .2s ease;
      pointer-events:none;
    }

    .tcell.taken{
      border-color:rgba(255,225,117,.45);
      background:rgba(255,255,255,.03);
    }
    .tcell.taken .spray{opacity:1}
    .tcell.taken:after{
      content:"";
      position:absolute;
      inset:0;
      box-shadow:0 0 0 2px rgba(255,225,117,.06) inset;
      pointer-events:none;
    }

    .panel{
      position:fixed;
      top:86px;
      right:12px;
      width:min(420px, calc(100vw - 24px));
      max-height:calc(100vh - 98px);
      overflow:auto;
      z-index:60;
      border:1px solid var(--line);
      background:rgba(12,17,22,.92);
      backdrop-filter: blur(6px);
      border-radius:var(--radius);
      box-shadow:0 18px 46px var(--shadow);
      padding:14px;
      display:none;
    }
    .panel.show{display:block}
    .panelTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .panel h2{
      margin:0;
      font-size:14px;
      letter-spacing:.2px;
    }
    .panel .small{
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    .xbtn{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--muted);
      border-radius:12px;
      padding:8px 10px;
      font-size:12px;
      cursor:pointer;
    }
    .xbtn:hover{color:var(--fg);border-color:rgba(47,191,107,.55)}

    .kv{
      margin-top:12px;
      border-top:1px solid rgba(31,42,54,.8);
      padding-top:12px;
      display:grid;
      grid-template-columns:120px 1fr;
      gap:8px 12px;
      font-size:12px;
    }
    .kv .k{color:var(--muted)}
    .kv .v{color:rgba(245,247,244,.9)}
    .mono-link{
      margin-top:12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .mono-link a{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      color:var(--muted);
    }
    .mono-link a:hover{color:var(--fg);border-color:rgba(47,191,107,.55)}

    .toast{
      position:fixed;
      left:12px;
      bottom:12px;
      z-index:80;
      border:1px solid var(--line);
      background:rgba(12,17,22,.92);
      backdrop-filter: blur(6px);
      border-radius:14px;
      padding:10px 12px;
      color:var(--muted);
      font-size:12px;
      box-shadow:0 12px 30px var(--shadow);
      opacity:0;
      transform:translateY(10px);
      transition:opacity .18s ease, transform .18s ease;
      pointer-events:none;
    }
    .toast.show{opacity:1;transform:translateY(0px)}
    .toast.good{border-color:rgba(47,191,107,.45);color:rgba(245,247,244,.9)}
    .toast.warn{border-color:rgba(255,225,117,.55);color:rgba(245,247,244,.9)}
    .toast.bad{border-color:rgba(255,91,91,.45);color:rgba(245,247,244,.9)}
  </style>
</head>

<body>
  <div class="hud">
    <div class="card brand">
      <div class="dot"></div>
      <div>
        <h1>MONOLITH — The Wall of Record</h1>
        <div class="sub">Drag to move. Tap a tile to inspect.</div>
      </div>
    </div>

    <div class="card actions">
      <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile">
        <span class="k">ACTION</span> Claim a Tile
      </a>
      <a class="btn" href="/assets/monolith/feed.json" target="_blank" rel="noreferrer" aria-label="view feed json">
        Feed
      </a>
      <a class="btn" href="/" aria-label="home">Home</a>
    </div>
  </div>

  <div class="viewport" id="vp" aria-label="monolith wall viewport">
    <div class="world" id="world" aria-label="monolith wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="panelTop">
      <div>
        <h2 id="ptitle">Tile</h2>
        <div class="small" id="psub">Tap a tile to inspect details.</div>
      </div>
      <button class="xbtn" id="pclose" type="button">Close</button>
    </div>

    <div class="kv">
      <div class="k">Tile</div><div class="v" id="vTile">None</div>
      <div class="k">Coords</div><div class="v" id="vCoords">0, 0</div>
      <div class="k">Taken</div><div class="v" id="vTaken">No</div>
      <div class="k">Tag</div><div class="v" id="vTag">None</div>
      <div class="k">Date</div><div class="v" id="vTs">None</div>
      <div class="k">Body</div><div class="v" id="vBody">None</div>
    </div>

    <div class="mono-link" aria-label="tile links">
      <a href="/monolith/claim/" id="lnkClaim">Claim flow</a>
      <a href="/assets/monolith/feed.json" target="_blank" rel="noreferrer">feed.json</a>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const FEED_URL = "/assets/monolith/feed.json";

  const vp = document.getElementById("vp");
  const world = document.getElementById("world");

  const panel = document.getElementById("panel");
  const pclose = document.getElementById("pclose");
  const ptitle = document.getElementById("ptitle");
  const psub = document.getElementById("psub");

  const vTile = document.getElementById("vTile");
  const vCoords = document.getElementById("vCoords");
  const vTaken = document.getElementById("vTaken");
  const vTag = document.getElementById("vTag");
  const vTs = document.getElementById("vTs");
  const vBody = document.getElementById("vBody");

  const toast = document.getElementById("toast");

  const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;
  const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 118;

  const POOL_COLS = 9;
  const POOL_ROWS = 7;
  const POOL_PAD = 2;

  const state = {
    camX: 0,
    camY: 0,
    vx: 0,
    vy: 0,
    dragging: false,
    downX: 0,
    downY: 0,
    lastX: 0,
    lastY: 0,
    lastT: 0,

    cols: POOL_COLS,
    rows: POOL_ROWS,
    pool: [],
    poolGX0: 0,
    poolGY0: 0,

    taken: new Set(),
    marksByTile: new Map(),

    lastRenderKey: ""
  };

  function toastShow(msg, kind){
    if(!toast) return;
    toast.className = "toast" + (kind ? (" " + kind) : "");
    toast.textContent = msg;
    toast.classList.remove("show");
    requestAnimationFrame(()=>toast.classList.add("show"));
    setTimeout(()=>toast.classList.remove("show"), 1400);
  }

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  function tileIdFromCoords(gx, gy){
    const ax = Math.abs(gx);
    const ay = Math.abs(gy);
    const sx = gx < 0 ? "W" : "E";
    const sy = gy < 0 ? "N" : "S";
    return sx + ax + "-" + sy + ay;
  }

  function parseTileToCoords(tile){
    if(typeof tile !== "string") return null;
    const raw = tile.trim().toUpperCase();
    const m = raw.match(/^([EW])(\d+)-([NS])(\d+)$/);
    if(!m) return null;
    const gx = (m[1] === "W") ? -parseInt(m[2],10) : parseInt(m[2],10);
    const gy = (m[3] === "N") ? -parseInt(m[4],10) : parseInt(m[4],10);
    if(!Number.isFinite(gx) || !Number.isFinite(gy)) return null;
    return { gx, gy, tile: tileIdFromCoords(gx, gy) };
  }

  function normalizeMark(m){
    if(!m || typeof m !== "object") return null;

    const gx = Number.isFinite(+m.gx) ? +m.gx : null;
    const gy = Number.isFinite(+m.gy) ? +m.gy : null;

    const raw = (typeof m.tile === "string" && m.tile) ? String(m.tile).trim().toUpperCase() : null;

    if(raw){
      const c = parseTileToCoords(raw);
      if(c) return { gx: c.gx, gy: c.gy, tile: c.tile, raw: c.tile };
      if(Number.isFinite(gx) && Number.isFinite(gy)) return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
      return { gx: 0, gy: 0, tile: raw, raw };
    }

    if(Number.isFinite(gx) && Number.isFinite(gy)){
      return { gx, gy, tile: tileIdFromCoords(gx, gy), raw: tileIdFromCoords(gx, gy) };
    }

    return null;
  }

  function mulberry32(seed){
    let t = seed >>> 0;
    return function(){
      t += 0x6D2B79F5;
      let x = Math.imul(t ^ (t >>> 15), 1 | t);
      x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashSeed(str){
    const s = String(str || "");
    let h = 2166136261 >>> 0;
    for(let i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeSpraySVG(seedStr){
    const seed = hashSeed(seedStr);
    const rnd = mulberry32(seed);

    const p = [];
    const n = 16 + Math.floor(rnd()*12);

    for(let i=0;i<n;i++){
      const cx = Math.floor(rnd()*TILE);
      const cy = Math.floor(rnd()*TILE);
      const r = 6 + Math.floor(rnd()*22);

      const o = 0.05 + rnd()*0.12;
      p.push(
        `<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(47,191,107,${o.toFixed(3)})"/>`
      );
    }

    const streaks = 8 + Math.floor(rnd()*10);
    for(let i=0;i<streaks;i++){
      const x1 = Math.floor(rnd()*TILE);
      const y1 = Math.floor(rnd()*TILE);
      const x2 = clamp(x1 + Math.floor((rnd()-0.5)*70), 0, TILE);
      const y2 = clamp(y1 + Math.floor((rnd()-0.5)*70), 0, TILE);
      const w = 1 + Math.floor(rnd()*3);
      const o = 0.06 + rnd()*0.14;
      p.push(
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,225,117,${o.toFixed(3)})" stroke-width="${w}" stroke-linecap="round"/>`
      );
    }

    return `<svg viewBox="0 0 ${TILE} ${TILE}" width="${TILE}" height="${TILE}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
  }

  function openPanel(tile, gx, gy){
    const mark = state.marksByTile.get(tile) || null;
    const taken = state.taken.has(tile);

    if(ptitle) ptitle.textContent = tile;
    if(psub) psub.textContent = "Tile detail";

    if(vTile) vTile.textContent = tile;
    if(vCoords) vCoords.textContent = `${gx}, ${gy}`;
    if(vTaken) vTaken.textContent = taken ? "Yes" : "No";

    if(mark){
      if(vTag) vTag.textContent = mark.tag || "None";
      if(vTs) vTs.textContent = mark.ts || "None";
      if(vBody) vBody.textContent = mark.body || "This tile is marked.";
    }else{
      if(vTag) vTag.textContent = "None";
      if(vTs) vTs.textContent = "None";
      if(vBody) vBody.textContent = taken ? "This tile exists in feed but has no display fields." : "This tile is open.";
    }

    if(panel){
      panel.classList.add("show");
    }
  }

  function closePanel(){
    if(panel) panel.classList.remove("show");
  }

  function setCell(cell, gx, gy){
    const tile = tileIdFromCoords(gx, gy);
    const taken = state.taken.has(tile);
    const mark = state.marksByTile.get(tile) || null;

    cell.style.left = (gx * STEP) + "px";
    cell.style.top  = (gy * STEP) + "px";
    cell.setAttribute("data-gx", String(gx));
    cell.setAttribute("data-gy", String(gy));
    cell.setAttribute("data-tile", tile);
    cell.setAttribute("aria-label", `Tile ${tile} ${taken ? "taken" : "open"}`);

    cell.classList.toggle("taken", taken);

    const id = cell.querySelector(".id");
    const coord = cell.querySelector(".coord");
    const spray = cell.querySelector(".spray");

    if(id) id.textContent = mark && mark.tag ? mark.tag : tile;
    if(coord) coord.textContent = `${gx},${gy}`;
    if(spray) spray.innerHTML = makeSpraySVG(tile);
  }

  function ensurePool(){
    if(!world) return;

    if(state.pool.length) return;

    const total = state.cols * state.rows;
    for(let i=0;i<total;i++){
      const d = document.createElement("div");
      d.className = "tcell";

      const spray = document.createElement("div");
      spray.className = "spray";
      d.appendChild(spray);

      const meta = document.createElement("div");
      meta.className = "meta";

      const id = document.createElement("div");
      id.className = "id";
      id.textContent = "Tile";

      const coord = document.createElement("div");
      coord.className = "coord";
      coord.textContent = "0,0";

      meta.appendChild(id);
      meta.appendChild(coord);
      d.appendChild(meta);

      d.addEventListener("click", (ev)=>{
        ev.preventDefault();
        ev.stopPropagation();
        const gx = parseInt(d.getAttribute("data-gx") || "0", 10);
        const gy = parseInt(d.getAttribute("data-gy") || "0", 10);
        const tile = d.getAttribute("data-tile") || tileIdFromCoords(gx, gy);
        openPanel(tile, gx, gy);
      });

      world.appendChild(d);
      state.pool.push(d);
    }
  }

  function renderPool(){
    if(!world) return;

    const startGX = Math.floor(state.camX / STEP) - POOL_PAD;
    const startGY = Math.floor(state.camY / STEP) - POOL_PAD;

    const key = `${startGX},${startGY},${state.cols},${state.rows},${state.taken.size}`;
    if(key === state.lastRenderKey) return;
    state.lastRenderKey = key;

    let i = 0;
    for(let ry=0; ry<state.rows; ry++){
      for(let rx=0; rx<state.cols; rx++){
        const gx = startGX + rx;
        const gy = startGY + ry;
        const cell = state.pool[i++];
        setCell(cell, gx, gy);
      }
    }
  }

  function tick(){
    state.vx *= 0.92;
    state.vy *= 0.92;

    state.camX += state.vx;
    state.camY += state.vy;

    if(world){
      world.style.transform = `translate(${-state.camX}px, ${-state.camY}px)`;
    }

    renderPool();
    requestAnimationFrame(tick);
  }

  function onDown(ev){
    if(!vp) return;
    vp.classList.add("dragging");
    state.dragging = true;
    state.downX = ev.clientX;
    state.downY = ev.clientY;
    state.lastX = ev.clientX;
    state.lastY = ev.clientY;
    state.lastT = performance.now();
    state.vx = 0;
    state.vy = 0;

    try{ vp.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  }

  function onMove(ev){
    if(!state.dragging) return;

    const now = performance.now();
    const dt = Math.max(1, now - state.lastT);

    const dx = ev.clientX - state.lastX;
    const dy = ev.clientY - state.lastY;

    state.camX -= dx;
    state.camY -= dy;

    state.vx = (-dx) / dt * 16;
    state.vy = (-dy) / dt * 16;

    state.lastX = ev.clientX;
    state.lastY = ev.clientY;
    state.lastT = now;

    if(world){
      world.style.transform = `translate(${-state.camX}px, ${-state.camY}px)`;
    }

    renderPool();
    ev.preventDefault();
  }

  function onUp(ev){
    if(!vp) return;
    vp.classList.remove("dragging");
    state.dragging = false;
    try{ vp.releasePointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  }

  async function loadFeed(){
    try{
      const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
      if(!res.ok) throw new Error("feed http " + res.status);
      const data = await res.json();

      state.taken = new Set();
      state.marksByTile = new Map();

      if(Array.isArray(data)){
        for(const raw of data){
          const n = normalizeMark(raw);
          if(!n) continue;

          const tile = n.tile;
          state.taken.add(tile);

          state.marksByTile.set(tile, {
            id: (typeof raw.id === "string" ? raw.id : ""),
            tile,
            gx: n.gx,
            gy: n.gy,
            tag: (typeof raw.tag === "string" ? raw.tag : ""),
            ts: (typeof raw.ts === "string" ? raw.ts : ""),
            body: (typeof raw.body === "string" ? raw.body : "")
          });
        }
      }

      state.lastRenderKey = "";
      renderPool();
      toastShow("feed loaded " + state.taken.size, "good");
    }catch(e){
      toastShow("feed load failed", "warn");
    }
  }

  function startNearSeed(){
    let gx = 0, gy = 0;

    for(const v of state.marksByTile.values()){
      if(Number.isFinite(v.gx) && Number.isFinite(v.gy)){
        gx = v.gx;
        gy = v.gy;
        break;
      }
    }

    state.camX = gx * STEP - (window.innerWidth / 2) + (TILE / 2);
    state.camY = gy * STEP - (window.innerHeight / 2) + (TILE / 2);

    if(world){
      world.style.transform = `translate(${-state.camX}px, ${-state.camY}px)`;
    }
    state.lastRenderKey = "";
    renderPool();

    toastShow("start " + tileIdFromCoords(gx, gy), "good");

    const t = tileIdFromCoords(gx, gy);
    const mark = state.marksByTile.get(t) || null;
    if(mark){
      openPanel(t, mark.gx, mark.gy);
    }else{
      openPanel(t, gx, gy);
    }
  }

  function boot(){
    ensurePool();

    if(vp){
      vp.addEventListener("pointerdown", onDown, { passive:false });
      vp.addEventListener("pointermove", onMove, { passive:false });
      vp.addEventListener("pointerup", onUp, { passive:false });
      vp.addEventListener("pointercancel", onUp, { passive:false });
      vp.addEventListener("click", ()=>closePanel());
    }

    if(panel){
      panel.addEventListener("click", (ev)=>ev.stopPropagation());
    }
    if(pclose){
      pclose.addEventListener("click", (ev)=>{
        ev.preventDefault();
        ev.stopPropagation();
        closePanel();
      });
    }

    requestAnimationFrame(tick);
    loadFeed().then(()=>startNearSeed());
    setInterval(loadFeed, 15000);
  }

  boot();
})();
</script>

</body>
</html>
