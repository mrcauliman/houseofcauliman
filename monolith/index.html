<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />

  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0c1116;
      --panel2:#0f151c;
      --line:#1f2a36;
      --fg:#f5f7f4;
      --muted:#a9b3bd;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;
      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(47,191,107,.10), transparent 55%),
        radial-gradient(900px 500px at 20% 0%, rgba(255,255,255,.05), transparent 55%),
        var(--bg);
      color:var(--fg);
      overflow:hidden;
    }

    a{color:inherit;text-decoration:none}
    .topbar{
      position:fixed;
      left:0; right:0; top:0;
      z-index:50;
      background:linear-gradient(to bottom, rgba(7,9,11,.92), rgba(7,9,11,.55), rgba(7,9,11,0));
      padding:16px 14px 12px;
      pointer-events:none;
    }
    .topbar .row{
      max-width:1180px;
      margin:0 auto;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      pointer-events:none;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:none;
    }
    .brand img{
      width:44px;height:44px;
      object-fit:contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.35));
    }
    .brand .txt{pointer-events:none}
    .brand h1{
      margin:0;
      font-size:14px;
      letter-spacing:.2px;
      opacity:.95;
    }
    .brand .sub{
      margin-top:4px;
      color:rgba(169,179,189,.9);
      font-size:12px;
      line-height:1.35;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      pointer-events:auto;
    }
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:var(--fg);
      border-radius:999px;
      padding:10px 14px;
      font-size:12px;
      letter-spacing:.2px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{border-color:rgba(47,191,107,.45)}
    .btn.primary{
      background:rgba(47,191,107,.14);
      border-color:rgba(47,191,107,.38);
    }
    .btn .k{
      font-weight:800;
      font-size:10px;
      letter-spacing:.6px;
      color:rgba(245,247,244,.78);
    }

    .hud{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      pointer-events:auto;
    }
    .pill{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      padding:8px 10px;
      border-radius:999px;
      font-size:12px;
      color:rgba(169,179,189,.95);
      white-space:nowrap;
    }
    .pill b{color:rgba(245,247,244,.92)}
    .pill .dot{
      display:inline-block;
      width:10px;height:10px;
      border-radius:999px;
      background:var(--green);
      box-shadow:0 0 16px rgba(47,191,107,.25);
      margin-right:8px;
      transform:translateY(1px);
    }

    .viewport{
      position:absolute;
      inset:0;
      touch-action:none;
      cursor:grab;
    }
    .viewport.drag{cursor:grabbing}

    .world{
      position:absolute;
      left:0; top:0;
      will-change:transform;
    }

    .tcell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(120px 80px at 30% 20%, rgba(255,255,255,.05), transparent 55%),
        rgba(255,255,255,.03);
      overflow:hidden;
      box-shadow:0 16px 30px rgba(0,0,0,.35);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .tcell:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(140deg, rgba(47,191,107,.08), transparent 40%),
        linear-gradient(0deg, rgba(0,0,0,.25), transparent 50%);
      opacity:.95;
      pointer-events:none;
    }
    .tcell .meta{
      position:absolute;
      left:10px; right:10px; bottom:10px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:8px;
      pointer-events:none;
    }
    .tcell .id{
      font-size:11px;
      font-weight:900;
      letter-spacing:.6px;
      color:rgba(245,247,244,.82);
      text-shadow:0 8px 18px rgba(0,0,0,.55);
    }
    .tcell .xy{
      font-size:10px;
      font-weight:800;
      letter-spacing:.3px;
      color:rgba(169,179,189,.85);
    }
    .tcell .spray{
      position:absolute;
      inset:0;
      opacity:0;
      transition:opacity .18s ease;
      pointer-events:none;
    }
    .tcell.taken{
      border-color:rgba(47,191,107,.65);
      box-shadow:0 0 0 2px rgba(47,191,107,.12) inset, 0 18px 36px rgba(0,0,0,.42);
    }
    .tcell.taken .spray{opacity:1}
    .tcell:hover{border-color:rgba(47,191,107,.45)}
    .tcell:active{transform:scale(.995)}

    .panel{
      position:fixed;
      right:14px;
      top:86px;
      width:min(430px, calc(100vw - 28px));
      max-height:calc(100vh - 110px);
      overflow:auto;
      z-index:60;
      border:1px solid var(--line);
      background:rgba(12,17,22,.92);
      backdrop-filter: blur(10px);
      border-radius:18px;
      box-shadow:0 18px 50px var(--shadow);
      transform:translateY(6px);
      opacity:0;
      pointer-events:none;
      transition:opacity .16s ease, transform .16s ease;
    }
    .panel.open{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }
    .panel .head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(31,42,54,.8);
    }
    .panel h2{
      margin:0;
      font-size:14px;
      letter-spacing:.2px;
    }
    .panel .small{
      margin-top:6px;
      color:rgba(169,179,189,.92);
      font-size:12px;
      line-height:1.35;
    }
    .panel .x{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      color:rgba(245,247,244,.92);
      width:34px;height:34px;
      border-radius:12px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .panel .x:hover{border-color:rgba(47,191,107,.45)}
    .panel .body{padding:12px 14px 14px}
    .kv{
      display:grid;
      grid-template-columns:130px 1fr;
      gap:8px 10px;
      align-items:start;
      margin-top:10px;
    }
    .kv .k{
      color:rgba(169,179,189,.92);
      font-size:12px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .kv .v{
      color:rgba(245,247,244,.92);
      font-size:12px;
      line-height:1.35;
      word-break:break-word;
    }
    .kv .v.muted{color:rgba(169,179,189,.92)}
    .divider{
      height:1px;
      background:rgba(31,42,54,.9);
      margin:12px 0 10px;
    }
    .mono-links{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .link{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      border-radius:999px;
      padding:9px 12px;
      font-size:12px;
      color:rgba(245,247,244,.92);
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .link:hover{border-color:rgba(47,191,107,.45)}

    .toast{
      position:fixed;
      left:14px;
      bottom:14px;
      z-index:70;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(12,17,22,.90);
      backdrop-filter: blur(10px);
      border-radius:14px;
      padding:10px 12px;
      color:rgba(245,247,244,.92);
      font-size:12px;
      box-shadow:0 18px 50px var(--shadow);
      opacity:0;
      transform:translateY(10px);
      transition:opacity .18s ease, transform .18s ease;
      pointer-events:none;
      max-width:min(520px, calc(100vw - 28px));
    }
    .toast.show{opacity:1;transform:translateY(0)}
    .toast b{font-weight:900}
    .toast .warn{color:var(--warn)}
    .toast .ok{color:var(--green)}
    .toast .bad{color:var(--red)}
  </style>
</head>

<body>
  <div class="topbar">
    <div class="row">
      <div class="brand">
        <img src="/assets/monolith/monolith_logo.webp" alt="MONOLITH">
        <div class="txt">
          <h1>One tile. One mark. No edits. No deletes.</h1>
          <div class="sub">Drag to move. Tap a tile to inspect details.</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile">
          <span class="k">ACTION</span> Claim a Tile
        </a>
        <div class="hud">
          <div class="pill"><span class="dot"></span><b id="kpiTaken">0</b> taken</div>
          <div class="pill"><b id="kpiTile">E0-S0</b> focus</div>
        </div>
      </div>
    </div>
  </div>

  <div class="viewport" id="vp" aria-label="monolith wall viewport">
    <div class="world" id="world" aria-label="monolith wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="head">
      <div>
        <h2 id="ptitle">Tile</h2>
        <div class="small" id="psub">Tap a tile to inspect details.</div>
      </div>
      <div class="x" id="pclose" aria-label="close">✕</div>
    </div>
    <div class="body">
      <div class="kv">
        <div class="k">Tile</div><div class="v" id="vTile">None</div>
        <div class="k">Coords</div><div class="v" id="vCoords" class="muted">0, 0</div>
        <div class="k">Status</div><div class="v" id="vStatus" class="muted">Open</div>
        <div class="k">Tag</div><div class="v" id="vTag" class="muted">None</div>
        <div class="k">Time</div><div class="v" id="vTs" class="muted">None</div>
        <div class="k">Mark ID</div><div class="v" id="vId" class="muted">None</div>
      </div>

      <div class="divider"></div>

      <div class="kv">
        <div class="k">Title</div><div class="v" id="vTitle" class="muted">None</div>
        <div class="k">Body</div><div class="v" id="vBody" class="muted">This tile is open.</div>
      </div>

      <div class="mono-links" aria-label="tile links">
        <a class="link" href="/monolith/claim/" aria-label="claim flow">Claim flow</a>
        <a class="link" href="/assets/monolith/feed.json" target="_blank" rel="noreferrer">View feed.json</a>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    "use strict";

    const FEED_URL = "/assets/monolith/feed.json";

    const vp = document.getElementById("vp");
    const world = document.getElementById("world");

    const panel = document.getElementById("panel");
    const pclose = document.getElementById("pclose");
    const ptitle = document.getElementById("ptitle");
    const psub = document.getElementById("psub");

    const vTile = document.getElementById("vTile");
    const vCoords = document.getElementById("vCoords");
    const vStatus = document.getElementById("vStatus");
    const vTag = document.getElementById("vTag");
    const vTs = document.getElementById("vTs");
    const vId = document.getElementById("vId");
    const vTitle = document.getElementById("vTitle");
    const vBody = document.getElementById("vBody");

    const kpiTaken = document.getElementById("kpiTaken");
    const kpiTile = document.getElementById("kpiTile");

    const toast = document.getElementById("toast");

    const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;
    const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 118;

    const state = {
      camX: 0,
      camY: 0,
      vx: 0,
      vy: 0,
      dragging: false,
      moved: false,
      lastX: 0,
      lastY: 0,
      lastT: 0,
      downX: 0,
      downY: 0,
      downCamX: 0,
      downCamY: 0,
      lastDragDX: 0,
      lastDragDY: 0,

      cols: 0,
      rows: 0,
      pool: [],
      poolPad: 3,
      poolGX0: 0,
      poolGY0: 0,

      taken: new Set(),
      marksByTile: new Map(),
      marksById: new Map(),

      selectedTile: null,
      selectedGX: 0,
      selectedGY: 0
    };

    function toastMsg(msg, tone){
      toast.className = "toast";
      let cls = "";
      if(tone === "ok") cls = "ok";
      if(tone === "warn") cls = "warn";
      if(tone === "bad") cls = "bad";
      toast.innerHTML = cls ? ("<b class='"+cls+"'>"+tone.toUpperCase()+"</b> " + escapeHtml(msg)) : escapeHtml(msg);
      requestAnimationFrame(()=>toast.classList.add("show"));
      setTimeout(()=>toast.classList.remove("show"), 1700);
    }

    function escapeHtml(s){
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function tileIdFromCoords(gx, gy){
      const sx = gx < 0 ? "W" : "E";
      const sy = gy < 0 ? "N" : "S";
      const ax = Math.abs(gx);
      const ay = Math.abs(gy);
      return sx + ax + "-" + sy + ay;
    }

    function hashStrToInt(s){
      let h = 2166136261;
      for(let i=0;i<s.length;i++){
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0);
    }

    function makeSpraySVG(seedStr){
      const h = hashStrToInt(seedStr);
      const r1 = 18 + (h % 22);
      const r2 = 24 + ((h >>> 5) % 28);
      const r3 = 30 + ((h >>> 9) % 34);
      const x1 = 20 + ((h >>> 13) % 60);
      const y1 = 18 + ((h >>> 17) % 64);
      const x2 = 30 + ((h >>> 21) % 50);
      const y2 = 32 + ((h >>> 25) % 46);

      const g = [
        `<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">`,
        `<defs>`,
        `<radialGradient id="g" cx="50%" cy="40%" r="70%">`,
        `<stop offset="0%" stop-color="rgba(47,191,107,.55)"/>`,
        `<stop offset="60%" stop-color="rgba(47,191,107,.18)"/>`,
        `<stop offset="100%" stop-color="rgba(47,191,107,0)"/>`,
        `</radialGradient>`,
        `</defs>`,
        `<rect width="120" height="120" fill="url(#g)" opacity="0.9"/>`,
        `<g opacity="0.85" fill="rgba(47,191,107,.30)">`,
        `<circle cx="${x1}" cy="${y1}" r="${r1}"/>`,
        `<circle cx="${x2}" cy="${y2}" r="${r2}"/>`,
        `<circle cx="${72}" cy="${66}" r="${r3}" opacity="0.55"/>`,
        `</g>`,
        `<g opacity="0.75" fill="rgba(255,255,255,.12)">`,
        `<circle cx="${20 + ((h>>>2)%80)}" cy="${18 + ((h>>>6)%80)}" r="${6 + ((h>>>10)%10)}"/>`,
        `<circle cx="${18 + ((h>>>14)%86)}" cy="${22 + ((h>>>18)%74)}" r="${5 + ((h>>>22)%9)}"/>`,
        `</g>`,
        `</svg>`
      ];
      return g.join("");
    }

    function openPanel(tile, gx, gy){
      state.selectedTile = tile;
      state.selectedGX = gx;
      state.selectedGY = gy;

      const mark = state.marksByTile.get(tile) || null;
      const taken = state.taken.has(tile);

      kpiTile.textContent = tile;

      vTile.textContent = tile;
      vCoords.textContent = gx + ", " + gy;

      if(taken){
        vStatus.textContent = "Taken";
        vStatus.style.color = "rgba(47,191,107,.95)";
      } else {
        vStatus.textContent = "Open";
        vStatus.style.color = "rgba(169,179,189,.92)";
      }

      if(mark){
        vTag.textContent = mark.tag || "None";
        vTs.textContent = mark.ts || "None";
        vId.textContent = mark.id || "None";
        vTitle.textContent = mark.title || mark.tag || "None";
        vBody.textContent = mark.body || "This tile is taken.";
        ptitle.textContent = "Tile " + tile;
        psub.textContent = (mark.tag ? mark.tag + " " : "") + "Coords " + gx + ", " + gy;
      } else {
        vTag.textContent = "None";
        vTs.textContent = "None";
        vId.textContent = "None";
        vTitle.textContent = "None";
        vBody.textContent = taken ? "This tile exists in feed but has no display fields." : "This tile is open.";
        ptitle.textContent = "Tile " + tile;
        psub.textContent = "Coords " + gx + ", " + gy;
      }

      panel.classList.add("open");
    }

    function closePanel(){
      panel.classList.remove("open");
    }

    function makeCell(){
      const d = document.createElement("div");
      d.className = "tcell";
      d.innerHTML = `
        <div class="spray"></div>
        <div class="meta">
          <div class="id"></div>
          <div class="xy"></div>
        </div>
      `;
      d.addEventListener("click", (ev)=>{
        ev.preventDefault();
        ev.stopPropagation();
        const gx = parseInt(d.getAttribute("data-gx") || "0", 10);
        const gy = parseInt(d.getAttribute("data-gy") || "0", 10);
        const tile = d.getAttribute("data-tile") || tileIdFromCoords(gx, gy);
        openPanel(tile, gx, gy);
      });
      return d;
    }

    function setCell(cell, gx, gy){
      const tile = tileIdFromCoords(gx, gy);
      const taken = state.taken.has(tile);

      cell.style.left = (gx * STEP) + "px";
      cell.style.top  = (gy * STEP) + "px";
      cell.setAttribute("data-gx", String(gx));
      cell.setAttribute("data-gy", String(gy));
      cell.setAttribute("data-tile", tile);
      cell.setAttribute("aria-label", "Tile " + tile + " " + (taken ? "taken" : "open"));

      const id = cell.querySelector(".id");
      const xy = cell.querySelector(".xy");
      const spray = cell.querySelector(".spray");

      if(id) id.textContent = tile;
      if(xy) xy.textContent = gx + "," + gy;

      if(taken){
        cell.classList.add("taken");
        if(spray) spray.innerHTML = makeSpraySVG(tile);
      } else {
        cell.classList.remove("taken");
        if(spray) spray.innerHTML = "";
      }
    }

    function ensurePool(){
      const w = Math.max(320, vp.clientWidth || window.innerWidth || 0);
      const h = Math.max(480, vp.clientHeight || window.innerHeight || 0);
      const cols = Math.ceil(w / STEP) + state.poolPad * 2;
      const rows = Math.ceil(h / STEP) + state.poolPad * 2;

      if(cols === state.cols && rows === state.rows && state.pool.length > 0){
        return;
      }

      state.cols = cols;
      state.rows = rows;

      world.innerHTML = "";
      state.pool = [];

      const total = cols * rows;
      for(let i=0;i<total;i++){
        const c = makeCell();
        state.pool.push(c);
        world.appendChild(c);
      }
    }

    function renderPool(){
      ensurePool();

      world.style.transform = "translate(" + (-state.camX) + "px, " + (-state.camY) + "px)";

      const startGX = Math.floor(state.camX / STEP) - state.poolPad;
      const startGY = Math.floor(state.camY / STEP) - state.poolPad;

      if(startGX === state.poolGX0 && startGY === state.poolGY0){
        return;
      }
      state.poolGX0 = startGX;
      state.poolGY0 = startGY;

      let i = 0;
      for(let ry=0;ry<state.rows;ry++){
        for(let rx=0;rx<state.cols;rx++){
          const gx = startGX + rx;
          const gy = startGY + ry;
          setCell(state.pool[i++], gx, gy);
        }
      }
    }

    function tick(){
      if(!state.dragging){
        state.vx *= 0.92;
        state.vy *= 0.92;
        if(Math.abs(state.vx) < 0.02) state.vx = 0;
        if(Math.abs(state.vy) < 0.02) state.vy = 0;
        state.camX += state.vx;
        state.camY += state.vy;
      }
      renderPool();
      requestAnimationFrame(tick);
    }

    function onDown(ev){
      state.dragging = true;
      state.moved = false;
      vp.classList.add("drag");

      state.lastX = ev.clientX;
      state.lastY = ev.clientY;
      state.downX = ev.clientX;
      state.downY = ev.clientY;
      state.downCamX = state.camX;
      state.downCamY = state.camY;

      state.lastT = performance.now();
      state.vx = 0;
      state.vy = 0;

      try{ vp.setPointerCapture(ev.pointerId); }catch(e){}
    }

    function onMove(ev){
      if(!state.dragging) return;

      const now = performance.now();
      const dt = Math.max(1, now - state.lastT);

      const dx = ev.clientX - state.lastX;
      const dy = ev.clientY - state.lastY;

      const dist = Math.hypot(ev.clientX - state.downX, ev.clientY - state.downY);
      if(dist > 4) state.moved = true;

      state.camX -= dx;
      state.camY -= dy;

      state.vx = (-dx) / dt * 16;
      state.vy = (-dy) / dt * 16;

      state.lastX = ev.clientX;
      state.lastY = ev.clientY;
      state.lastT = now;
    }

    function onUp(ev){
      if(!state.dragging) return;
      state.dragging = false;
      vp.classList.remove("drag");
      try{ vp.releasePointerCapture(ev.pointerId); }catch(e){}
    }

    function onWheel(ev){
      ev.preventDefault();
      state.camX += ev.deltaX;
      state.camY += ev.deltaY;
      state.vx = 0;
      state.vy = 0;
      renderPool();
    }

    async function loadFeed(){
      try{
        const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
        const data = await res.json();

        const taken = new Set();
        const byTile = new Map();
        const byId = new Map();

        if(Array.isArray(data)){
          for(const m of data){
            if(!m) continue;
            const gx = Number.isFinite(+m.gx) ? +m.gx : null;
            const gy = Number.isFinite(+m.gy) ? +m.gy : null;

            let tile = (typeof m.tile === "string" && m.tile) ? m.tile : null;
            if(!tile && gx !== null && gy !== null){
              tile = tileIdFromCoords(gx, gy);
            }
            if(!tile) continue;

            taken.add(tile);

            const obj = {
              id: (typeof m.id === "string" ? m.id : ""),
              tile: tile,
              gx: gx !== null ? gx : 0,
              gy: gy !== null ? gy : 0,
              tag: (typeof m.tag === "string" ? m.tag : ""),
              ts: (typeof m.ts === "string" ? m.ts : ""),
              title: (typeof m.title === "string" ? m.title : ""),
              body: (typeof m.body === "string" ? m.body : "")
            };

            byTile.set(tile, obj);
            if(obj.id) byId.set(obj.id, obj);
          }
        }

        state.taken = taken;
        state.marksByTile = byTile;
        state.marksById = byId;

        kpiTaken.textContent = String(state.taken.size);

        renderPool();

        if(panel.classList.contains("open") && state.selectedTile){
          const tile = state.selectedTile;
          const gx = state.selectedGX;
          const gy = state.selectedGY;
          openPanel(tile, gx, gy);
        }
      } catch(e){
        toastMsg("feed load failed", "warn");
      }
    }

    function startNearSeed(){
      const gx0 = 24;
      const gy0 = -11;
      const w = Math.max(320, vp.clientWidth || window.innerWidth || 0);
      const h = Math.max(480, vp.clientHeight || window.innerHeight || 0);
      state.camX = (gx0 * STEP) - Math.floor(w * 0.5);
      state.camY = (gy0 * STEP) - Math.floor(h * 0.5);
      renderPool();
    }

    pclose.addEventListener("click", closePanel);
    vp.addEventListener("pointerdown", onDown);
    vp.addEventListener("pointermove", onMove);
    vp.addEventListener("pointerup", onUp);
    vp.addEventListener("pointercancel", onUp);
    vp.addEventListener("wheel", onWheel, { passive:false });

    window.addEventListener("keydown", (e)=>{
      if(e.key === "Escape") closePanel();
    });

    window.addEventListener("resize", ()=>{
      state.cols = 0;
      state.rows = 0;
      ensurePool();
      renderPool();
    });

    startNearSeed();
    loadFeed();
    setInterval(loadFeed, 15000);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
