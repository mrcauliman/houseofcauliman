<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>MONOLITH</title>
  <style>
    :root{
      --bg:#07090a;
      --panel:#0f1316;
      --panel2:#12181d;
      --line:#22303a;
      --text:#e9eef2;
      --muted:#a9b6c2;
      --accent:#7cf7c2;
      --danger:#ff6b6b;
      --tile:#10161b;
      --tile2:#0b0f12;
      --taken:#1e2b22;
      --takenBorder:#2f6b4b;
      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --radius: 14px;
      --radius2: 10px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    html,body{height:100%; margin:0; background:var(--bg); color:var(--text); font-family:var(--font);}
    *{box-sizing:border-box}

    .app{
      position:fixed;
      inset:0;
      overflow:hidden;
    }

    .topbar{
      position:absolute;
      top:14px;
      left:14px;
      right:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      z-index:5;
      pointer-events:none;
    }

    .brand{
      pointer-events:auto;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      background:rgba(15,19,22,.78);
      border:1px solid rgba(34,48,58,.7);
      border-radius:999px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 18px rgba(124,247,194,.55);
    }
    .brand .title{font-weight:800; letter-spacing:.6px;}
    .brand .sub{color:var(--muted); font-size:12px; margin-left:6px}

    .searchbox{
      pointer-events:auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 10px;
      background:rgba(15,19,22,.78);
      border:1px solid rgba(34,48,58,.7);
      border-radius:999px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      min-width: 290px;
      max-width: 460px;
      width: 46vw;
    }
    .searchbox input{
      width:100%;
      background:transparent;
      border:0;
      outline:none;
      color:var(--text);
      font-size:14px;
    }
    .btn{
      border:1px solid rgba(34,48,58,.9);
      background:rgba(18,24,29,.9);
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    .btn:active{transform:translateY(1px)}
    .btn.accent{
      border-color: rgba(124,247,194,.35);
      box-shadow: 0 0 0 2px rgba(124,247,194,.12) inset;
    }

    .canvas{
      position:absolute;
      inset:0;
      cursor: grab;
      touch-action:none;
      background:
        radial-gradient(circle at 20% 20%, rgba(124,247,194,.06), transparent 35%),
        radial-gradient(circle at 80% 40%, rgba(124,247,194,.04), transparent 42%),
        radial-gradient(circle at 50% 85%, rgba(124,247,194,.03), transparent 40%),
        var(--bg);
    }
    .canvas.dragging{cursor:grabbing}

    .grid{
      position:absolute;
      left:50%;
      top:50%;
      transform: translate3d(0,0,0);
      will-change: transform;
    }

    .tile{
      position:absolute;
      width:84px;
      height:84px;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(16,22,27,.95), rgba(11,15,18,.95));
      border:1px solid rgba(34,48,58,.55);
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      padding:8px;
      gap:6px;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      user-select:none;
      cursor:pointer;
    }
    .tile:hover{
      border-color: rgba(124,247,194,.30);
      box-shadow: 0 0 0 2px rgba(124,247,194,.10) inset, 0 6px 18px rgba(0,0,0,.42);
    }
    .tile .id{
      font-size:12px;
      font-weight:800;
      letter-spacing:.4px;
      color: rgba(233,238,242,.95);
      text-shadow: 0 1px 0 rgba(0,0,0,.5);
    }
    .tile .tag{
      font-size:10px;
      font-weight:800;
      letter-spacing:.6px;
      color: rgba(169,182,194,.95);
      text-transform:uppercase;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .tile.taken{
      background: linear-gradient(180deg, rgba(30,43,34,.96), rgba(16,24,20,.96));
      border-color: rgba(47,107,75,.75);
    }
    .tile.taken .tag{color: rgba(124,247,194,.95)}
    .tile.taken:hover{
      border-color: rgba(124,247,194,.55);
      box-shadow: 0 0 0 2px rgba(124,247,194,.14) inset, 0 6px 18px rgba(0,0,0,.42);
    }

    .panel{
      position:absolute;
      right:14px;
      top:72px;
      width:min(420px, calc(100vw - 28px));
      max-height: calc(100vh - 92px);
      background: rgba(15,19,22,.92);
      border:1px solid rgba(34,48,58,.75);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      z-index:6;
      display:none;
      overflow:hidden;
    }
    .panel.open{display:flex; flex-direction:column}
    .panel header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      border-bottom:1px solid rgba(34,48,58,.6);
      background: rgba(18,24,29,.85);
    }
    .panel header .h{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .panel header .h .t{
      font-weight:900;
      letter-spacing:.6px;
    }
    .panel header .h .s{
      color:var(--muted);
      font-size:12px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .panel header .x{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(34,48,58,.85);
      background: rgba(15,19,22,.65);
      cursor:pointer;
      font-weight:900;
      user-select:none;
    }

    .panel .body{
      padding:12px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .kv{
      display:grid;
      grid-template-columns: 110px 1fr;
      gap:8px 10px;
      padding:10px;
      border:1px solid rgba(34,48,58,.6);
      border-radius: 12px;
      background: rgba(18,24,29,.62);
    }
    .k{color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase}
    .v{font-weight:700; overflow-wrap:anywhere}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border:1px solid rgba(34,48,58,.6);
      border-radius:999px;
      background: rgba(18,24,29,.62);
      font-weight:800;
      letter-spacing:.3px;
      width:fit-content;
    }
    .pill.good{border-color: rgba(47,107,75,.75); box-shadow: 0 0 0 2px rgba(124,247,194,.10) inset}

    .hint{
      position:absolute;
      left:14px;
      bottom:14px;
      z-index:5;
      padding:10px 12px;
      border-radius: 999px;
      background: rgba(15,19,22,.72);
      border:1px solid rgba(34,48,58,.7);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      color: var(--muted);
      font-size: 12px;
      pointer-events:none;
      max-width: calc(100vw - 28px);
    }

    @media (max-width: 720px){
      .searchbox{width: 56vw; min-width: 210px}
      .tile{width:76px; height:76px}
      .tile .id{font-size:11px}
    }
  </style>
</head>
<body>
  <div id="jsBanner" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(15,19,22,.92);border:1px solid rgba(34,48,58,.75);color:#e9eef2;padding:10px 12px;border-radius:999px;font:700 12px/1.2 system-ui;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.45)">
    Loading wall
  </div>
  <noscript>
    <div style="position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.55);color:#e9eef2;padding:10px 12px;border-radius:14px;font:700 12px/1.2 system-ui">
      JavaScript is disabled or blocked. The wall can’t render.
    </div>
  </noscript>

  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <div class="title">MONOLITH <span class="sub">The Wall</span></div>
      </div>

      <div class="searchbox" aria-label="search">
        <input id="searchInput" type="text" inputmode="text" autocomplete="off" spellcheck="false"
               placeholder="Search tile E23-N11 or coords 23,-11" />
        <button id="goBtn" class="btn accent" type="button">Go</button>
      </div>
    </div>

    <div id="canvas" class="canvas" role="application" aria-label="wall">
      <div id="grid" class="grid"></div>
    </div>

    <div id="panel" class="panel" aria-label="details">
      <header>
        <div class="h">
          <div id="panelTitle" class="t">Tile</div>
          <div id="panelSub" class="s">Coords</div>
        </div>
        <div id="closePanel" class="x">X</div>
      </header>
      <div class="body">
        <div id="panelStatus" class="pill">Status</div>
        <div class="kv">
          <div class="k">Tile</div><div id="kvTile" class="v"></div>
          <div class="k">GX</div><div id="kvGX" class="v"></div>
          <div class="k">GY</div><div id="kvGY" class="v"></div>
          <div class="k">Tag</div><div id="kvTag" class="v"></div>
          <div class="k">Mark ID</div><div id="kvMarkId" class="v"></div>
          <div class="k">Timestamp</div><div id="kvTS" class="v"></div>
        </div>
      </div>
    </div>

    <div class="hint">Drag to pan. Click a tile for details. Search jumps only.</div>
  </div>

  <script>
    "use strict";

    document.getElementById("jsBanner").textContent = "JS running";
    setTimeout(() => {
      const b = document.getElementById("jsBanner");
      if(b) b.style.display = "none";
    }, 1200);

    const FEED_URL = "/assets/monolith/feed.json";

    const TILE = { size: 84, gap: 10 };
    const VIEW = { halfRange: 18 };

    const canvas = document.getElementById("canvas");
    const grid = document.getElementById("grid");

    const panel = document.getElementById("panel");
    const closePanel = document.getElementById("closePanel");

    const panelTitle = document.getElementById("panelTitle");
    const panelSub = document.getElementById("panelSub");
    const panelStatus = document.getElementById("panelStatus");

    const kvTile = document.getElementById("kvTile");
    const kvGX = document.getElementById("kvGX");
    const kvGY = document.getElementById("kvGY");
    const kvTag = document.getElementById("kvTag");
    const kvMarkId = document.getElementById("kvMarkId");
    const kvTS = document.getElementById("kvTS");

    const searchInput = document.getElementById("searchInput");
    const goBtn = document.getElementById("goBtn");

    const stride = TILE.size + TILE.gap;

    let camX = 0;
    let camY = 0;

    let activePointerId = null;
    let panArmed = false;
    let panning = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let camStartX = 0;
    let camStartY = 0;

    const DRAG_THRESHOLD = 4;

    let tiles = [];
    let marksByTile = new Map();

    function sanitizeInput(s){
      return String(s || "")
        .trim()
        .toUpperCase()
        .replace(/[–—−]/g, "-")
        .replace(/\s+/g, "");
    }

    function tileIdFromCoords(gx, gy){
      const eastWest = gx >= 0 ? "E" + gx : "W" + Math.abs(gx);
      const northSouth = gy >= 0 ? "N" + gy : "S" + Math.abs(gy);
      return eastWest + "-" + northSouth;
    }

    function parseTileId(input){
      const s = sanitizeInput(input);
      const m = /^([EW])(\d+)-([NS])(\d+)$/.exec(s);
      if(!m) return null;
      const gx = (m[1] === "E") ? Number(m[2]) : -Number(m[2]);
      const gy = (m[3] === "N") ? Number(m[4]) : -Number(m[4]);
      return { gx, gy, tile: tileIdFromCoords(gx, gy) };
    }

    function parseCoords(input){
      const s = String(input || "").trim().replace(/[–—−]/g, "-");
      const m = /^(-?\d+)\s*,\s*(-?\d+)$/.exec(s);
      if(!m) return null;
      const gx = Number(m[1]);
      const gy = Number(m[2]);
      if(!Number.isFinite(gx) || !Number.isFinite(gy)) return null;
      return { gx, gy, tile: tileIdFromCoords(gx, gy) };
    }

    function normalizeSearch(input){
      return parseTileId(input) || parseCoords(input);
    }

    function setCamera(x, y){
      camX = x;
      camY = y;
      render();
    }

    function jumpToTile(gx, gy){
      setCamera(-gx * stride, -gy * stride);
    }

    function openPanelFor(gx, gy){
      const tile = tileIdFromCoords(gx, gy);
      const mark = marksByTile.get(tile) || null;

      panelTitle.textContent = tile;
      panelSub.textContent = "GX " + gx + "  GY " + gy;

      kvTile.textContent = tile;
      kvGX.textContent = String(gx);
      kvGY.textContent = String(gy);

      if(mark){
        panelStatus.textContent = "Taken";
        panelStatus.className = "pill good";
        kvTag.textContent = mark.tag || "";
        kvMarkId.textContent = mark.id || "";
        kvTS.textContent = mark.ts || "";
      }else{
        panelStatus.textContent = "Open";
        panelStatus.className = "pill";
        kvTag.textContent = "";
        kvMarkId.textContent = "";
        kvTS.textContent = "";
      }

      panel.classList.add("open");
    }

    function closePanelNow(){
      panel.classList.remove("open");
    }

    closePanel.addEventListener("click", closePanelNow);

    function createTileEl(){
      const el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = '<div class="tag"></div><div class="id"></div>';
      const tagEl = el.querySelector(".tag");
      const idEl = el.querySelector(".id");

      el.addEventListener("click", () => {
        const gx = Number(el.dataset.gx);
        const gy = Number(el.dataset.gy);
        openPanelFor(gx, gy);
      });

      return { el, tagEl, idEl };
    }

    function ensurePool(count){
      while(tiles.length < count){
        const t = createTileEl();
        grid.appendChild(t.el);
        tiles.push(t);
      }
    }

    function render(){
      grid.style.transform = `translate3d(${camX}px, ${camY}px, 0)`;

      const rect = canvas.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;

      const centerGX = Math.round((-camX) / stride);
      const centerGY = Math.round((-camY) / stride);

      const minGX = centerGX - VIEW.halfRange;
      const maxGX = centerGX + VIEW.halfRange;
      const minGY = centerGY - VIEW.halfRange;
      const maxGY = centerGY + VIEW.halfRange;

      const needed = (maxGX - minGX + 1) * (maxGY - minGY + 1);
      ensurePool(needed);

      let i = 0;
      for(let gy = minGY; gy <= maxGY; gy++){
        for(let gx = minGX; gx <= maxGX; gx++){
          const t = tiles[i++];
          const tile = tileIdFromCoords(gx, gy);
          const mark = marksByTile.get(tile) || null;

          const x = gx * stride;
          const y = gy * stride;

          t.el.style.transform = `translate3d(${x + cx}px, ${y + cy}px, 0)`;
          t.el.dataset.gx = String(gx);
          t.el.dataset.gy = String(gy);
          t.idEl.textContent = tile;

          if(mark){
            t.el.classList.add("taken");
            t.tagEl.textContent = (mark.tag || "TAKEN").toUpperCase();
          }else{
            t.el.classList.remove("taken");
            t.tagEl.textContent = "OPEN";
          }
        }
      }

      for(; i < tiles.length; i++){
        tiles[i].el.style.transform = "translate3d(-99999px,-99999px,0)";
      }
    }

    async function loadFeed(){
      try{
        const res = await fetch(FEED_URL, { cache: "no-store" });
        if(!res.ok) throw new Error("feed http " + res.status);
        const data = await res.json();
        if(!Array.isArray(data)) throw new Error("feed not array");

        marksByTile.clear();
        for(const m of data){
          if(!m) continue;
          const gx = Number(m.gx);
          const gy = Number(m.gy);
          const tileRaw = sanitizeInput(m.tile || "");
          if(!tileRaw) continue;

          const canonTile = (Number.isFinite(gx) && Number.isFinite(gy)) ? tileIdFromCoords(gx, gy) : tileRaw;
          marksByTile.set(canonTile, {
            id: m.id || "",
            tile: canonTile,
            gx: Number.isFinite(gx) ? gx : null,
            gy: Number.isFinite(gy) ? gy : null,
            tag: m.tag || "",
            ts: m.ts || ""
          });
        }

        render();
      }catch(err){
        console.error(err);
        render();
      }
    }

    function onGo(){
      const raw = String(searchInput.value || "").replace(/[–—−]/g, "-");
      const q = normalizeSearch(raw);
      if(!q) return;

      searchInput.value = q.tile;
      closePanelNow();
      jumpToTile(q.gx, q.gy);
    }

    goBtn.addEventListener("click", onGo);
    searchInput.addEventListener("keydown", (e) => {
      if(e.key === "Enter") onGo();
    });

    function armPan(e){
      if(e.button !== undefined && e.button !== 0) return;

      const onTile = e.target && e.target.closest && e.target.closest(".tile");
      if(onTile) return;

      activePointerId = e.pointerId;
      panArmed = true;
      panning = false;

      dragStartX = e.clientX;
      dragStartY = e.clientY;
      camStartX = camX;
      camStartY = camY;
    }

    function movePan(e){
      if(!panArmed || activePointerId !== e.pointerId) return;

      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;

      if(!panning){
        if(Math.abs(dx) + Math.abs(dy) < DRAG_THRESHOLD) return;
        panning = true;
        canvas.classList.add("dragging");
      }

      camX = camStartX + dx;
      camY = camStartY + dy;
      render();
    }

    function endPan(e){
      if(activePointerId !== e.pointerId) return;
      activePointerId = null;
      panArmed = false;
      panning = false;
      canvas.classList.remove("dragging");
    }

    canvas.addEventListener("pointerdown", armPan);
    canvas.addEventListener("pointermove", movePan);
    canvas.addEventListener("pointerup", endPan);
    canvas.addEventListener("pointercancel", endPan);

    render();
    loadFeed();
  </script>
</body>
</html>
