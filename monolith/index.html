<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />

  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#173524;
      --green:#2fbf6b;
      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
        var(--bg);
      color:var(--fg);
      overflow:hidden;
    }

    .topbar{
      position:fixed;left:14px;right:14px;top:14px;z-index:40;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(23,53,36,.9);
      border-radius:18px;
      background:rgba(7,9,11,.62);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:34px;height:34px;object-fit:contain}
    .brand .t{font-weight:1000;letter-spacing:.6px;font-size:13px;text-transform:uppercase;line-height:1.1}
    .brand .s{margin-top:3px;color:rgba(245,247,244,.72);font-size:12px;line-height:1.2}
    .sp{flex:1}
    .btn{
      border:1px solid rgba(23,53,36,.95);
      background:linear-gradient(180deg, rgba(13,34,23,.85), rgba(11,27,19,.85));
      color:var(--fg);
      padding:9px 12px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:.3px;
      cursor:pointer;
      user-select:none;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      white-space:nowrap;
    }
    .btn.primary{
      border-color:rgba(47,191,107,.8);
      box-shadow:0 10px 26px rgba(47,191,107,.12);
    }
    .btn:active{transform:translateY(1px)}
    .hint{
      color:rgba(245,247,244,.70);
      font-size:12px;
      font-weight:700;
      letter-spacing:.2px;
    }

    .viewport{
      position:fixed;inset:0;
      touch-action:none;
      overflow:hidden;
      cursor:grab;
    }
    .viewport:active{cursor:grabbing}
    .world{
      position:absolute;left:0;top:0;
      width:0;height:0;
    }

    .cell{
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:16px;
      border:1px solid rgba(23,53,36,.85);
      background:
        radial-gradient(140px 90px at 30% 25%, rgba(47,191,107,.08), transparent 55%),
        rgba(11,27,19,.55);
      box-shadow: 0 18px 34px rgba(0,0,0,.22);
      overflow:hidden;
      user-select:none;
    }
    .cell:hover{border-color:rgba(47,191,107,.55)}
    .cell .spray{position:absolute;inset:0;opacity:.95}
    .cell .id{
      position:absolute;left:8px;bottom:7px;right:8px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.3px;
      color:rgba(245,247,244,.80);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-transform:uppercase;
    }
    .cell.taken{
      border-color:rgba(47,191,107,.45);
      box-shadow:0 0 0 2px rgba(47,191,107,.14) inset, 0 18px 34px rgba(0,0,0,.22);
    }
    .cell .tag{
      position:absolute;left:8px;top:8px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.4px;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(47,191,107,.16);
      border:1px solid rgba(47,191,107,.35);
      color:rgba(245,247,244,.88);
      text-transform:uppercase;
      display:none;
      pointer-events:none;
    }
    .cell.taken .tag{display:inline-flex}

    .panel{
      position:fixed;right:14px;top:74px;z-index:50;
      width:min(420px, calc(100vw - 28px));
      border:1px solid rgba(23,53,36,.92);
      border-radius:18px;
      background:rgba(7,9,11,.70);
      box-shadow:0 22px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(12px);
      transform: translateY(10px);
      opacity:0;
      pointer-events:none;
      transition: opacity .12s ease, transform .12s ease;
    }
    .panel.open{
      opacity:1;
      transform: translateY(0);
      pointer-events:auto;
    }
    .panel .head{
      display:flex;align-items:center;gap:10px;
      padding:12px 12px;
      border-bottom:1px solid rgba(23,53,36,.7);
      background:linear-gradient(180deg, rgba(13,34,23,.72), rgba(7,9,11,.62));
      border-top-left-radius:18px;border-top-right-radius:18px;
    }
    .panel .head .t{
      font-weight:1000;letter-spacing:.5px;text-transform:uppercase;font-size:13px;
    }
    .panel .head .x{
      margin-left:auto;
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.65);
      cursor:pointer;
      font-weight:1000;
      user-select:none;
    }
    .panel .body{padding:12px 12px 14px}
    .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 10px}
    .k{color:rgba(245,247,244,.62);font-size:12px;font-weight:900;letter-spacing:.2px;text-transform:uppercase}
    .v{color:rgba(245,247,244,.90);font-size:13px;font-weight:800}
    .small{margin-top:10px;color:rgba(245,247,244,.70);font-size:12px;line-height:1.35}

    .toast{
      position:fixed;left:14px;bottom:14px;z-index:60;
      padding:10px 12px;border-radius:14px;
      border:1px solid rgba(23,53,36,.9);
      background:rgba(7,9,11,.68);
      box-shadow:0 18px 44px rgba(0,0,0,.4);
      backdrop-filter: blur(10px);
      max-width:min(520px, calc(100vw - 28px));
      opacity:0;
      transform:translateY(8px);
      transition: opacity .14s ease, transform .14s ease;
      pointer-events:none;
    }
    .toast.show{opacity:1;transform:translateY(0)}
    .toast .t{font-weight:1000;letter-spacing:.4px;font-size:12px;text-transform:uppercase}
    .toast .b{margin-top:4px;color:rgba(245,247,244,.74);font-size:12px;line-height:1.35}
  </style>
</head>

<body>
  <header class="topbar" aria-label="monolith top bar">
    <div class="brand">
      <img src="/assets/monolith/monolith_logo.webp" alt="monolith logo" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">The Wall of Record</div>
      </div>
    </div>
    <div class="sp"></div>
    <div class="hint">Drag to move. Tap a tile to inspect.</div>
    <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile">Claim a Tile</a>
  </header>

  <div class="viewport" id="vp" aria-label="monolith wall viewport">
    <div class="world" id="world" aria-label="monolith wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="head">
      <div class="t" id="ptitle">Tile</div>
      <div class="x" id="pclose" aria-label="close">X</div>
    </div>
    <div class="body">
      <div class="kv">
        <div class="k">Tile</div><div class="v" id="vTile">None</div>
        <div class="k">Coords</div><div class="v" id="vCoords">0, 0</div>
        <div class="k">Tag</div><div class="v" id="vTag">Open</div>
        <div class="k">Date</div><div class="v" id="vTs">None</div>
      </div>
      <div class="small" id="vBody">Tap a tile to inspect details.</div>
    </div>
  </aside>

  <div class="toast" id="toast" aria-label="status toast">
    <div class="t" id="toastT">Status</div>
    <div class="b" id="toastB"></div>
  </div>

  <script>
  "use strict";

  const FEED_URL = "/assets/monolith/feed.json";

  const vp = document.getElementById("vp");
  const world = document.getElementById("world");
  const panel = document.getElementById("panel");
  const pclose = document.getElementById("pclose");
  const ptitle = document.getElementById("ptitle");
  const vTile = document.getElementById("vTile");
  const vCoords = document.getElementById("vCoords");
  const vTag = document.getElementById("vTag");
  const vTs = document.getElementById("vTs");
  const vBody = document.getElementById("vBody");
  const toast = document.getElementById("toast");
  const toastT = document.getElementById("toastT");
  const toastB = document.getElementById("toastB");

  const STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--step").trim(), 10) || 128;
  const TILE = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tile").trim(), 10) || 118;

  const state = {
    camX: 0,
    camY: 0,
    isDown: false,
    downX: 0,
    downY: 0,
    camX0: 0,
    camY0: 0,
    moved: false,

    cols: 0,
    rows: 0,
    pool: [],
    poolKey: "",
    marksByTile: new Map(),
    taken: new Set(),
    firstMark: null
  };

  function toastShow(t, b){
    toastT.textContent = t;
    toastB.textContent = b || "";
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1600);
  }

  function tileIdFromCoords(gx, gy){
    const ax = Math.abs(gx);
    const ay = Math.abs(gy);
    const sx = gx < 0 ? "W" : "E";
    const sy = gy < 0 ? "N" : "S";
    return sx + ax + "-" + sy + ay;
  }

  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashStr(s){
    let h = 2166136261 >>> 0;
    for(let i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeSpraySVG(seedStr){
    const rnd = mulberry32(hashStr(seedStr));
    const p = [];
    const n = 18 + Math.floor(rnd()*18);
    for(let i=0;i<n;i++){
      const r = 3 + rnd()*12;
      const x = rnd()*(TILE-r*2) + r;
      const y = rnd()*(TILE-r*2) + r;
      const a = 0.08 + rnd()*0.10;
      p.push(`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r.toFixed(2)}" fill="rgba(47,191,107,${a.toFixed(3)})"/>`);
    }
    return `<svg viewBox="0 0 ${TILE} ${TILE}" width="${TILE}" height="${TILE}" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
  }

  function closePanel(){
    panel.classList.remove("open");
  }

  function openPanelFor(tile, gx, gy){
    const mark = state.marksByTile.get(tile) || null;
    ptitle.textContent = "Tile";
    vTile.textContent = tile;
    vCoords.textContent = `${gx}, ${gy}`;
    vTag.textContent = mark ? (mark.tag || "Taken") : (state.taken.has(tile) ? "Taken" : "Open");
    vTs.textContent = mark ? (mark.ts || "None") : "None";
    vBody.textContent = mark ? "" : "This tile is open.";
    panel.classList.add("open");
  }

  function ensurePool(){
    const w = vp.clientWidth;
    const h = vp.clientHeight;
    const cols = Math.ceil(w / STEP) + 6;
    const rows = Math.ceil(h / STEP) + 6;

    if(cols === state.cols && rows === state.rows && state.pool.length) return;

    state.cols = cols;
    state.rows = rows;
    state.pool = [];
    world.innerHTML = "";

    const total = cols * rows;
    for(let i=0;i<total;i++){
      const d = document.createElement("div");
      d.className = "cell";
      d.innerHTML = `<div class="spray"></div><div class="tag"></div><div class="id"></div>`;
      world.appendChild(d);
      state.pool.push(d);
    }
  }

  function setCell(cell, gx, gy){
    const tile = tileIdFromCoords(gx, gy);
    const taken = state.taken.has(tile);
    const mark = state.marksByTile.get(tile) || null;

    cell.style.left = (gx * STEP) + "px";
    cell.style.top  = (gy * STEP) + "px";
    cell.setAttribute("data-gx", String(gx));
    cell.setAttribute("data-gy", String(gy));
    cell.setAttribute("data-tile", tile);

    if(taken) cell.classList.add("taken");
    else cell.classList.remove("taken");

    const spray = cell.querySelector(".spray");
    if(spray) spray.innerHTML = makeSpraySVG(tile);

    const id = cell.querySelector(".id");
    if(id) id.textContent = tile;

    const tag = cell.querySelector(".tag");
    if(tag){
      tag.textContent = mark ? (mark.tag || "TAKEN") : (taken ? "TAKEN" : "");
      tag.style.display = taken ? "inline-flex" : "none";
    }
  }

  function renderPool(){
    ensurePool();

    const startGX = Math.floor(state.camX / STEP) - 3;
    const startGY = Math.floor(state.camY / STEP) - 3;
    const key = `${startGX},${startGY},${state.cols},${state.rows},${state.taken.size}`;

    if(key === state.poolKey) return;
    state.poolKey = key;

    let i = 0;
    for(let ry=0;ry<state.rows;ry++){
      for(let rx=0;rx<state.cols;rx++){
        const gx = startGX + rx;
        const gy = startGY + ry;
        setCell(state.pool[i++], gx, gy);
      }
    }
  }

  function tick(){
    world.style.transform = `translate(${(-state.camX)}px, ${(-state.camY)}px)`;
    renderPool();
    requestAnimationFrame(tick);
  }

  function pickTileFromPoint(clientX, clientY){
    const rect = vp.getBoundingClientRect();
    const x = clientX - rect.left + state.camX;
    const y = clientY - rect.top  + state.camY;
    const gx = Math.floor(x / STEP);
    const gy = Math.floor(y / STEP);
    return { gx, gy, tile: tileIdFromCoords(gx, gy) };
  }

  function onDown(e){
    e.preventDefault();
    state.isDown = true;
    state.moved = false;
    state.downX = e.clientX;
    state.downY = e.clientY;
    state.camX0 = state.camX;
    state.camY0 = state.camY;
    vp.setPointerCapture(e.pointerId);
  }

  function onMove(e){
    if(!state.isDown) return;
    e.preventDefault();
    const dx = e.clientX - state.downX;
    const dy = e.clientY - state.downY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) state.moved = true;
    state.camX = state.camX0 - dx;
    state.camY = state.camY0 - dy;
  }

  function onUp(e){
    if(!state.isDown) return;
    e.preventDefault();
    state.isDown = false;
    try{ vp.releasePointerCapture(e.pointerId); }catch(_){}

    if(state.moved) return;

    const p = pickTileFromPoint(e.clientX, e.clientY);
    openPanelFor(p.tile, p.gx, p.gy);
  }

  async function loadFeed(){
    try{
      const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
      if(!res.ok) throw new Error("bad");
      const data = await res.json();

      state.marksByTile = new Map();
      state.taken = new Set();
      state.firstMark = null;

      if(Array.isArray(data)){
        for(const m of data){
          const gx = Number.isFinite(+m.gx) ? +m.gx : null;
          const gy = Number.isFinite(+m.gy) ? +m.gy : null;
          let tile = (typeof m.tile === "string" && m.tile) ? String(m.tile).trim().toUpperCase() : null;
          if(!tile && gx !== null && gy !== null) tile = tileIdFromCoords(gx, gy);
          if(!tile) continue;

          state.taken.add(tile);
          const mark = {
            tile,
            gx: gx !== null ? gx : 0,
            gy: gy !== null ? gy : 0,
            tag: (typeof m.tag === "string" ? m.tag : "TAKEN"),
            ts: (typeof m.ts === "string" ? m.ts : "")
          };
          state.marksByTile.set(tile, mark);
          if(!state.firstMark) state.firstMark = mark;
        }
      }

      toastShow("Feed", state.firstMark ? "Marks loaded" : "No marks yet");
    }catch(_){
      toastShow("Feed", "Load failed");
    }
  }

  function startNearSeed(){
    const w = vp.clientWidth;
    const h = vp.clientHeight;

    if(state.firstMark){
      const gx = state.firstMark.gx;
      const gy = state.firstMark.gy;
      state.camX = gx * STEP - Math.floor(w/2) + Math.floor(TILE/2);
      state.camY = gy * STEP - Math.floor(h/2) + Math.floor(TILE/2);
      return;
    }

    state.camX = 0;
    state.camY = 0;
  }

  pclose.addEventListener("click", closePanel);

  vp.addEventListener("pointerdown", onDown, { passive:false });
  vp.addEventListener("pointermove", onMove, { passive:false });
  vp.addEventListener("pointerup", onUp, { passive:false });
  vp.addEventListener("pointercancel", onUp, { passive:false });

  requestAnimationFrame(tick);

  loadFeed().then(() => {
    startNearSeed();
    closePanel();            /* hard guarantee: no open panel on load */
    setInterval(loadFeed, 15000);
  });
  </script>
</body>
</html>
