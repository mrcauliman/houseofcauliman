<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — The Wall of Record</title>
  <meta name="description" content="MONOLITH is a permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:title" content="MONOLITH — The Wall of Record" />
  <meta property="og:description" content="A permanent on-chain wall. One tile. One mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/monolith/assets/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --panel2:#0d2217;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#173524;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;

      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
        var(--bg);
      color:var(--fg);
      overflow:hidden;
    }
    a{color:inherit;text-decoration:none}

    .top{
      position:fixed;left:12px;right:12px;top:12px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(23,53,36,.9);
      border-radius:18px;
      background:rgba(7,9,11,.62);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      z-index:20;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:34px;height:34px;object-fit:contain}
    .brand .t{font-weight:1000;letter-spacing:.6px;font-size:13px;text-transform:uppercase;line-height:1.1}
    .brand .s{margin-top:3px;color:rgba(245,247,244,.72);font-size:12px;line-height:1.2}
    .sp{flex:1}

    .btn{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.85);
      color:var(--fg);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      letter-spacing:.3px;
      cursor:pointer;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{border-color:rgba(47,191,107,.55)}
    .btn.primary{
      background:linear-gradient(180deg, rgba(47,191,107,.22), rgba(11,27,19,.88));
      border-color:rgba(47,191,107,.65);
    }

    .kpi{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
      color:rgba(245,247,244,.84);
      font-size:12px;
    }
    .pill{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.72);
      padding:8px 10px;
      border-radius:999px;
      font-weight:900;
      letter-spacing:.2px;
      display:inline-flex;align-items:center;gap:8px;
    }
    .dot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 0 3px rgba(47,191,107,.18)}

    .search{
      display:flex;align-items:center;gap:8px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.72);
      border-radius:14px;
      padding:8px 10px;
    }
    .search input{
      width:240px;
      max-width:42vw;
      border:0;
      outline:0;
      background:transparent;
      color:var(--fg);
      font-weight:900;
      letter-spacing:.2px;
      font-size:12px;
    }
    .search input::placeholder{color:rgba(174,183,175,.70)}
    .search .btn{
      padding:8px 10px;
      border-radius:12px;
    }

    #vp{
      position:absolute;inset:0;
      touch-action:none;
      cursor:grab;
    }
    #vp.dragging{cursor:grabbing}
    #world{
      position:absolute;left:0;top:0;
      width:1px;height:1px;
      transform:translate3d(0,0,0);
      will-change:transform;
      transform-origin: 0 0;
    }

    .cell{
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
  user-drag: none;
  touch-action: none;
      position:absolute;
      width:var(--tile);
      height:var(--tile);
      border-radius:16px;
      border:1px solid rgba(23,53,36,.75);
      background:
        radial-gradient(120px 90px at 30% 25%, rgba(47,191,107,.14), transparent 55%),
        rgba(11,27,19,.45);
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
      overflow:hidden;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

.cell img{
  -webkit-user-drag: none;
  user-drag: none;
}
    .cell:hover{border-color:rgba(47,191,107,.45)}
    .cell .spray{position:absolute;inset:0;opacity:.95}

    .cell .mediaWrap{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      padding:10px;
    }
    .cell .mediaWrap img{
      width:88%;
      height:88%;
      object-fit:contain;
      opacity:.95;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    .cell .id{
      position:absolute;left:10px;bottom:8px;right:10px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.35px;
      color:rgba(245,247,244,.72);
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      z-index:3;
    }
    .cell .tag{
      position:absolute;left:10px;top:8px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.5px;
      color:rgba(255,225,117,.85);
      text-transform:uppercase;
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      max-width:calc(100% - 20px);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      z-index:3;
    }
    .cell.taken{border-color:rgba(47,191,107,.85)}
    .cell.taken .tag{color:rgba(47,191,107,.92)}

    .panel{
      position:fixed;
      right:12px;
      top:70px;
      bottom:12px;
      width:min(420px, calc(100vw - 24px));
      border-radius:18px;
      border:1px solid rgba(23,53,36,.95);
      background:linear-gradient(180deg, rgba(13,34,23,.86), rgba(11,27,19,.92));
      box-shadow:0 18px 44px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      z-index:30;
      transform:translate3d(110%,0,0);
      transition:transform .18s ease;
      display:flex;flex-direction:column;
    }
    .panel.open{transform:translate3d(0,0,0)}
    .ph{
      display:flex;align-items:center;gap:10px;
      padding:12px;
      border-bottom:1px solid rgba(23,53,36,.9);
    }
    .ph .ttl{font-weight:1000;letter-spacing:.4px}
    .ph .sub{margin-top:3px;color:rgba(245,247,244,.70);font-size:12px}
    .ph .sp{flex:1}
    .xbtn{
      width:40px;height:40px;border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.4);
      color:rgba(245,247,244,.9);
      font-weight:1000;
      cursor:pointer;
    }
    .pb{padding:12px;overflow:auto}

    .kv{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:10px 12px;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.75);
      background:rgba(7,9,11,.22);
    }
    .kv .k{color:rgba(174,183,175,.85);font-size:12px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
    .kv .v{font-size:13px;font-weight:1000;letter-spacing:.2px;word-break:break-word;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .muted{color:rgba(174,183,175,.86);font-size:12px;line-height:1.45;margin-top:10px;white-space:pre-wrap}

    .copy{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.35);
      color:rgba(245,247,244,.92);
      border-radius:999px;
      padding:6px 10px;
      font-weight:1000;
      letter-spacing:.2px;
      font-size:11px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .copy:hover{border-color:rgba(47,191,107,.55)}

    .linka{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.26);
      color:rgba(245,247,244,.94);
      border-radius:999px;
      padding:6px 10px;
      font-weight:1000;
      letter-spacing:.2px;
      font-size:11px;
      display:inline-flex;align-items:center;gap:8px;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .linka:hover{border-color:rgba(47,191,107,.55)}

    .badge{
      border:1px solid rgba(47,191,107,.55);
      background:rgba(47,191,107,.12);
      color:rgba(245,247,244,.92);
      border-radius:999px;
      padding:5px 9px;
      font-weight:1000;
      letter-spacing:.2px;
      font-size:11px;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:14px;
      transform:translate3d(-50%, 90px, 0);
      opacity:0;
      transition:transform .18s ease, opacity .18s ease;
      z-index:40;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.72);
      backdrop-filter: blur(10px);
      font-weight:1000;
      letter-spacing:.2px;
      font-size:12px;
      max-width:90vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.show{transform:translate3d(-50%, 0, 0);opacity:1}
    .toast.good{border-color:rgba(47,191,107,.75)}
    .toast.warn{border-color:rgba(255,225,117,.75)}
    .toast.bad{border-color:rgba(255,91,91,.75)}
  
    /* panel tile image */

.vMedia{display:flex;justify-content:center;align-items:center;padding:10px 0;}
#vMedia img{width:100%;max-width:260px;height:auto;display:block;border-radius:10px;}
</style>
</head>

<body>
  <header class="top">
    <div class="brand">
      <img src="/monolith/assets/monolith_logo.webp" alt="MONOLITH" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">Leave your mark. Live forever.</div>
      </div>
    </div>

    <div class="sp"></div>

    <div class="search" aria-label="search tiles">
      <input id="q" autocomplete="off" spellcheck="false" placeholder="Search tile E23-N11 or E23N11 or 23,-11" />
      <button class="btn" id="go" type="button">Go</button>
    </div>

    <div class="kpi">
      <div class="pill"><span class="dot"></span><span id="kTaken">0</span> taken</div>
      <a class="btn primary" href="/monolith/claim/" aria-label="claim a tile"><span>Claim a Tile</span></a>
      <button class="btn" id="btnCenter" type="button" aria-label="return to center"><span>Return to Center</span></button>
    </div>
  </header>

  <div id="vp" aria-label="wall viewport">
    <div id="world" aria-label="wall world"></div>
  </div>

  <aside class="panel" id="panel" aria-label="tile detail panel">
    <div class="ph">
      <div>
        <div class="ttl" id="ptitle">Tile</div>
        <div class="sub" id="psub">Tap a tile to inspect details.</div>
      </div>
      <div class="sp"></div>
      <button class="xbtn" id="close" type="button" aria-label="close panel">X</button>
    </div>
    <div class="pb">
      <div class="kv" aria-label="tile details">
        <div class="k">Tile</div><div class="v" id="vTile">None</div>
        <div class="k">Coords</div><div class="v" id="vCoords">0, 0</div>
<div class="k">Tag</div>
<div class="v" id="vTag">Open</div>
        <div class="k">Date</div><div class="v" id="vTs">None</div>

        <div class="k">Wallet</div>
        <div class="v" id="vWalletWrap">
          <span class="badge" id="vVerified" style="display:none">Verified owner</span>
          <span id="vWalletMasked">None</span>
          <span id="vWalletFull" style="display:none">None</span>
          <button class="copy" id="revealWallet" type="button" style="display:none">Reveal</button>
          <button class="copy" id="hideWallet" type="button" style="display:none">Hide</button>
          <button class="copy" id="copyWallet" type="button" style="display:none">Copy</button>
        </div>

        <div class="k">Link or Handle</div>
        <div class="v" id="vLinkWrap">
          <span id="vLink">None</span>
        </div>

        <div class="k">Note</div><div class="v" id="vNote">None</div>
<div class="k">Image</div><div class="v vMedia" id="vMedia"></div>
      </div>      

      <div class="muted" id="vBody">Tap a tile to inspect details.</div>
    </div>
  </aside>

  <div class="toast" id="toast" aria-label="toast"></div>

  </body>
</html>
