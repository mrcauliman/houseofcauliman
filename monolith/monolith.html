<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH Entrance</title>
  <meta name="description" content="Enter MONOLITH. The Wall of Record." />
  <meta property="og:title" content="MONOLITH Entrance" />
  <meta property="og:description" content="Enter MONOLITH. The Wall of Record." />
  <meta property="og:image" content="https://houseofcauliman.com/monolith/assets/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#173524;
      --green:#2fbf6b;
      --warn:#ffe175;
      --shadow:rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
        var(--bg);
      color:var(--fg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(680px, 100%);
      border:1px solid rgba(23,53,36,.95);
      border-radius:22px;
      background:rgba(11,27,19,.68);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      padding:18px 18px 16px;
    }
    .row{display:flex;gap:12px;align-items:center}
    .logo{width:44px;height:44px;object-fit:contain}
    .t{font-weight:1000;letter-spacing:.6px;font-size:16px;text-transform:uppercase;line-height:1.1}
    .s{margin-top:4px;color:rgba(245,247,244,.75);font-size:13px;line-height:1.25}
    .ctaRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .btn{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.85);
      color:var(--fg);
      border-radius:14px;
      padding:12px 14px;
      font-weight:1000;
      letter-spacing:.3px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      text-decoration:none;
    }
    .btn.primary{
      background:linear-gradient(180deg, rgba(47,191,107,.22), rgba(11,27,19,.88));
      border-color:rgba(47,191,107,.65);
    }
    .btn.warn{
      border-color:rgba(255,225,117,.55);
      background:rgba(255,225,117,.10);
      color:var(--warn);
    }
    .fine{
      margin-top:12px;
      color:rgba(174,183,175,.75);
      font-size:12px;
      line-height:1.25;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="MONOLITH Entrance">
    <div class="row">
      <img class="logo" src="/monolith/assets/monolith_logo.webp" alt="MONOLITH" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">Leave your mark. Live forever.</div>
      </div>
    </div>

    <div class="ctaRow">
      <a class="btn primary" href="/monolith/monolith.html" aria-label="enter the wall">Enter the Wall</a>
      <a class="btn" href="/monolith/claim/" aria-label="claim a tile">Claim a Tile</a>
      <a class="btn warn" href="/monolith/rules.html" aria-label="read rules">Rules</a>
    </div>

    <div class="fine">
      Entrance lives at /monolith/ and the Wall lives at /monolith/monolith.html
    </div>
  </main>
</body>
</html>
