<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — Claim</title>
  <meta name="description" content="Pick one tile. Attach one image. Save locally. On-chain claim is coming." />
  <meta property="og:title" content="MONOLITH — Claim" />
  <meta property="og:description" content="Pick one tile. Attach one image. Save locally. On-chain claim is coming." />
  <meta property="og:image" content="https://houseofcauliman.com/monolith/assets/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/claim/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0b1b13;
      --panel2:#0d2217;
      --fg:#f5f7f4;
      --muted:#aeb7af;
      --line:#173524;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;

      --shadow:rgba(0,0,0,.45);
      --radius:18px;

      --step:128px;
      --tile:118px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(47,191,107,.12), transparent 55%),
        radial-gradient(900px 650px at 85% 25%, rgba(255,225,117,.10), transparent 55%),
        var(--bg);
      color:var(--fg);
    }
    a{color:inherit;text-decoration:none}

    .top{
      position:sticky;top:0;z-index:10;
      margin:12px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(23,53,36,.9);
      border-radius:18px;
      background:rgba(7,9,11,.72);
      box-shadow:0 18px 44px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:34px;height:34px;object-fit:contain}
    .brand .t{font-weight:1000;letter-spacing:.6px;font-size:13px;text-transform:uppercase;line-height:1.1}
    .brand .s{margin-top:3px;color:rgba(245,247,244,.72);font-size:12px;line-height:1.2}
    .sp{flex:1}

    .btn{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.85);
      color:var(--fg);
      border-radius:14px;
      padding:10px 12px;
      font-weight:900;
      letter-spacing:.3px;
      cursor:pointer;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover{border-color:rgba(47,191,107,.55)}
    .btn.primary{
      background:linear-gradient(180deg, rgba(47,191,107,.22), rgba(11,27,19,.88));
      border-color:rgba(47,191,107,.65);
    }
    .btn.danger{
      border-color:rgba(255,91,91,.55);
      background:rgba(40,10,10,.35);
    }

    .pill{
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.72);
      padding:8px 10px;
      border-radius:999px;
      font-weight:900;
      letter-spacing:.2px;
      display:inline-flex;align-items:center;gap:8px;
      color:rgba(245,247,244,.86);
      font-size:12px;
    }
    .dot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 0 3px rgba(47,191,107,.18)}

    .wrap{
      padding:0 12px 18px;
      max-width:1100px;
      margin:0 auto;
    }

    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      margin:12px 0;
    }

    .field{
      display:flex;align-items:center;gap:8px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(11,27,19,.72);
      border-radius:14px;
      padding:8px 10px;
    }
    .field input{
      width:260px;
      max-width:60vw;
      border:0;
      outline:0;
      background:transparent;
      color:var(--fg);
      font-weight:900;
      letter-spacing:.2px;
      font-size:12px;
    }
    .field input::placeholder{color:rgba(174,183,175,.70)}

    .card{
      border:1px solid rgba(23,53,36,.9);
      border-radius:18px;
      background:rgba(7,9,11,.28);
      box-shadow:0 18px 44px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .card .hd{
      padding:12px;
      border-bottom:1px solid rgba(23,53,36,.75);
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    }
    .card .hd .ttl{font-weight:1000;letter-spacing:.4px}
    .card .hd .sub{color:rgba(245,247,244,.72);font-size:12px}
    .card .bd{padding:12px}

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap:10px;
    }
    .tile{
      height:118px;
      border-radius:16px;
      border:1px solid rgba(23,53,36,.75);
      background:
        radial-gradient(120px 90px at 30% 25%, rgba(47,191,107,.14), transparent 55%),
        rgba(11,27,19,.45);
      position:relative;
      overflow:hidden;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .tile:hover{border-color:rgba(47,191,107,.45)}
    .tile.disabled{
      opacity:.35;
      cursor:not-allowed;
      filter:saturate(.5);
    }
    .tile.selected{
      border-color:rgba(47,191,107,.95);
      box-shadow:0 0 0 2px rgba(47,191,107,.18) inset;
    }
    .tile .id{
      position:absolute;left:10px;bottom:8px;right:10px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.35px;
      color:rgba(245,247,244,.78);
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .tile .tag{
      position:absolute;left:10px;top:8px;right:10px;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.5px;
      color:rgba(255,225,117,.85);
      text-transform:uppercase;
      text-shadow:0 1px 0 rgba(0,0,0,.55);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .tile .spray{position:absolute;inset:0;opacity:.95}

    .tile .mediaWrap{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      padding:10px;
    }
    .tile .mediaWrap img{
      width:88%;
      height:88%;
      object-fit:contain;
      opacity:.95;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }
    .tile .legendText{
      position:absolute;
      left:8px;right:8px;bottom:10px;
      text-align:center;
      font-size:9px;
      font-weight:1000;
      letter-spacing:.6px;
      text-transform:uppercase;
      color:rgba(245,247,244,.92);
      text-shadow:0 2px 0 rgba(0,0,0,.55);
      pointer-events:none;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .kv{
      display:grid;
      grid-template-columns: 140px 1fr;
      gap:10px 12px;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.75);
      background:rgba(7,9,11,.22);
      margin-top:10px;
    }
    .kv .k{color:rgba(174,183,175,.85);font-size:12px;font-weight:900;letter-spacing:.4px;text-transform:uppercase}
    .kv .v{font-size:13px;font-weight:1000;letter-spacing:.2px}

    .muted{color:rgba(174,183,175,.86);font-size:12px;line-height:1.45}

    .toast{
      position:fixed;
      left:50%;
      bottom:14px;
      transform:translate3d(-50%, 90px, 0);
      opacity:0;
      transition:transform .18s ease, opacity .18s ease;
      z-index:40;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(23,53,36,.95);
      background:rgba(7,9,11,.72);
      backdrop-filter: blur(10px);
      font-weight:1000;
      letter-spacing:.2px;
      font-size:12px;
      max-width:90vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.show{transform:translate3d(-50%, 0, 0);opacity:1}
    .toast.good{border-color:rgba(47,191,107,.75)}
    .toast.warn{border-color:rgba(255,225,117,.75)}
    .toast.bad{border-color:rgba(255,91,91,.75)}
  </style>
</head>

<body>
  <header class="top">
    <div class="brand">
      <img src="/monolith/assets/monolith_logo.webp" alt="MONOLITH" />
      <div>
        <div class="t">MONOLITH</div>
        <div class="s">Pick one tile. Attach one image. Save locally.</div>
      </div>
    </div>

    <div class="sp"></div>

    <a class="btn" href="/monolith/" aria-label="back to wall">Back to Wall</a>
  </header>

  <main class="wrap">
    <div class="row">
      <div class="field" aria-label="start tile input">
        <input id="start" autocomplete="off" spellcheck="false" placeholder="Start tile like E23-N11 or E23N11 or 23,-11" />
        <button class="btn" id="setGrid" type="button">Set Grid</button>
      </div>

      <div class="pill"><span class="dot"></span><span id="takenCount">0</span> taken</div>
      <div class="pill">Draft: <span id="draftStatus">none</span></div>
    </div>

    <section class="card">
      <div class="hd">
        <div>
          <div class="ttl">Tile Picker</div>
          <div class="sub">Taken tiles are disabled using the feed. Upload auto-fits to 512x512 WebP.</div>
        </div>
        <div class="sp"></div>
        <button class="btn primary" id="save" type="button">Save Selection</button>
      </div>
      <div class="bd">
        <div class="grid" id="grid" aria-label="tile picker grid"></div>

        <div class="kv" aria-label="selection">
          <div class="k">Selected</div><div class="v" id="selTile">None</div>
          <div class="k">Coords</div><div class="v" id="selCoords">0, 0</div>
          <div class="k">Image</div><div class="v" id="selImg">None</div>
        </div>

        <div class="row" style="margin-top:12px">
          <input id="img" type="file" accept="image/*" style="display:none" />
          <button class="btn" id="upload" type="button">Upload Image</button>
          <button class="btn danger" id="removeImg" type="button">Remove Image</button>
          <div class="muted">Image stays local for now.</div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" aria-label="toast"></div>

  <script>
    const FEED_URL = "/assets/monolith/feed.json";
    const LS_KEY = "monolith_claim_draft_v1";

    const MONOLITH_TILE = "E0-N0";
    const MONOLITH_TAG = "MONOLITH";
    const MONOLITH_LOGO = "/monolith/assets/monolith_logo.webp";
    const MONOLITH_LEGEND = "FIRST MARK OF THE WALL";

    const MAX_SIDE = 512;
    const WEBP_QUALITY = 0.92;

    const toast = document.getElementById("toast");
    const el = {
      start: document.getElementById("start"),
      setGrid: document.getElementById("setGrid"),
      grid: document.getElementById("grid"),
      takenCount: document.getElementById("takenCount"),
      draftStatus: document.getElementById("draftStatus"),

      selTile: document.getElementById("selTile"),
      selCoords: document.getElementById("selCoords"),
      selImg: document.getElementById("selImg"),

      save: document.getElementById("save"),
      img: document.getElementById("img"),
      upload: document.getElementById("upload"),
      removeImg: document.getElementById("removeImg"),
    };

    const state = {
      baseGX: 0,
      baseGY: 0,
      radius: 2,
      taken: new Set(),
      marksByTile: new Map(),
      selected: null,
      imgDataUrl: null,
    };

    function toastShow(msg, kind){
      toast.className = "toast " + (kind || "");
      toast.textContent = msg;
      requestAnimationFrame(() => toast.classList.add("show"));
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function tileIdFromCoords(gx, gy){
      const ax = Math.abs(gx);
      const ay = Math.abs(gy);
      const sx = gx < 0 ? "W" : "E";
      const sy = gy <= 0 ? "N" : "S";
      return sx + ax + "-" + sy + ay;
    }

    function parseQueryToCoords(str){
      let raw = String(str || "").trim().toUpperCase().replace(/[–—−]/g, "-");
      raw = raw.replace(/\s+/g, "");

      if(/^-?\d+,\s*-?\d+$/.test(raw)){
        const parts = raw.split(",");
        const gx = parseInt(parts[0].trim(), 10);
        const gy = parseInt(parts[1].trim(), 10);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      let m = raw.match(/^([EW])(\d+)-([NS])(\d+)$/);
      if(m){
        const gx = parseInt(m[2], 10) * (m[1] === "W" ? -1 : 1);
        const gy = parseInt(m[4], 10) * (m[3] === "N" ? -1 : 1);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      m = raw.match(/^([EW])(\d+)([NS])(\d+)$/);
      if(m){
        const gx = parseInt(m[2], 10) * (m[1] === "W" ? -1 : 1);
        const gy = parseInt(m[4], 10) * (m[3] === "N" ? -1 : 1);
        if(Number.isFinite(gx) && Number.isFinite(gy)){
          return { gx, gy, tile: tileIdFromCoords(gx, gy), raw };
        }
      }

      return null;
    }

    function mulberry32(seed){
      let t = seed >>> 0;
      return function(){
        t += 0x6D2B79F5;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }
    function hashStr(str){
      let h = 2166136261 >>> 0;
      for(let i=0;i<str.length;i++){
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    function makeSpraySVG(seedStr){
      const rnd = mulberry32(hashStr(seedStr));
      const p = [];
      const count = 22;

      for(let i=0;i<count;i++){
        const x = Math.floor(rnd() * 118);
        const y = Math.floor(rnd() * 118);
        const r = 6 + Math.floor(rnd() * 18);
        const a = 0.10 + rnd() * 0.22;
        const g = rnd() < 0.72 ? "47,191,107" : "255,225,117";
        p.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(${g},${a.toFixed(3)})" />`);
      }
      return `<svg viewBox="0 0 118 118" width="118" height="118" xmlns="http://www.w3.org/2000/svg">${p.join("")}</svg>`;
    }

    function mediaHTML(src, alt, legend){
      const leg = legend ? `<div class="legendText">${legend}</div>` : "";
      return `<div class="mediaWrap"><img src="${src}" alt="${alt || ""}" /></div>${leg}`;
    }

    function setSelection(gx, gy){
      const tile = tileIdFromCoords(gx, gy);
      state.selected = { gx, gy, tile };
      el.selTile.textContent = tile;
      el.selCoords.textContent = `${gx}, ${gy}`;
      el.selImg.textContent = state.imgDataUrl ? "Attached" : "None";

      const nodes = el.grid.querySelectorAll(".tile");
      nodes.forEach(n => {
        const t = n.getAttribute("data-tile");
        if(t === tile) n.classList.add("selected");
        else n.classList.remove("selected");
      });
    }

    function buildGrid(){
      el.grid.innerHTML = "";

      const r = state.radius;
      let firstSet = false;

      for(let dy=-r; dy<=r; dy++){
        for(let dx=-r; dx<=r; dx++){
          const gx = state.baseGX + dx;
          const gy = state.baseGY + dy;
          const tile = tileIdFromCoords(gx, gy);

          const taken = state.taken.has(tile);
          const mark = state.marksByTile.get(tile) || null;

          const d = document.createElement("div");
          d.className = "tile" + (taken ? " disabled" : "");
          d.setAttribute("data-gx", String(gx));
          d.setAttribute("data-gy", String(gy));
          d.setAttribute("data-tile", tile);
          d.innerHTML = `<div class="spray"></div><div class="tag"></div><div class="id"></div>`;

          const spray = d.querySelector(".spray");
          const tag = d.querySelector(".tag");
          const id = d.querySelector(".id");

          if(id) id.textContent = tile;

          if(tag){
            if(mark && mark.tag) tag.textContent = mark.tag;
            else tag.textContent = taken ? "TAKEN" : "";
          }

          if(spray){
            const markTag = (mark && typeof mark.tag === "string") ? mark.tag.trim().toUpperCase() : "";
            const isMonolith = (tile === MONOLITH_TILE) || (markTag === MONOLITH_TAG);
            const img = (mark && typeof mark.img === "string" && mark.img.trim()) ? mark.img.trim() : "";

            if(isMonolith){
              spray.innerHTML = mediaHTML(MONOLITH_LOGO, "MONOLITH", MONOLITH_LEGEND);
            } else if(img){
              spray.innerHTML = mediaHTML(img, tile, "");
            } else {
              spray.innerHTML = makeSpraySVG(tile);
            }
          }

          d.addEventListener("click", () => {
            if(taken) return;
            setSelection(gx, gy);
          }, { passive:true });

          el.grid.appendChild(d);

          if(!firstSet && !taken){
            firstSet = true;
            setSelection(gx, gy);
          }
        }
      }
    }

    function saveDraft(){
      if(!state.selected){
        toastShow("pick a tile", "warn");
        return;
      }

      const payload = {
        v: 1,
        tile: state.selected.tile,
        gx: state.selected.gx,
        gy: state.selected.gy,
        imageDataUrl: state.imgDataUrl || null,
        ts: new Date().toISOString()
      };

      try{
        localStorage.setItem(LS_KEY, JSON.stringify(payload));
        el.draftStatus.textContent = "saved";
        toastShow("saved", "good");
      }catch(_){
        toastShow("save failed", "bad");
      }
    }

    function loadDraft(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(!raw){
          el.draftStatus.textContent = "none";
          return null;
        }
        const d = JSON.parse(raw);
        if(!d || typeof d !== "object"){
          el.draftStatus.textContent = "none";
          return null;
        }
        el.draftStatus.textContent = "saved";
        return d;
      }catch(_){
        el.draftStatus.textContent = "none";
        return null;
      }
    }

    async function loadFeed(){
      try{
        const res = await fetch(FEED_URL + "?cb=" + Date.now(), { cache:"no-store" });
        const data = await res.json();

        state.taken = new Set();
        state.marksByTile = new Map();

        if(Array.isArray(data)){
          for(const m of data){
            const gx = Number.isFinite(+m.gx) ? +m.gx : null;
            const gy = Number.isFinite(+m.gy) ? +m.gy : null;

            let tile = (typeof m.tile === "string" && m.tile) ? String(m.tile).trim().toUpperCase().replace(/[–—−]/g, "-") : null;
            if(!tile && gx !== null && gy !== null) tile = tileIdFromCoords(gx, gy);
            if(!tile) continue;

            state.taken.add(tile);
            state.marksByTile.set(tile, {
              tile,
              gx: gx !== null ? gx : 0,
              gy: gy !== null ? gy : 0,
              tag: (typeof m.tag === "string" ? m.tag : "") || "",
              ts: (typeof m.ts === "string" ? m.ts : "") || "",
              img: (typeof m.img === "string" ? m.img : "") || ""
            });
          }
        }

        el.takenCount.textContent = String(state.taken.size);
      }catch(_){
        el.takenCount.textContent = "0";
      }
    }

    function handleSetGrid(){
      const q = el.start.value || "";
      const p = parseQueryToCoords(q);
      if(!p){
        toastShow("bad start tile", "warn");
        return;
      }

      el.start.value = p.tile;

      state.baseGX = p.gx;
      state.baseGY = p.gy;

      buildGrid();
      toastShow("grid " + p.tile, "good");
    }

    function handleUpload(){
      el.img.value = "";
      el.img.click();
    }

    function handleRemoveImg(){
      state.imgDataUrl = null;
      el.selImg.textContent = "None";
      toastShow("image removed", "good");
    }

    function loadImageFromFile(file){
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image load failed")); };
        img.src = url;
      });
    }

    function canvasToWebpDataUrl(canvas){
      try{
        const d = canvas.toDataURL("image/webp", WEBP_QUALITY);
        if(d && d.startsWith("data:image/webp")) return d;
      }catch(_){}
      return canvas.toDataURL("image/png");
    }

    async function fitTo512Webp(file){
      const img = await loadImageFromFile(file);
      const w = img.naturalWidth || img.width || 0;
      const h = img.naturalHeight || img.height || 0;

      if(!w || !h) throw new Error("bad image");

      const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
      const tw = Math.max(1, Math.round(w * scale));
      const th = Math.max(1, Math.round(h * scale));

      const canvas = document.createElement("canvas");
      canvas.width = tw;
      canvas.height = th;

      const ctx = canvas.getContext("2d", { alpha:true });
      if(!ctx) throw new Error("no canvas");

      ctx.clearRect(0, 0, tw, th);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, 0, 0, tw, th);

      return canvasToWebpDataUrl(canvas);
    }

    function wire(){
      el.setGrid.addEventListener("click", handleSetGrid, { passive:true });
      el.start.addEventListener("keydown", (e) => {
        if(e.key === "Enter") handleSetGrid();
      }, { passive:true });

      el.save.addEventListener("click", saveDraft, { passive:true });
      el.upload.addEventListener("click", handleUpload, { passive:true });
      el.removeImg.addEventListener("click", handleRemoveImg, { passive:true });

      el.img.addEventListener("change", async () => {
        const file = el.img.files && el.img.files[0];
        if(!file) return;

        try{
          const dataUrl = await fitTo512Webp(file);
          state.imgDataUrl = String(dataUrl || "");
          el.selImg.textContent = state.imgDataUrl ? "Attached" : "None";
          toastShow("image fitted 512", "good");
        }catch(_){
          toastShow("image rejected", "bad");
        }
      });
    }

    wire();

    const draft = loadDraft();

    loadFeed().then(() => {
      state.baseGX = 0;
      state.baseGY = 0;

      if(draft && Number.isFinite(+draft.gx) && Number.isFinite(+draft.gy)){
        state.baseGX = +draft.gx;
        state.baseGY = +draft.gy;
        state.imgDataUrl = draft.imageDataUrl || null;
      }

      el.start.value = tileIdFromCoords(state.baseGX, state.baseGY);
      buildGrid();

      if(state.imgDataUrl) el.selImg.textContent = "Attached";
    });

    setInterval(loadFeed, 15000);
  </script>
</body>
</html>
