<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH Claim Draft</title>
  <meta name="description" content="MONOLITH claim draft. Single source of truth feed. Clean UI. Local-only draft save." />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root{
      --bg:#0b0f14;
      --panel:rgba(255,255,255,.06);
      --panel2:rgba(255,255,255,.09);
      --line:rgba(255,255,255,.12);
      --fg:#e9eef7;
      --muted:rgba(233,238,247,.70);
      --bad:#ff5a6a;
      --ok:#62ffa8;
      --accent:#7ad3ff;
      --shadow:rgba(0,0,0,.35);
      --r:14px;
      --pad:14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      background:radial-gradient(1200px 700px at 10% 0%, rgba(122,211,255,.15), transparent 55%),
                 radial-gradient(900px 600px at 90% 10%, rgba(98,255,168,.12), transparent 50%),
                 var(--bg);
      color:var(--fg);
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .top{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
      box-shadow:0 10px 30px var(--shadow);
      position:sticky;top:0;z-index:10;
      backdrop-filter: blur(10px);
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{width:34px;height:34px;border-radius:10px}
    .brand .t{font-weight:800;letter-spacing:.4px}
    .btns{display:flex;gap:10px;flex-wrap:wrap}
    .pill{
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--fg);
      padding:10px 12px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
      user-select:none;
    }
    .pill:hover{background:rgba(255,255,255,.10)}
    .pill:active{transform:translateY(1px)}
    .grid{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:14px;
      margin-top:14px;
    }
    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
      .top{position:static}
    }
    .card{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      border-radius:var(--r);
      box-shadow:0 10px 30px var(--shadow);
      overflow:hidden;
    }
    .card .hd{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .card .hd .h{font-weight:800}
    .card .bd{padding:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .row + .row{margin-top:10px}
    label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.4px;text-transform:uppercase}
    input[type="text"], input[type="number"]{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.25);
      color:var(--fg);
      outline:none;
      font-family:var(--mono);
      font-size:14px;
    }
    input[type="number"]{font-family:var(--sans)}
    .field{flex:1;min-width:220px}
    .small{max-width:160px}
    .help{color:var(--muted);font-size:13px;line-height:1.35}
    .status{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.22);
      font-size:13px;
      line-height:1.4;
    }
    .status b{color:var(--fg)}
    .status .ok{color:var(--ok);font-weight:900}
    .status .bad{color:var(--bad);font-weight:900}
    .tiles{
      display:grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap:8px;
      margin-top:12px;
    }
    @media (max-width: 520px){
      .tiles{grid-template-columns: repeat(4, minmax(0, 1fr))}
    }
    .tile{
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      border-radius:12px;
      padding:10px 8px;
      text-align:center;
      cursor:pointer;
      user-select:none;
      min-height:52px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
    }
    .tile:hover{background:rgba(255,255,255,.10)}
    .tile:active{transform:translateY(1px)}
    .tile .id{font-family:var(--mono);font-size:12px;font-weight:900}
    .tile .meta{font-size:11px;color:var(--muted);font-weight:800}
    .tile.taken{
      opacity:.55;
      cursor:not-allowed;
      background:rgba(255,90,106,.08);
      border-color:rgba(255,90,106,.22);
    }
    .tile.sel{
      background:rgba(122,211,255,.14);
      border-color:rgba(122,211,255,.35);
    }
    .imgbox{
      border:1px dashed rgba(255,255,255,.18);
      border-radius:14px;
      padding:12px;
      background:rgba(0,0,0,.18);
    }
    .imgbox img{
      width:100%;
      display:block;
      border-radius:12px;
      max-height:320px;
      object-fit:cover;
    }
    .kvs{display:grid;grid-template-columns:160px 1fr;gap:10px 12px}
    .k{color:var(--muted);font-weight:900;font-size:12px;letter-spacing:.3px}
    .v{font-family:var(--mono);font-size:13px;word-break:break-word}
    .hr{height:1px;background:var(--line);margin:12px 0}
    pre{
      font-family:var(--mono);
      font-size:12px;
      background:rgba(0,0,0,.35);
      border:1px solid var(--line);
      padding:12px;
      border-radius:12px;
      overflow:auto;
      margin:0;
      display:none;
    }
    pre.show{display:block}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <img src="/monolith/assets/monolith_logo.webp" alt="MONOLITH" />
        <div>
          <div class="t">MONOLITH</div>
          <div class="help">Claim draft. Clean by default. Debug only with <span style="font-family:var(--mono)">?debug=1</span>.</div>
        </div>
      </div>
      <div class="btns">
        <a class="pill" href="/monolith/">Back to Wall</a>
        <a class="pill" href="/monolith/monolith_laws.html">Laws</a>
        <a class="pill" href="/monolith/rules.html">Rules</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="hd">
          <div class="h">Start tile</div>
          <div class="help">Formats: E23-N11, E23N11, 23,-11</div>
        </div>
        <div class="bd">
          <div class="row">
            <div class="field">
              <label>Start tile</label>
              <input id="start" type="text" inputmode="text" placeholder="E23-N11 or 23,-11" />
            </div>
            <div class="field small">
              <label>Radius</label>
              <input id="radius" type="number" min="1" max="6" step="1" value="2" />
            </div>
          </div>

          <div class="row">
            <button class="pill" id="setGrid">Set Grid</button>
            <button class="pill" id="clearSel">Clear Selection</button>
            <div class="help" id="feedStat">Feed: not loaded yet</div>
          </div>

          <div class="status" id="status">
            <b>Status</b>
            <div id="statusLine">No selection yet</div>
          </div>

          <div class="tiles" id="tiles"></div>

          <div class="hr"></div>

          <div class="row">
            <button class="pill" id="saveDraft">Save Selection</button>
            <button class="pill" id="copyDraft">Copy Summary</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="hd">
          <div class="h">Image</div>
          <div class="help">Optional</div>
        </div>
        <div class="bd">
          <div class="row">
            <input id="file" type="file" accept="image/*" style="display:none" />
            <button class="pill" id="uploadBtn">Upload Image</button>
            <button class="pill" id="removeBtn">Remove Image</button>
          </div>

          <div class="row">
            <div class="field imgbox" id="imgBox">
              <div class="help" id="imgHelp">No image selected</div>
            </div>
          </div>

          <div class="hr"></div>

          <div class="kvs">
            <div class="k">Selected tile</div><div class="v" id="vTile">None</div>
            <div class="k">Coords</div><div class="v" id="vCoords">None</div>
            <div class="k">Taken</div><div class="v" id="vTaken">Unknown</div>
          </div>

          <div class="hr"></div>

          <pre id="debug"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DRAFT_KEY = "monolith_claim_draft_v1";
    const FEED_URL = "/assets/monolith/feed.json?cb=" + Date.now();

    const el = {
      start: document.getElementById("start"),
      radius: document.getElementById("radius"),
      setGrid: document.getElementById("setGrid"),
      clearSel: document.getElementById("clearSel"),
      tiles: document.getElementById("tiles"),
      feedStat: document.getElementById("feedStat"),
      statusLine: document.getElementById("statusLine"),
      vTile: document.getElementById("vTile"),
      vCoords: document.getElementById("vCoords"),
      vTaken: document.getElementById("vTaken"),
      file: document.getElementById("file"),
      uploadBtn: document.getElementById("uploadBtn"),
      removeBtn: document.getElementById("removeBtn"),
      imgBox: document.getElementById("imgBox"),
      imgHelp: document.getElementById("imgHelp"),
      saveDraft: document.getElementById("saveDraft"),
      copyDraft: document.getElementById("copyDraft"),
      debug: document.getElementById("debug"),
    };

    const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

    const state = {
      taken: new Set(),
      startTile: "",
      start: { gx: 0, gy: 0 },
      radius: 2,
      selectedTile: "",
      selected: { gx: 0, gy: 0 },
      imageDataUrl: null,
      feedLoaded: false,
      lastError: "",
      lastDebug: null,
    };

    function dbg(obj){
      state.lastDebug = obj;
      if(!DEBUG) return;
      el.debug.classList.add("show");
      el.debug.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    }

    function setStatus(msg, isBad){
      const cls = isBad ? "bad" : "ok";
      el.statusLine.innerHTML = "<span class='" + cls + "'>" + msg + "</span>";
    }

    function normalizeDash(s){
      return (s || "").trim()
        .replace(/[–—−]/g, "-")
        .replace(/\s+/g, "");
    }

    function tileFromCoords(gx, gy){
      const ew = gx >= 0 ? "E" : "W";
      const ns = gy >= 0 ? "N" : "S";
      return ew + Math.abs(gx) + "-" + ns + Math.abs(gy);
    }

    function parseTileOrCoords(input){
      const raw = normalizeDash(input);
      if(!raw) return null;

      const coord = raw.match(/^(-?\d+),(-?\d+)$/);
      if(coord){
        const gx = parseInt(coord[1], 10);
        const gy = parseInt(coord[2], 10);
        if(!Number.isFinite(gx) || !Number.isFinite(gy)) return null;
        return { gx, gy, tile: tileFromCoords(gx, gy) };
      }

      const t1 = raw.match(/^([EW])(\d+)-([NS])(\d+)$/i);
      if(t1){
        const gx = (t1[1].toUpperCase() === "E" ? 1 : -1) * parseInt(t1[2], 10);
        const gy = (t1[3].toUpperCase() === "N" ? 1 : -1) * parseInt(t1[4], 10);
        return { gx, gy, tile: tileFromCoords(gx, gy) };
      }

      const t2 = raw.match(/^([EW])(\d+)([NS])(\d+)$/i);
      if(t2){
        const gx = (t2[1].toUpperCase() === "E" ? 1 : -1) * parseInt(t2[2], 10);
        const gy = (t2[3].toUpperCase() === "N" ? 1 : -1) * parseInt(t2[4], 10);
        return { gx, gy, tile: tileFromCoords(gx, gy) };
      }

      return null;
    }

    async function loadFeedTaken(){
      const t0 = performance.now();
      try{
        const r = await fetch(FEED_URL, { cache: "no-store" });
        if(!r.ok) throw new Error("feed http " + r.status);
        const arr = await r.json();
        const taken = new Set();
        for(const m of (Array.isArray(arr) ? arr : [])){
          if(m && typeof m.tile === "string" && m.tile) taken.add(m.tile);
        }
        state.feedLoaded = true;
        state.taken = taken;
        const ms = Math.round(performance.now() - t0);
        el.feedStat.textContent = "Feed loaded, tiles taken: " + taken.size + ", " + ms + "ms";
        dbg({ feed: "ok", taken: taken.size, ms });
        return taken;
      }catch(e){
        state.feedLoaded = false;
        state.taken = new Set();
        el.feedStat.textContent = "Feed failed, grid is not authoritative";
        dbg({ feed: "fail", error: String(e) });
        return state.taken;
      }
    }

    function clampInt(v, a, b, d){
      const n = parseInt(v, 10);
      if(!Number.isFinite(n)) return d;
      return Math.max(a, Math.min(b, n));
    }

    function setSelection(tile, gx, gy){
      state.selectedTile = tile;
      state.selected = { gx, gy };

      el.vTile.textContent = tile || "None";
      el.vCoords.textContent = tile ? (gx + "," + gy) : "None";
      el.vTaken.textContent = tile ? (state.taken.has(tile) ? "YES" : "NO") : "Unknown";

      if(!tile){
        setStatus("No selection yet", false);
        return;
      }

      if(state.taken.has(tile)){
        setStatus("Tile is taken. Pick another", true);
      }else{
        setStatus("Tile selected. Save when ready", false);
      }
    }

    function clearSelection(){
      state.selectedTile = "";
      setSelection("", 0, 0);
      [...el.tiles.querySelectorAll(".tile")].forEach(x => x.classList.remove("sel"));
    }

    function renderGrid(){
      el.tiles.innerHTML = "";
      const r = state.radius;

      const cells = [];
      for(let dy = r; dy >= -r; dy--){
        for(let dx = -r; dx <= r; dx++){
          const gx = state.start.gx + dx;
          const gy = state.start.gy + dy;
          const tile = tileFromCoords(gx, gy);
          cells.push({ tile, gx, gy });
        }
      }

      for(const c of cells){
        const div = document.createElement("div");
        div.className = "tile";
        div.dataset.tile = c.tile;

        const isTaken = state.taken.has(c.tile);
        if(isTaken) div.classList.add("taken");
        if(state.selectedTile === c.tile) div.classList.add("sel");

        div.innerHTML = `
          <div class="id">${c.tile}</div>
          <div class="meta">${isTaken ? "taken" : "open"}</div>
        `;

        div.addEventListener("click", () => {
          if(isTaken){
            setSelection(c.tile, c.gx, c.gy);
            return;
          }
          [...el.tiles.querySelectorAll(".tile")].forEach(x => x.classList.remove("sel"));
          div.classList.add("sel");
          setSelection(c.tile, c.gx, c.gy);
        });

        el.tiles.appendChild(div);
      }
    }

    async function setGridFromInput(){
      const p = parseTileOrCoords(el.start.value);
      if(!p){
        setSelection("", 0, 0);
        setStatus("Start tile invalid", true);
        if(DEBUG) dbg({ error: "start invalid", input: el.start.value });
        return;
      }

      state.radius = clampInt(el.radius.value, 1, 6, 2);
      el.radius.value = String(state.radius);

      state.startTile = p.tile;
      state.start = { gx: p.gx, gy: p.gy };
      el.start.value = p.tile;

      await loadFeedTaken();
      clearSelection();
      renderGrid();

      setStatus("Grid ready. Pick an open tile", false);
    }

    function setImageData(url){
      state.imageDataUrl = url || null;
      el.imgBox.innerHTML = "";
      if(!state.imageDataUrl){
        el.imgHelp = document.createElement("div");
        el.imgHelp.className = "help";
        el.imgHelp.textContent = "No image selected";
        el.imgBox.appendChild(el.imgHelp);
        return;
      }
      const img = document.createElement("img");
      img.src = state.imageDataUrl;
      img.alt = "Claim image preview";
      el.imgBox.appendChild(img);
    }

    function buildDraftPayload(){
      const tile = state.selectedTile;
      if(!tile){
        state.lastError = "Select a tile first";
        if(DEBUG) dbg({ error: "no tile selected" });
        return null;
      }
      const gx = state.selected.gx;
      const gy = state.selected.gy;

      if(state.taken.has(tile)){
        state.lastError = "Tile is taken";
        if(DEBUG) dbg({ error: "tile taken", tile });
        return null;
      }

      return {
        v: 1,
        tile,
        gx,
        gy,
        imageDataUrl: state.imageDataUrl || null,
        ts: Date.now()
      };
    }

    function saveDraft(){
      const payload = buildDraftPayload();
      if(!payload){
        setStatus(state.lastError || "Unable to save", true);
        return;
      }
      try{
        localStorage.setItem(DRAFT_KEY, JSON.stringify(payload));
        setStatus("Saved draft locally", false);
        if(DEBUG) dbg({ saved: true, key: DRAFT_KEY, tile: payload.tile });
      }catch(e){
        setStatus("Save failed", true);
        if(DEBUG) dbg({ saved: false, error: String(e) });
      }
    }

    async function copySummary(){
      const payload = buildDraftPayload();
      if(!payload){
        setStatus(state.lastError || "Unable to copy", true);
        return;
      }
      const summary =
        "MONOLITH claim draft\n" +
        "Tile: " + payload.tile + "\n" +
        "Coords: " + payload.gx + "," + payload.gy + "\n" +
        "Image: " + (payload.imageDataUrl ? "yes" : "no") + "\n" +
        "Saved key: " + DRAFT_KEY;

      try{
        await navigator.clipboard.writeText(summary);
        setStatus("Copied summary to clipboard", false);
        if(DEBUG) dbg({ copied: true, tile: payload.tile });
      }catch(e){
        setStatus("Copy failed", true);
        if(DEBUG) dbg({ copied: false, error: String(e) });
      }
    }

    function restoreDraft(){
      try{
        const raw = localStorage.getItem(DRAFT_KEY);
        if(!raw) return;
        const p = JSON.parse(raw);
        if(!p || typeof p.tile !== "string") return;

        const parsed = parseTileOrCoords(p.tile);
        if(!parsed) return;

        el.start.value = parsed.tile;
        state.startTile = parsed.tile;
        state.start = { gx: parsed.gx, gy: parsed.gy };

        if(typeof p.imageDataUrl === "string" && p.imageDataUrl) setImageData(p.imageDataUrl);

        dbg({ restored: true, tile: parsed.tile });
      }catch(e){
        if(DEBUG) dbg({ restored: false, error: String(e) });
      }
    }

    el.setGrid.addEventListener("click", () => { setGridFromInput(); });
    el.clearSel.addEventListener("click", () => { clearSelection(); });

    el.uploadBtn.addEventListener("click", () => { el.file.click(); });
    el.removeBtn.addEventListener("click", () => { setImageData(null); });

    el.file.addEventListener("change", () => {
      const f = el.file.files && el.file.files[0];
      if(!f){ return; }
      const rd = new FileReader();
      rd.onload = () => { setImageData(String(rd.result || "")); };
      rd.readAsDataURL(f);
    });

    el.saveDraft.addEventListener("click", () => { saveDraft(); });
    el.copyDraft.addEventListener("click", () => { copySummary(); });

    if(DEBUG){
      el.debug.classList.add("show");
      dbg("Debug enabled");
    }

    setImageData(null);
    restoreDraft();
    setStatus("Enter a start tile, then set grid", false);
  </script>
</body>
</html>
