<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>MONOLITH — Claim</title>
  <meta name="description" content="Pick a tile. Leave a mark. No edits. No deletes." />

  <meta property="og:title" content="MONOLITH — Claim" />
  <meta property="og:description" content="Pick a tile. Leave a mark. No edits. No deletes." />
  <meta property="og:image" content="https://houseofcauliman.com/assets/monolith/monolith_logo.webp" />
  <meta property="og:url" content="https://houseofcauliman.com/monolith/claim/" />
  <meta property="og:type" content="website" />

  <style>
    :root{
      --bg:#07090b;
      --panel:#0c1116;
      --panel2:#0f151c;
      --line:#1f2a36;
      --fg:#f5f7f4;
      --muted:#a9b3bd;
      --green:#2fbf6b;
      --warn:#ffe175;
      --red:#ff5b5b;
      --shadow:rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(47,191,107,.10), transparent 55%),
        radial-gradient(900px 500px at 20% 0%, rgba(255,255,255,.05), transparent 55%),
        var(--bg);
      color:var(--fg);
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px}
    .dot{width:10px;height:10px;border-radius:999px;background:var(--green);box-shadow:0 0 18px rgba(47,191,107,.25)}
    h1{margin:0;font-size:18px;letter-spacing:.2px}
    .sub{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:7px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    @media(min-width:940px){.grid{grid-template-columns:1.25fr .75fr}}
    .card{border:1px solid var(--line);background:rgba(12,17,22,.92);backdrop-filter: blur(6px);border-radius:var(--radius);padding:14px;box-shadow:0 12px 30px var(--shadow)}
    h2{margin:0 0 10px;font-size:14px}
    label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px}
    input,textarea,select{
      width:100%;
      background:var(--panel2);
      border:1px solid var(--line);
      color:var(--fg);
      border-radius:12px;
      padding:10px 10px;
      font-size:14px;
      outline:none;
    }
    textarea{min-height:96px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:620px){.row{grid-template-columns:1fr 1fr}}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      background:rgba(47,191,107,.12);
      border:1px solid rgba(47,191,107,.45);
      color:var(--fg);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:800;
      letter-spacing:.2px;
      font-size:13px;
      user-select:none;
    }
    .btn.secondary{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:rgba(245,247,244,.92)}
    .btn.danger{background:rgba(255,91,91,.12);border-color:rgba(255,91,91,.45)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .hint{color:var(--muted);font-size:12px;line-height:1.4;margin:8px 0 0}
    .ok{color:rgba(47,191,107,.95);font-weight:800}
    .warn{color:rgba(255,225,117,.95);font-weight:800}
    .err{color:rgba(255,91,91,.95);font-weight:800}

    .tilegrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
    @media(max-width:520px){.tilegrid{grid-template-columns:repeat(8,1fr)}}
    .tcell{
      aspect-ratio:1/1;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.03);
      cursor:pointer;
      position:relative;
      overflow:hidden;
    }
    .tcell:hover{border-color:rgba(47,191,107,.55)}
    .tcell.selected{border-color:rgba(47,191,107,.95);box-shadow:0 0 0 2px rgba(47,191,107,.18) inset}
    .tcell.taken{opacity:.30;cursor:not-allowed}
    .tcell b{position:absolute;inset:auto 8px 6px 8px;font-size:10px;color:rgba(245,247,244,.75);font-weight:800;letter-spacing:.3px}
    .tcell i{position:absolute;inset:8px auto auto 8px;font-style:normal;font-size:10px;color:rgba(169,179,189,.85)}
    .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .key{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
    .sw{width:12px;height:12px;border-radius:4px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
    .sw.sel{border-color:rgba(47,191,107,.8);background:rgba(47,191,107,.15)}
    .sw.tak{opacity:.35}

    pre{
      margin:10px 0 0;
      white-space:pre-wrap;
      word-break:break-word;
      background:#070a0d;
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:12px;
      font-size:12px;
      line-height:1.45;
      color:rgba(245,247,244,.92);
    }
    .small{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>MONOLITH — Claim</h1>
          <div class="sub">Pick a tile. Leave a mark. No edits. No deletes.</div>
        </div>
      </div>
      <div class="pill" id="statuspill">status: <span class="warn">prototype</span></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>1) Choose a tile</h2>
        <div class="small">Tap a tile. Taken tiles can’t be selected.</div>

        <div class="tilegrid" id="tilegrid" aria-label="tile grid"></div>

        <div class="legend">
          <div class="key"><span class="sw"></span> available</div>
          <div class="key"><span class="sw sel"></span> selected</div>
          <div class="key"><span class="sw tak"></span> taken</div>
        </div>

        <p class="hint" id="tilehint"></p>
      </div>

      <div class="card">
        <h2>2) Build your claim packet</h2>

        <div class="row">
          <div>
            <label for="handle">Handle</label>
            <input id="handle" autocomplete="off" placeholder="@name" maxlength="40" />
          </div>
          <div>
            <label for="network">Network</label>
            <select id="network">
              <option value="x" selected>𝕏</option>
              <option value="telegram">Telegram</option>
              <option value="discord">Discord</option>
              <option value="email">Email</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <label for="wallet">XRPL Address</label>
        <input id="wallet" autocomplete="off" placeholder="r..." maxlength="80" />

        <label for="mark">Mark Text</label>
        <textarea id="mark" placeholder="What you want recorded on the wall" maxlength="280"></textarea>
        <div class="small" id="count">0 / 280</div>

        <div class="btnrow">
          <button class="btn secondary" id="copy" type="button">Copy JSON</button>
          <button class="btn" id="download" type="button">Download claim.json</button>
          <button class="btn danger" id="clear" type="button">Clear</button>
        </div>

        <p class="hint" id="hint"></p>
        <pre id="out">{}</pre>
      </div>
    </div>
  </div>

<script>
(() => {
  const GRID_W = 10;
  const GRID_H = 10;

  // sample taken list (replace later from an endpoint)
  const TAKEN = new Set([
    "0001","0002","0003","0010","0042"
  ]);

  const el = {
    tilegrid: document.getElementById("tilegrid"),
    tilehint: document.getElementById("tilehint"),
    handle: document.getElementById("handle"),
    network: document.getElementById("network"),
    wallet: document.getElementById("wallet"),
    mark: document.getElementById("mark"),
    out: document.getElementById("out"),
    hint: document.getElementById("hint"),
    count: document.getElementById("count"),
    copy: document.getElementById("copy"),
    download: document.getElementById("download"),
    clear: document.getElementById("clear"),
    statuspill: document.getElementById("statuspill")
  };

  const state = {
    tile: "",
    claim: {}
  };

  function pad4(n){
    return String(n).padStart(4,"0");
  }

  function setHint(msg, cls){
    el.hint.className = "hint " + (cls || "");
    el.hint.textContent = msg || "";
  }

  function setTileHint(msg, cls){
    el.tilehint.className = "hint " + (cls || "");
    el.tilehint.textContent = msg || "";
  }

  function sanitizeHandle(v){
    v = (v||"").trim();
    if(v.startsWith("@")) v = v.slice(1);
    return v.replace(/\s+/g,"").slice(0,40);
  }

  function normalizeWallet(v){
    return (v||"").trim().slice(0,80);
  }

  function nowIso(){
    return new Date().toISOString();
  }

  function buildClaim(){
    const handle = sanitizeHandle(el.handle.value);
    const network = (el.network.value || "x").trim();
    const wallet = normalizeWallet(el.wallet.value);
    const mark = (el.mark.value || "").trim().slice(0,280);

    el.handle.value = handle;
    el.wallet.value = wallet;

    const claim = {
      version: "monolith-claim-v1",
      created_at: nowIso(),
      tile: state.tile || "",
      identity: {
        network,
        handle: handle ? ("@" + handle) : ""
      },
      wallet: wallet,
      mark: mark
    };

    state.claim = claim;
    el.out.textContent = JSON.stringify(claim, null, 2);

    const ok = [];
    const warn = [];

    if(!claim.tile) warn.push("pick a tile");
    if(!claim.identity.handle) warn.push("handle");
    if(!claim.wallet) warn.push("wallet");
    if(!claim.mark) warn.push("mark text");

    if(warn.length){
      setHint("missing: " + warn.join(", "), "warn");
    } else {
      setHint("packet ready", "ok");
    }

    el.download.disabled = !claim.tile;
    el.copy.disabled = !claim.tile;
  }

  function selectTile(t){
    if(TAKEN.has(t)){
      setTileHint("tile " + t + " is taken", "err");
      return;
    }
    state.tile = t;

    el.tilegrid.querySelectorAll(".tcell.selected").forEach(x=>x.classList.remove("selected"));
    const btn = el.tilegrid.querySelector('[data-tile="'+t+'"]');
    if(btn) btn.classList.add("selected");

    setTileHint("selected tile: " + t, "ok");
    buildClaim();
  }

  function buildGrid(){
    const host = el.tilegrid;
    host.innerHTML = "";

    const total = GRID_W * GRID_H;

    for(let i=1;i<=total;i++){
      const t = pad4(i);
      const cell = document.createElement("div");
      cell.className = "tcell" + (TAKEN.has(t) ? " taken" : "");
      cell.setAttribute("data-tile", t);
      cell.setAttribute("role","button");
      cell.setAttribute("tabindex","0");
      cell.title = "tile " + t;

      const iel = document.createElement("i");
      iel.textContent = t;

      const bel = document.createElement("b");
      bel.textContent = TAKEN.has(t) ? "TAKEN" : "OPEN";

      cell.appendChild(iel);
      cell.appendChild(bel);

      cell.addEventListener("click", () => {
        if(TAKEN.has(t)) return;
        selectTile(t);
      });

      cell.addEventListener("keydown", (e) => {
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          if(TAKEN.has(t)) return;
          selectTile(t);
        }
      });

      host.appendChild(cell);
    }

    setTileHint("tap any OPEN tile", "warn");
    buildClaim();
  }

  function downloadJson(){
    const blob = new Blob([JSON.stringify(state.claim, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "claim.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function copyJson(){
    try{
      await navigator.clipboard.writeText(JSON.stringify(state.claim, null, 2));
      setHint("copied to clipboard", "ok");
    }catch(e){
      setHint("clipboard blocked, use Download claim.json", "warn");
    }
  }

  function clearAll(){
    state.tile = "";
    el.handle.value = "";
    el.wallet.value = "";
    el.mark.value = "";
    el.count.textContent = "0 / 280";
    el.tilegrid.querySelectorAll(".tcell.selected").forEach(x=>x.classList.remove("selected"));
    setTileHint("tap any OPEN tile", "warn");
    buildClaim();
  }

  el.mark.addEventListener("input", () => {
    const n = (el.mark.value || "").length;
    el.count.textContent = n + " / 280";
    buildClaim();
  });

  ["input","change"].forEach(evt=>{
    el.handle.addEventListener(evt, buildClaim);
    el.network.addEventListener(evt, buildClaim);
    el.wallet.addEventListener(evt, buildClaim);
  });

  el.download.addEventListener("click", downloadJson);
  el.copy.addEventListener("click", copyJson);
  el.clear.addEventListener("click", clearAll);

  buildGrid();
})();
</script>
</body>
</html>
