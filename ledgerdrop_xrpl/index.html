<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ledger Drop XRPL — 589 Gallery</title>
  <link rel="canonical" href="https://houseofcauliman.com/ledgerdrop_xrpl/">

  <style>
    :root{
      --bg:#050509;
      --panel:#0b0e18;
      --muted:#a9b2c2;
      --r:18px;
      --max:1200px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:var(--bg);
      color:#f5f7ff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    a{color:inherit}
    code{color:#d6ddff}

    .wrap{max-width:var(--max);margin:0 auto;padding:26px 16px 70px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .back{
      display:inline-flex;gap:10px;align-items:center;
      text-decoration:none;border:1px solid rgba(255,255,255,.12);
      padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03)
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      text-decoration:none;font-weight:800;
      padding:10px 14px;border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04)
    }

    h1{margin:14px 0 0;font-size:34px;letter-spacing:.2px}
    .bio{margin:10px 0 0;color:var(--muted);line-height:1.55}

    .panel{
      margin-top:18px;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.10);
      border-radius:var(--r);
      padding:14px;
    }
    .panel-title{font-weight:900}
    .links{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

    .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
    .tile{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      overflow:hidden;
    }
    .tile img{
      display:block;
      width:100%;
      height:auto;
      max-height:720px;
      object-fit:contain;
      background:#07070a;
    }
    .cap{
      padding:10px 12px;
      color:var(--muted);
      font-size:13px;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .cap span{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    @media (min-width:860px){
      .grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>

<body>

      <div class="bio" style="margin-top:6px">
        Drop files into <code>collections/ledgerdropxrpl/assets/589/</code> then add tiles below.
      </div>
      <div class="links">
        <a class="btn" href="#gallery">Jump to Gallery</a>
      </div>
    </div>

    <div id="gallery" class="grid">
