<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Living Word — House of Cauliman</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="canonical" href="https://houseofcauliman.com/collections/livingword.html">
  <meta name="description" content="The Living Word — Digital Scripture on XRPL. Pixar-style cinematic realism. Museum-grade reverence. Free mint with optional $XRP donations.">
  <style>
    :root{
      --bg:#050509;
      --panel:#0b0e18;
      --panel2:#070915;
      --border:rgba(122,167,255,.45);
      --border2:rgba(215,179,106,.35);
      --text:#f5f7ff;
      --muted:#a9b2c2;
      --soft:#717895;
      --blue:#7aa7ff;  /* XRPL blue */
      --gold:#d7b36a;  /* parchment gold */
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:
        radial-gradient(circle at 18% 0, rgba(122,167,255,0.28) 0, rgba(2,6,23,0.0) 52%),
        radial-gradient(circle at 85% 14%, rgba(215,179,106,0.18) 0, rgba(0,0,0,0) 58%),
        radial-gradient(circle at top,#111827 0,#020308 55%,#000 100%);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1400px;margin:0 auto;padding:18px 16px 80px}
    .back-btn{
      display:inline-block;
      margin-bottom:14px;
      font-size:.7rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(122,167,255,.55);
      background:rgba(7,9,21,.86);
      backdrop-filter:blur(10px);
    }
    .hero{
      border:1px solid rgba(122,167,255,.22);
      border-radius:22px;
      background:linear-gradient(135deg, rgba(11,14,24,.86), rgba(0,0,0,.96));
      box-shadow:0 18px 45px rgba(0,0,0,.78);
      padding:16px;
    }
    .hero img{
      width:100%;
      max-width:980px;
      margin:0 auto;
      display:block;
      border-radius:16px;
    }
    .hero-copy{
      max-width:980px;
      margin:12px auto 0;
      text-align:center;
    }
    .hero-title{
      margin:0;
      font-size:.82rem;
      text-transform:uppercase;
      letter-spacing:.28em;
      color:var(--soft);
    }
    .hero-sub{
      margin:10px 0 0;
      font-size:0.96rem;
      color:var(--muted);
      line-height:1.55;
    }
    .drop-banner{
      margin:16px auto 22px;
      max-width:820px;
      padding:10px 16px;
      border-radius:999px;
      border:1px solid rgba(215,179,106,.55);
      background:rgba(7,9,21,.72);
      text-align:center;
      font-size:.74rem;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:#e7d7b1;
      backdrop-filter:blur(10px);
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }
    @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
    .card{
      border:1px solid rgba(122,167,255,.24);
      border-radius:var(--radius);
      background:linear-gradient(135deg, rgba(11,14,24,.95), rgba(0,0,0,.98));
      padding:10px;
      cursor:pointer;
      transition:transform .15s ease,border-color .15s ease;
      position:relative;
      overflow:hidden;
      min-height:240px;
    }
    .card:hover{
      transform:translateY(-2px);
      border-color:rgba(122,167,255,.62);
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,.03), transparent 60%);
      pointer-events:none;
    }
    .meta{
      margin-top:8px;
      font-size:.72rem;
      letter-spacing:.16em;
      text-transform:uppercase;
      text-align:center;
      color:#dbe3ff;
    }
    .price{
      margin-top:4px;
      font-size:.78rem;
      color:var(--gold);
      text-align:center;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .edition{
      font-size:.65rem;
      color:var(--muted);
      text-align:center;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .placeholder{
      width:100%;
      aspect-ratio:1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      background:
        radial-gradient(circle at top, rgba(122,167,255,.18), rgba(0,0,0,0) 55%),
        radial-gradient(circle at 80% 18%, rgba(215,179,106,.12), rgba(0,0,0,0) 62%),
        linear-gradient(135deg, rgba(7,9,21,.95), rgba(0,0,0,.99));
      border:1px dashed rgba(215,179,106,.35);
      text-align:center;
      padding:16px;
    }
    .placeholder .tag{
      font-size:.7rem;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:#e7d7b1;
    }
    .placeholder .sub{
      margin-top:10px;
      font-size:.65rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
    }

    /* MODAL */
    #modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.86);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
    }
    #modal.open{display:flex}
    .modal-box{
      max-width:560px;
      width:92%;
      background:linear-gradient(135deg, rgba(11,14,24,.98), rgba(0,0,0,.98));
      border:1px solid rgba(122,167,255,.35);
      border-radius:22px;
      padding:18px;
    }
    .modal-media{width:100%;border-radius:14px;overflow:hidden}
    .modal-title{
      margin:10px 0 0;
      font-size:.9rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      text-align:center;
      font-weight:650;
      color:#e7d7b1;
    }
    .modal-sub{
      margin:8px 0 0;
      font-size:.78rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      text-align:center;
      color:var(--muted);
      line-height:1.55;
    }
    .modal-actions{margin-top:14px;display:flex;gap:10px}
    .modal-btn{
      flex:1;
      padding:10px;
      text-align:center;
      border-radius:999px;
      border:1px solid rgba(215,179,106,.55);
      background:rgba(7,9,21,.86);
      font-size:.7rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      cursor:pointer;
      user-select:none;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a href="https://houseofcauliman.com" class="back-btn">← House of Cauliman</a>

    <section class="hero">
      <img src="/collections/thelivingword/assets/THE_LIVING_WORD.webp" alt="THE LIVING WORD">
      <div class="hero-copy">
        <p class="hero-title">Free Mint • Donations Optional</p>
        <p class="hero-sub">
          Pixar-style cinematic realism.
          Museum-grade lighting.
          Emotional weight.
          Reverence first.
          This is digital scripture on XRPL.
        </p>
      </div>
    </section>

    <div class="drop-banner">Series I — The Chosen • 12 Portraits • Free Mint</div>

    <section class="grid" id="grid"></section>
  </main>

  <div id="modal">
    <div class="modal-box">
      <div class="modal-media" id="modalMedia"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-sub" id="modalSub"></div>
      <div class="modal-actions">
        <div class="modal-btn" onclick="closeModal()">Close</div>
      </div>
    </div>
  </div>

  <script>
    const SERIES = [
      { id:"lw001", name:"Jesus Christ", title:"The Savior" },
      { id:"lw002", name:"Mary", title:"The Mother" },
      { id:"lw003", name:"Joseph", title:"The Protector" },
      { id:"lw004", name:"John the Baptist", title:"The Forerunner" },
      { id:"lw005", name:"Peter", title:"The Rock" },
      { id:"lw006", name:"Paul", title:"The Apostle" },
      { id:"lw007", name:"Moses", title:"The Lawgiver" },
      { id:"lw008", name:"Abraham", title:"The Covenant Bearer" },
      { id:"lw009", name:"David", title:"The King" },
      { id:"lw010", name:"Solomon", title:"The Wise" },
      { id:"lw011", name:"Noah", title:"The Faithful" },
      { id:"lw012", name:"Elijah", title:"The Prophet" }
    ];

    const grid = document.getElementById("grid");

    SERIES.forEach((c, idx) => {
      const num = String(idx + 1).padStart(3, "0");
      grid.insertAdjacentHTML("beforeend", `
        <div class="card" onclick="openModal(${idx})">
          ${placeholderHTML(num, c)}
          <div class="meta">THE LIVING WORD — ${c.id.toUpperCase()}</div>
          <div class="price">FREE MINT • DONATION OPTIONAL</div>
          <div class="edition">Series I — The Chosen</div>
        </div>
      `);
    });

    function placeholderHTML(num, c){
      return `
        <div class="placeholder">
          <div>
            <div class="tag">IN PRODUCTION</div>
            <div class="sub">${num} — ${escapeHTML(c.name)} • ${escapeHTML(c.title)}</div>
          </div>
        </div>
      `;
    }

    function openModal(i){
      const c = SERIES[i];
      const num = String(i + 1).padStart(3, "0");
      document.getElementById("modalTitle").innerText = `${num} — ${c.name}`;
      document.getElementById("modalSub").innerText = `${c.title} • Free Mint • Donations Optional in $XRP • Claim Portal Coming Soon`;
      document.getElementById("modalMedia").innerHTML = placeholderHTML(num, c);
      document.getElementById("modal").classList.add("open");
    }

    function closeModal(){
      document.getElementById("modal").classList.remove("open");
    }

    document.getElementById("modal").onclick = e => {
      if(e.target.id === "modal") closeModal();
    };

    function escapeHTML(str){
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[s]));
    }
  </script>
</body>
</html>
