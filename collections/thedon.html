<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE DON — House of Cauliman</title>
<meta name="description" content="THE DON Icon moments. Pixar-style collectibles. History, meme, and culture on XRPL. Early access. Limited supply. Pure collectible energy.">
<meta property="og:title" content="THE DON — House of Cauliman">
<meta property="og:description" content="THE DON Icon moments. Pixar-style collectibles. History, meme, and culture on XRPL. Early access. Limited supply. Pure collectible energy.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://houseofcauliman.com/collections/thedon.html">
<meta property="og:image" content="https://houseofcauliman.com/collections/thedon/assets/THE_DON_XRPL.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="canonical" href="https://houseofcauliman.com/collections/thedon.html">
<style>
:root{
  --bg:#050509;
  --border:#151827;
  --text:#f8fafc;
  --muted:#b6bfd6;
  --accent:#dc2626; /* Don red */
  --accent2:#2563eb; /* Don blue */
  --radius:18px;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:radial-gradient(circle at top,rgba(37,99,235,.35) 0,#050308 55%,#000 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 80px}
.back-btn{
  display:inline-block;
  margin-bottom:14px;
  font-size:.7rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(220,38,38,.55);
  background:rgba(2,6,23,.75);
}
.hero img{
  width:100%;
  max-width:980px;
  margin:0 auto 10px;
  display:block;
}
.drop-banner{
  margin:6px auto 22px;
  max-width:620px;
  padding:8px 16px;
  border-radius:999px;
  border:1px solid rgba(220,38,38,.6);
  text-align:center;
  font-size:.75rem;
  letter-spacing:.28em;
  text-transform:uppercase;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{
  border:1px solid rgba(220,38,38,.30);
  border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(15,23,42,.92),rgba(5,3,2,.99));
  padding:10px;
  cursor:pointer;
  transition:transform .15s ease,border-color .15s ease;
  position:relative;
  overflow:hidden;
}
.card:hover{
  transform:translateY(-2px);
  border-color:rgba(220,38,38,.9);
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.03), transparent 60%);
  pointer-events:none;
}
.meta{
  margin-top:8px;
  font-size:.75rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  text-align:center;
}
.price{
  margin-top:4px;
  font-size:.8rem;
  color:rgba(248,113,113,.95);
  text-align:center;
}
.edition{
  font-size:.65rem;
  color:var(--muted);
  text-align:center;
}

/* MEDIA */
.thumb{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(220,38,38,.25);
  background:
    radial-gradient(circle at top, rgba(37,99,235,.22), rgba(0,0,0,0) 55%),
    linear-gradient(135deg, rgba(2,6,23,.86), rgba(5,3,2,.99));
}
.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

/* Placeholder */
.placeholder{
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:
    radial-gradient(circle at top, rgba(37,99,235,.22), rgba(0,0,0,0) 55%),
    linear-gradient(135deg, rgba(2,6,23,.86), rgba(5,3,2,.99));
  border:1px dashed rgba(220,38,38,.45);
  text-align:center;
  padding:16px;
}
.placeholder .tag{
  font-size:.7rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:#e2e8f0;
}
.placeholder .sub{
  margin-top:10px;
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
#modal.open{display:flex}
.modal-box{
  max-width:520px;
  width:90%;
  background:#050509;
  border:1px solid rgba(37,99,235,.28);
  border-radius:22px;
  padding:18px;
}
.modal-media{
  width:100%;
  border-radius:14px;
  overflow:hidden;
  border:1px solid rgba(220,38,38,.25);
  background:
    radial-gradient(circle at top, rgba(37,99,235,.16), rgba(0,0,0,0) 55%),
    linear-gradient(135deg, rgba(2,6,23,.86), rgba(5,3,2,.99));
}
.modal-media img{
  width:100%;
  height:auto;
  display:block;
}
.modal-title{
  margin:10px 0 6px;
  font-size:.9rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-align:center;
  font-weight:600;
}
.modal-actions{
  margin-top:14px;
  display:flex;
  gap:10px;
}
.modal-btn{
  flex:1;
  padding:10px;
  text-align:center;
  border-radius:999px;
  border:1px solid rgba(220,38,38,.6);
  background:#120b05;
  font-size:.7rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  cursor:pointer;
}

.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.phLogo{width:78%;max-width:260px;opacity:.22;filter:saturate(1.1) contrast(1.05);object-fit:contain}
.phText{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.phTop{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:rgba(226,232,240,.9)}
.phBottom{font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(248,113,113,.95)}

.collection-desc{
  max-width:980px;
  margin:14px auto 10px;
  padding:0 16px;
  color:var(--muted);
  font-size:14px;
  line-height:1.55;
  letter-spacing:.02em;
}
@media(min-width:720px){
  .collection-desc{font-size:15px;text-align:center}
}
</style>
</head>
<body>
<main class="wrap">
<a href="https://houseofcauliman.com" class="back-btn">← House of Cauliman</a>

<section class="hero">
  <img src="/collections/thedon/assets/THE_DON_XRPL.webp" alt="THE DON">
</section>

<div class="drop-banner" style="border-color:rgba(212,164,74,.6);color:#e2e8f0;">
  ICON SERIES — THE DON
</div>

<div class="collection-desc">
  THE DON Icon moments. Pixar-style collectibles. History, meme, and culture on XRPL.<br>
  Early access. Limited supply. Pure collectible energy.
</div>

<section class="grid" id="grid"></section>
</main>

<div id="modal">
  <div class="modal-box">
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-actions">
      <div class="modal-btn" onclick="closeModal()">Close</div>
    </div>
  </div>
</div>

<script>
const TOTAL = 32;
const grid = document.getElementById("grid");

/* Assets present (not released yet) */
const LIVE = {
  "001": { webp: "/collections/thedon/assets/td001.webp", png: "/collections/thedon/assets/td001.png" },
  "002": { webp: "/collections/thedon/assets/td002.webp", png: "/collections/thedon/assets/td002.png" },
  "003": { webp: "/collections/thedon/assets/td003.webp", png: "/collections/thedon/assets/td003.png" }
};

for(let i=1;i<=TOTAL;i++){
  const num = String(i).padStart(3,"0");
  const hasArt = !!LIVE[num];

  grid.insertAdjacentHTML("beforeend",`
    <div class="card" onclick="openModal('${num}')">
      ${hasArt ? artThumbHTML(num) : placeholderHTML(num)}
      <div class="meta">THE DON — TD${num}</div>
      <div class="price">DROPPING SOON</div>
      <div class="edition">${hasArt ? "Preview" : "Unrevealed"}</div>
    </div>
  `);
}

function artThumbHTML(num){
  const src = LIVE[num].webp;
  return `
    <div class="thumb">
      <img src="${src}" alt="THE DON TD${num}">
    </div>
  `;
}

function placeholderHTML(num){
  return `
    <div class="ph">
      <img class="phLogo" src="/collections/thedon/assets/THE_DON.webp" alt="THE DON">
      <div class="phText">
        <div class="phTop">UNREVEALED</div>
        <div class="phBottom">TD${num}</div>
      </div>
    </div>
  `;
}

function openModal(num){
  document.getElementById("modalTitle").innerText = `THE DON — TD${num}`;

  if(LIVE[num]){
    const src = LIVE[num].png || LIVE[num].webp;
    document.getElementById("modalMedia").innerHTML = `<img src="${src}" alt="THE DON TD${num}">`;
  } else {
    document.getElementById("modalMedia").innerHTML = placeholderHTML(num);
  }

  document.getElementById("modal").classList.add("open");
}

function closeModal(){
  document.getElementById("modal").classList.remove("open");
}

document.getElementById("modal").onclick = e=>{
  if(e.target.id==="modal") closeModal();
};
</script>
</body>
</html>
