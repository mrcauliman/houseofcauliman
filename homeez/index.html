<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HOMEEZ</title>
  <meta name="description" content="HOMEEZ digital capsule machine. Loading soon." />
  <link rel="canonical" href="https://houseofcauliman.com/homeez/" />

  <meta property="og:title" content="HOMEEZ" />
  <meta property="og:description" content="Digital capsule machine loading soon." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://houseofcauliman.com/homeez/" />
  <meta property="og:image" content="https://houseofcauliman.com/collections/homeez/assets/homeez_logo.webp" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HOMEEZ" />
  <meta name="twitter:description" content="Digital capsule machine loading soon." />
  <meta name="twitter:image" content="https://houseofcauliman.com/collections/homeez/assets/homeez_logo.webp" />

  <style>
    :root{
      --bg:#05070b;
      --bg2:#0b1020;
      --panel:#0d1322;
      --line:rgba(255,255,255,.08);
      --text:#f5f7fb;
      --muted:#a8b7d6;
      --blue:#5aa9ff;
      --cyan:#74e0ff;
      --pink:#ff6ccf;
      --green:#72f6b0;
      --gold:#ffd76a;
      --shadow:0 24px 80px rgba(0,0,0,.45);
      --max:1180px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(90,169,255,.15), transparent 34%),
        radial-gradient(circle at top right, rgba(255,108,207,.10), transparent 28%),
        radial-gradient(circle at bottom center, rgba(116,224,255,.08), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }

    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    .wrap{width:min(calc(100% - 28px), var(--max));margin:0 auto}

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(14px);
      background:rgba(5,7,11,.72);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      width:min(calc(100% - 28px), var(--max));
      margin:0 auto;
      min-height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .brand-mark{
      width:40px;
      height:40px;
      border-radius:12px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 36%),
        linear-gradient(135deg, rgba(90,169,255,.28), rgba(255,108,207,.18));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 12px 32px rgba(0,0,0,.35);
    }
    .top-links{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      color:#d8e5ff;
      background:rgba(255,255,255,.03);
      font-weight:800;
      font-size:14px;
    }
    .pill:hover{border-color:rgba(255,255,255,.18)}

    .hero{
      padding:56px 0 40px;
    }
    .hero-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:28px;
      align-items:center;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(116,224,255,.22);
      color:#cbefff;
      background:rgba(116,224,255,.08);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    h1{
      margin:16px 0 10px;
      font-size:clamp(40px,6vw,76px);
      line-height:.95;
      letter-spacing:-.04em;
    }
    .sub{
      margin:0;
      font-size:18px;
      line-height:1.6;
      color:var(--muted);
      max-width:560px;
    }
    .cta-row{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:26px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 18px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:.02em;
      border:1px solid var(--line);
    }
    .btn-secondary{
      background:rgba(255,255,255,.04);
      color:var(--text);
    }
    .btn-disabled{
      background:linear-gradient(135deg, rgba(116,224,255,.22), rgba(90,169,255,.12));
      color:#d9f4ff;
      border:1px solid rgba(116,224,255,.18);
      cursor:not-allowed;
      opacity:.95;
      pointer-events:none;
    }

    .machine-shell{
      position:relative;
      border:1px solid rgba(255,255,255,.1);
      border-radius:32px;
      padding:22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)),
        linear-gradient(180deg, #111a2f, #0a1222);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .machine-shell:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.16), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255,108,207,.14), transparent 32%);
      pointer-events:none;
    }
    .machine-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
      gap:10px;
      flex-wrap:wrap;
    }
    .status{
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#d8e8ff;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.04);
    }
    .glass{
      position:relative;
      height:360px;
      border-radius:28px 28px 20px 20px;
      border:1px solid rgba(255,255,255,.14);
      background:
        linear-gradient(180deg, rgba(116,224,255,.10), rgba(255,255,255,.02)),
        radial-gradient(circle at 50% 8%, rgba(255,255,255,.2), transparent 22%);
      overflow:hidden;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    }
    .capsule{
      position:absolute;
      width:70px;
      height:70px;
      border-radius:50%;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 24px rgba(0,0,0,.25);
    }
    .capsule:before,
    .capsule:after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      height:50%;
    }
    .capsule:before{
      top:0;
      border-radius:999px 999px 0 0;
      background:rgba(255,255,255,.16);
    }
    .capsule:after{
      bottom:0;
      border-radius:0 0 999px 999px;
      background:rgba(0,0,0,.14);
    }

    .c1{left:10%;top:18%;background:linear-gradient(180deg,#74e0ff,#2e88ff)}
    .c2{left:28%;top:12%;background:linear-gradient(180deg,#ff8be0,#ff5cba)}
    .c3{left:48%;top:20%;background:linear-gradient(180deg,#ffd76a,#ffb100)}
    .c4{left:66%;top:15%;background:linear-gradient(180deg,#72f6b0,#1fcf82)}
    .c5{left:18%;top:42%;background:linear-gradient(180deg,#ffd76a,#ff7b00)}
    .c6{left:40%;top:41%;background:linear-gradient(180deg,#c998ff,#7d5cff)}
    .c7{left:62%;top:42%;background:linear-gradient(180deg,#74e0ff,#00c2a9)}
    .c8{left:32%;top:63%;background:linear-gradient(180deg,#ff8be0,#ff5c7d)}
    .c9{left:56%;top:65%;background:linear-gradient(180deg,#d6ff7d,#8bdc2a)}
    .c10{left:8%;top:66%;background:linear-gradient(180deg,#90b7ff,#4667ff)}

    .machine-base{
      margin-top:16px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:16px;
      align-items:end;
    }
    .chute{
      height:90px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.1);
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)),
        #0b101c;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#dbe8ff;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .handle-wrap{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
    }
    .handle{
      width:90px;
      height:90px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(circle at 35% 35%, rgba(255,255,255,.2), transparent 30%),
        linear-gradient(180deg, #23314f, #131d31);
      position:relative;
      box-shadow:0 14px 34px rgba(0,0,0,.34);
    }
    .handle:before{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:14px;
      height:14px;
      border-radius:50%;
      transform:translate(-50%,-50%);
      background:#eff6ff;
      box-shadow:0 0 0 10px rgba(255,255,255,.06);
    }
    .handle:after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:6px;
      height:34px;
      border-radius:999px;
      background:linear-gradient(180deg, #dbe8ff, #90a8d6);
      transform:translate(-50%,-90%) rotate(28deg);
      transform-origin:center 28px;
    }

    .footer{
      padding:28px 0 48px;
      color:var(--muted);
    }
    .footer-box{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:14px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }

    @media (max-width:980px){
      .hero-grid{grid-template-columns:1fr}
      .machine-base{grid-template-columns:1fr}
      .handle-wrap{align-items:flex-start}
    }

    @media (max-width:640px){
      .topbar-inner{
        padding:8px 0;
        align-items:flex-start;
        flex-direction:column;
      }
      .top-links{
        width:100%;
        overflow:auto;
        flex-wrap:nowrap;
        padding-bottom:2px;
      }
      .pill{white-space:nowrap}
      .hero{padding:42px 0 28px}
      .sub{font-size:16px}
      .glass{height:310px}
      .capsule{width:60px;height:60px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://houseofcauliman.com/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>HOMEEZ</span>
      </a>
      <nav class="top-links" aria-label="Page navigation">
        <a class="pill" href="https://houseofcauliman.com/">House</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <div class="eyebrow">Capsule Toy Universe</div>
          <h1>HOMEEZ</h1>
          <p class="sub">Digital gumball machine loading soon.</p>
          <div class="cta-row">
            <span class="btn btn-disabled">Machine Not Live Yet</span>
            <a class="btn btn-secondary" href="https://houseofcauliman.com/">Back to House</a>
          </div>
        </div>

        <div class="machine-shell">
          <div class="machine-top">
            <div class="status">Founding Machine</div>
            <div class="status">Loading Soon</div>
          </div>

          <div class="glass" aria-hidden="true">
            <div class="capsule c1"></div>
            <div class="capsule c2"></div>
            <div class="capsule c3"></div>
            <div class="capsule c4"></div>
            <div class="capsule c5"></div>
            <div class="capsule c6"></div>
            <div class="capsule c7"></div>
            <div class="capsule c8"></div>
            <div class="capsule c9"></div>
            <div class="capsule c10"></div>
          </div>

          <div class="machine-base">
            <div class="chute">Capsule Output</div>
            <div class="handle-wrap">
              <div class="handle" aria-hidden="true"></div>
              <div class="status">Stand By</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-box">
      <div>HOMEEZ • House of Cauliman</div>
      <div><a href="https://houseofcauliman.com/">houseofcauliman.com</a></div>
    </div>
  </footer>
</body>
</html>
