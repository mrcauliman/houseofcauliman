<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HOMEEZ Capsule Machine</title>
  <meta name="description" content="HOMEEZ Capsule Machine." />
  <link rel="canonical" href="https://houseofcauliman.com/homeez/" />

  <meta property="og:title" content="HOMEEZ Capsule Machine" />
  <meta property="og:description" content="HOMEEZ Capsule Machine." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://houseofcauliman.com/homeez/" />
  <meta property="og:image" content="https://houseofcauliman.com/homeez/assets/homeez_capsule_machine.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HOMEEZ Capsule Machine" />
  <meta name="twitter:description" content="HOMEEZ Capsule Machine." />
  <meta name="twitter:image" content="https://houseofcauliman.com/homeez/assets/homeez_capsule_machine.png" />

  <style>
    :root{
      --bg:#080b12;
      --bg2:#0d1320;
      --text:#f5f7fb;
      --muted:#a4b0c7;
      --line:rgba(255,255,255,.08);
      --gold1:#ffd86e;
      --gold2:#d69210;
      --max:1220px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(84,132,255,.10), transparent 32%),
        radial-gradient(circle at top right, rgba(255,72,72,.08), transparent 26%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }

    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}

    .wrap{
      width:min(calc(100% - 28px), var(--max));
      margin:0 auto;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(14px);
      background:rgba(8,11,18,.74);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(calc(100% - 28px), var(--max));
      margin:0 auto;
      min-height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      letter-spacing:.08em;
    }

    .brand-mark{
      width:40px;
      height:40px;
      border-radius:12px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 36%),
        linear-gradient(135deg, rgba(239,63,71,.28), rgba(255,216,110,.18));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 12px 32px rgba(0,0,0,.35);
    }

    .top-links{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      color:#d8e5ff;
      background:rgba(255,255,255,.03);
      font-weight:800;
      font-size:14px;
    }

    .hero{
      padding:34px 0 54px;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:minmax(320px,470px) 1fr;
      gap:34px;
      align-items:center;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,216,110,.22);
      color:#ffe8a7;
      background:rgba(255,216,110,.08);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    h1{
      margin:16px 0 10px;
      font-size:clamp(42px,6vw,84px);
      line-height:.94;
      letter-spacing:-.05em;
    }

    .sub{
      margin:0;
      font-size:18px;
      line-height:1.6;
      color:var(--muted);
      max-width:520px;
    }

    .cta-row{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:24px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 18px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:.02em;
      border:1px solid var(--line);
    }

    .btn-secondary{
      background:rgba(255,255,255,.04);
      color:var(--text);
    }

    .btn-machine{
      background:linear-gradient(180deg, rgba(255,216,110,.22), rgba(214,146,16,.10));
      border:1px solid rgba(255,216,110,.24);
      color:#ffefbf;
      pointer-events:none;
      cursor:not-allowed;
    }

    .status-row{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:0 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#eef5ff;
    }

    .status.gold{
      background:rgba(255,216,110,.10);
      border-color:rgba(255,216,110,.22);
      color:#ffeeb9;
    }

    .machine-stage{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .machine-render{
      width:min(100%, 620px);
      height:auto;
      display:block;
      filter:drop-shadow(0 28px 50px rgba(0,0,0,.38));
    }

    .footer{
      padding:20px 0 46px;
      color:var(--muted);
    }

    .footer-box{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:14px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }

    @media (max-width:980px){
      .hero-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width:640px){
      .topbar-inner{
        padding:8px 0;
        align-items:flex-start;
        flex-direction:column;
      }

      .top-links{
        width:100%;
        overflow:auto;
        flex-wrap:nowrap;
        padding-bottom:2px;
      }

      .pill{
        white-space:nowrap;
      }

      .hero{
        padding:30px 0 42px;
      }

      .sub{
        font-size:16px;
      }

      .machine-render{
        width:min(100%, 460px);
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://houseofcauliman.com/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>HOMEEZ</span>
      </a>
      <nav class="top-links" aria-label="Page navigation">
        <a class="pill" href="https://houseofcauliman.com/">House</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <div class="eyebrow">Active Build</div>
          <h1>HOMEEZ Capsule Machine</h1>
          <p class="sub">The HOMEEZ Capsule Machine is being built now. The machine is live on the page. Spin logic comes next.</p>
          <div class="cta-row">
            <span class="btn btn-machine">Machine Not Live Yet</span>
            <a class="btn btn-secondary" href="https://houseofcauliman.com/">Back to House</a>
          </div>
          <div class="status-row">
            <span class="status gold">Founding Machine</span>
            <span class="status">Stand By</span>
          </div>
        </div>

        <div class="machine-stage">
          <img
            src="/homeez/assets/homeez_capsule_machine.png"
            alt="HOMEEZ Capsule Machine"
            class="machine-render"
          >
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-box">
      <div>HOMEEZ • House of Cauliman</div>
      <div><a href="https://houseofcauliman.com/">houseofcauliman.com</a></div>
    </div>
  </footer>
</body>
</html>
