<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HOMEEZ</title>
  <meta name="description" content="HOMEEZ digital gumball machine." />
  <link rel="canonical" href="https://houseofcauliman.com/homeez/" />

  <meta property="og:title" content="HOMEEZ" />
  <meta property="og:description" content="HOMEEZ digital gumball machine." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://houseofcauliman.com/homeez/" />
  <meta property="og:image" content="https://houseofcauliman.com/collections/homeez/assets/homeez_logo.webp" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HOMEEZ" />
  <meta name="twitter:description" content="HOMEEZ digital gumball machine." />
  <meta name="twitter:image" content="https://houseofcauliman.com/collections/homeez/assets/homeez_logo.webp" />

  <style>
    :root{
      --bg:#080b12;
      --bg2:#0d1320;
      --text:#f5f7fb;
      --muted:#a4b0c7;
      --line:rgba(255,255,255,.08);
      --red1:#ef3f47;
      --red2:#c51b24;
      --red3:#7d0c15;
      --chrome1:#f3f6fb;
      --chrome2:#b6c0d1;
      --chrome3:#6a7488;
      --chrome4:#2c3444;
      --glass1:rgba(190,227,255,.22);
      --glass2:rgba(255,255,255,.07);
      --gold1:#ffd86e;
      --gold2:#d69210;
      --shadow:0 28px 80px rgba(0,0,0,.48);
      --max:1220px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(84,132,255,.10), transparent 32%),
        radial-gradient(circle at top right, rgba(255,72,72,.08), transparent 26%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }

    a{text-decoration:none;color:inherit}
    .wrap{width:min(calc(100% - 28px), var(--max));margin:0 auto}

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(14px);
      background:rgba(8,11,18,.74);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      width:min(calc(100% - 28px), var(--max));
      margin:0 auto;
      min-height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .brand-mark{
      width:40px;
      height:40px;
      border-radius:12px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 36%),
        linear-gradient(135deg, rgba(239,63,71,.28), rgba(255,216,110,.18));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 12px 32px rgba(0,0,0,.35);
    }
    .top-links{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      color:#d8e5ff;
      background:rgba(255,255,255,.03);
      font-weight:800;
      font-size:14px;
    }

    .hero{
      padding:34px 0 54px;
    }
    .hero-grid{
      display:grid;
      grid-template-columns:minmax(320px,470px) 1fr;
      gap:34px;
      align-items:center;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,216,110,.22);
      color:#ffe8a7;
      background:rgba(255,216,110,.08);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    h1{
      margin:16px 0 10px;
      font-size:clamp(42px,6vw,84px);
      line-height:.94;
      letter-spacing:-.05em;
    }
    .sub{
      margin:0;
      font-size:18px;
      line-height:1.6;
      color:var(--muted);
      max-width:520px;
    }
    .cta-row{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:24px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 18px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:.02em;
      border:1px solid var(--line);
    }
    .btn-secondary{
      background:rgba(255,255,255,.04);
      color:var(--text);
    }
    .btn-machine{
      background:linear-gradient(180deg, rgba(255,216,110,.22), rgba(214,146,16,.10));
      border:1px solid rgba(255,216,110,.24);
      color:#ffefbf;
      pointer-events:none;
      cursor:not-allowed;
    }

    .machine-stage{
      display:flex;
      justify-content:center;
      align-items:flex-end;
    }
    .machine{
      width:min(100%, 540px);
      position:relative;
      filter:drop-shadow(0 34px 70px rgba(0,0,0,.42));
    }

    .lid{
      width:58%;
      height:42px;
      margin:0 auto -6px;
      border-radius:18px 18px 10px 10px;
      background:
        linear-gradient(180deg, #ff8187 0%, var(--red1) 16%, var(--red2) 68%, var(--red3) 100%);
      border:2px solid rgba(255,255,255,.16);
      box-shadow:
        inset 0 6px 10px rgba(255,255,255,.16),
        inset 0 -10px 16px rgba(0,0,0,.20);
      position:relative;
      z-index:5;
    }

    .globe{
      position:relative;
      width:100%;
      aspect-ratio:1 / 1;
      border-radius:50%;
      overflow:hidden;
      background:
        radial-gradient(circle at 26% 20%, rgba(255,255,255,.62) 0%, rgba(255,255,255,.22) 8%, rgba(255,255,255,.06) 18%, transparent 26%),
        radial-gradient(circle at 46% 14%, rgba(255,255,255,.18), transparent 36%),
        radial-gradient(circle at 50% 58%, rgba(175,223,255,.16), rgba(175,223,255,.05) 56%, rgba(255,255,255,.02) 78%, rgba(255,255,255,.01) 100%);
      border:3px solid rgba(235,245,255,.32);
      box-shadow:
        inset 0 0 0 8px rgba(255,255,255,.025),
        inset -18px -30px 70px rgba(0,0,0,.14),
        inset 18px 18px 46px rgba(255,255,255,.04),
        0 18px 40px rgba(0,0,0,.18);
      z-index:4;
    }

    .gumballs{
      position:absolute;
      inset:10% 9% 12% 9%;
      border-radius:50%;
    }
    .gumball{
      position:absolute;
      width:64px;
      height:64px;
      border-radius:50%;
      box-shadow:
        inset 0 5px 10px rgba(255,255,255,.26),
        inset 0 -9px 14px rgba(0,0,0,.18),
        0 7px 14px rgba(0,0,0,.14);
    }
    .gumball:before{
      content:"";
      position:absolute;
      width:20px;
      height:12px;
      left:11px;
      top:11px;
      border-radius:50%;
      background:rgba(255,255,255,.30);
      transform:rotate(-18deg);
    }

    .g1{left:8%;top:18%;background:linear-gradient(180deg,#7ad5ff,#297dff)}
    .g2{left:24%;top:11%;background:linear-gradient(180deg,#ff93bd,#db285e)}
    .g3{left:41%;top:17%;background:linear-gradient(180deg,#ffe47f,#f0a90a)}
    .g4{left:58%;top:12%;background:linear-gradient(180deg,#8ef3a4,#23b24a)}
    .g5{left:73%;top:20%;background:linear-gradient(180deg,#d59bff,#7f43d7)}
    .g6{left:16%;top:38%;background:linear-gradient(180deg,#ffba7a,#ef6f10)}
    .g7{left:33%;top:33%;background:linear-gradient(180deg,#86f7f3,#00a9b0)}
    .g8{left:50%;top:36%;background:linear-gradient(180deg,#ff8fe7,#ff4db2)}
    .g9{left:67%;top:38%;background:linear-gradient(180deg,#dfff81,#93c91d)}
    .g10{left:25%;top:55%;background:linear-gradient(180deg,#9ab8ff,#4050dd)}
    .g11{left:44%;top:57%;background:linear-gradient(180deg,#ffd878,#dd8a00)}
    .g12{left:61%;top:57%;background:linear-gradient(180deg,#ff9292,#d4293b)}

    .chrome-collar{
      width:66%;
      height:34px;
      margin:-10px auto 0;
      border-radius:999px;
      background:
        linear-gradient(180deg, var(--chrome1) 0%, var(--chrome2) 22%, var(--chrome3) 55%, var(--chrome1) 76%, var(--chrome4) 100%);
      border:2px solid rgba(255,255,255,.18);
      box-shadow:
        inset 0 3px 6px rgba(255,255,255,.30),
        inset 0 -5px 8px rgba(0,0,0,.18);
      position:relative;
      z-index:5;
    }

    .body{
      width:58%;
      margin:0 auto;
      padding:22px 18px 18px;
      border-radius:24px 24px 20px 20px;
      background:
        linear-gradient(180deg, #ff7c82 0%, var(--red1) 12%, var(--red2) 60%, var(--red3) 100%);
      border:2px solid rgba(255,255,255,.15);
      box-shadow:
        inset 0 10px 14px rgba(255,255,255,.14),
        inset 0 -20px 26px rgba(0,0,0,.22);
      position:relative;
      z-index:3;
    }

    .brand-plate{
      width:100%;
      margin:0 auto 18px;
      padding:14px 14px;
      border-radius:16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.95), rgba(222,229,238,.92));
      color:#c41928;
      border:2px solid rgba(255,255,255,.36);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.8),
        0 10px 18px rgba(0,0,0,.16);
      text-align:center;
    }
    .brand-plate .mini{
      display:block;
      font-size:10px;
      font-weight:900;
      letter-spacing:.18em;
      color:#8b96a8;
      text-transform:uppercase;
      margin-bottom:4px;
    }
    .brand-plate .main{
      display:block;
      font-size:28px;
      line-height:1;
      font-weight:1000;
      letter-spacing:-.05em;
    }

    .hardware{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
      justify-items:center;
    }

    .coin-plate{
      width:114px;
      height:88px;
      border-radius:18px;
      background:
        linear-gradient(180deg, var(--chrome1) 0%, var(--chrome2) 18%, var(--chrome3) 52%, var(--chrome1) 76%, var(--chrome4) 100%);
      border:2px solid rgba(255,255,255,.24);
      box-shadow:
        inset 0 4px 8px rgba(255,255,255,.28),
        inset 0 -6px 10px rgba(0,0,0,.18);
      position:relative;
    }
    .coin-slot{
      position:absolute;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      width:46px;
      height:8px;
      border-radius:999px;
      background:linear-gradient(180deg,#59657a,#212837);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }
    .turn-handle{
      position:absolute;
      left:50%;
      top:52px;
      transform:translateX(-50%);
      width:68px;
      height:18px;
      border-radius:999px;
      background:
        linear-gradient(180deg, var(--chrome1), var(--chrome2) 35%, var(--chrome4));
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.22),
        0 4px 8px rgba(0,0,0,.16);
    }
    .turn-handle:before{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:14px;
      height:40px;
      border-radius:999px;
      background:
        linear-gradient(180deg, var(--chrome1), var(--chrome2) 40%, var(--chrome4));
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.22),
        0 4px 8px rgba(0,0,0,.16);
    }

    .dispense-door{
      width:140px;
      height:76px;
      border-radius:18px 18px 22px 22px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.06)),
        linear-gradient(180deg, #b7c0d0, #69758b);
      border:2px solid rgba(255,255,255,.22);
      box-shadow:
        inset 0 8px 12px rgba(255,255,255,.18),
        inset 0 -10px 16px rgba(0,0,0,.20);
      position:relative;
      overflow:hidden;
    }
    .dispense-door:before{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      top:12px;
      bottom:14px;
      border-radius:12px 12px 14px 14px;
      background:linear-gradient(180deg,#161d29,#090d14);
      box-shadow:inset 0 3px 8px rgba(255,255,255,.05);
    }
    .dispense-ball{
      position:absolute;
      right:18px;
      bottom:14px;
      width:34px;
      height:34px;
      border-radius:50%;
      background:linear-gradient(180deg,#7ad5ff,#297dff);
      box-shadow:
        inset 0 4px 7px rgba(255,255,255,.24),
        inset 0 -5px 7px rgba(0,0,0,.18),
        0 4px 8px rgba(0,0,0,.16);
      z-index:2;
    }

    .post{
      width:18%;
      height:110px;
      margin:0 auto;
      background:
        linear-gradient(180deg, var(--chrome1) 0%, var(--chrome2) 18%, var(--chrome3) 52%, var(--chrome1) 76%, var(--chrome4) 100%);
      border:2px solid rgba(255,255,255,.22);
      border-top:none;
      box-shadow:
        inset 0 6px 10px rgba(255,255,255,.22),
        inset 0 -10px 16px rgba(0,0,0,.16);
      position:relative;
      top:-2px;
      z-index:2;
    }

    .base{
      width:54%;
      height:34px;
      margin:0 auto;
      border-radius:999px;
      background:
        linear-gradient(180deg, var(--chrome1) 0%, var(--chrome2) 18%, var(--chrome3) 52%, var(--chrome1) 76%, var(--chrome4) 100%);
      border:2px solid rgba(255,255,255,.22);
      box-shadow:
        inset 0 4px 8px rgba(255,255,255,.24),
        inset 0 -8px 12px rgba(0,0,0,.18);
      position:relative;
      top:-4px;
      z-index:1;
    }

    .base-shadow{
      width:60%;
      height:18px;
      margin:10px auto 0;
      border-radius:999px;
      background:rgba(0,0,0,.32);
      filter:blur(8px);
    }

    .status-row{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:0 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#eef5ff;
    }
    .status.gold{
      background:rgba(255,216,110,.10);
      border-color:rgba(255,216,110,.22);
      color:#ffeeb9;
    }

    .footer{
      padding:20px 0 46px;
      color:var(--muted);
    }
    .footer-box{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:14px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }

    @media (max-width:980px){
      .hero-grid{grid-template-columns:1fr}
      .machine{max-width:500px}
    }

    @media (max-width:640px){
      .topbar-inner{
        padding:8px 0;
        align-items:flex-start;
        flex-direction:column;
      }
      .top-links{
        width:100%;
        overflow:auto;
        flex-wrap:nowrap;
        padding-bottom:2px;
      }
      .pill{white-space:nowrap}
      .hero{padding:30px 0 42px}
      .sub{font-size:16px}
      .machine{max-width:420px}
      .gumball{width:50px;height:50px}
      .coin-plate{width:100px;height:78px}
      .turn-handle{top:46px}
      .dispense-door{width:124px;height:68px}
      .post{height:92px}
      .body{width:64%}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://houseofcauliman.com/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>HOMEEZ</span>
      </a>
      <nav class="top-links" aria-label="Page navigation">
        <a class="pill" href="https://houseofcauliman.com/">House</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <div class="eyebrow">Active Build</div>
          <h1>HOMEEZ</h1>
          <p class="sub">The machine is being rebuilt with a real gumball machine silhouette. Spin logic comes after the hardware looks right.</p>
          <div class="cta-row">
            <span class="btn btn-machine">Machine Not Live Yet</span>
            <a class="btn btn-secondary" href="https://houseofcauliman.com/">Back to House</a>
          </div>
          <div class="status-row">
            <span class="status gold">Founding Machine</span>
            <span class="status">Stand By</span>
          </div>
        </div>

        <div class="machine-stage">
          <div class="machine" aria-label="HOMEEZ digital gumball machine">
            <div class="lid"></div>

            <div class="globe">
              <div class="gumballs">
                <div class="gumball g1"></div>
                <div class="gumball g2"></div>
                <div class="gumball g3"></div>
                <div class="gumball g4"></div>
                <div class="gumball g5"></div>
                <div class="gumball g6"></div>
                <div class="gumball g7"></div>
                <div class="gumball g8"></div>
                <div class="gumball g9"></div>
                <div class="gumball g10"></div>
                <div class="gumball g11"></div>
                <div class="gumball g12"></div>
              </div>
            </div>

            <div class="chrome-collar"></div>

            <div class="body">
              <div class="brand-plate">
                <span class="mini">House of Cauliman</span>
                <span class="main">HOMEEZ</span>
              </div>

              <div class="hardware">
                <div class="coin-plate">
                  <div class="coin-slot"></div>
                  <div class="turn-handle"></div>
                </div>

                <div class="dispense-door">
                  <div class="dispense-ball"></div>
                </div>
              </div>
            </div>

            <div class="post"></div>
            <div class="base"></div>
            <div class="base-shadow"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-box">
      <div>HOMEEZ • House of Cauliman</div>
      <div><a href="https://houseofcauliman.com/">houseofcauliman.com</a></div>
    </div>
  </footer>
</body>
</html>
