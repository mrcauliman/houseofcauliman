<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HOMEEZ</title>
  <meta name="description" content="HOMEEZ digital gumball machine." />
  <link rel="canonical" href="https://houseofcauliman.com/homeez/" />

  <meta property="og:title" content="HOMEEZ" />
  <meta property="og:description" content="HOMEEZ digital gumball machine." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://houseofcauliman.com/homeez/" />
  <meta property="og:image" content="https://houseofcauliman.com/collections/homeez/assets/homeez_logo.webp" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HOMEEZ" />
  <meta name="twitter:description" content="HOMEEZ digital gumball machine." />
  <meta name="twitter:image" content="https://houseofcauliman.com/collections/homeez/assets/homeez_logo.webp" />

  <style>
    :root{
      --bg:#07090f;
      --bg2:#0d1220;
      --panel:#101725;
      --line:rgba(255,255,255,.08);
      --text:#f6f8fc;
      --muted:#9eacc7;
      --glass1:rgba(173,224,255,.18);
      --glass2:rgba(255,255,255,.05);
      --metal1:#dfe6ef;
      --metal2:#a8b4c7;
      --metal3:#66738b;
      --red1:#ff4c59;
      --red2:#c91929;
      --red3:#7f0d19;
      --gold1:#ffd66a;
      --gold2:#f2ad1b;
      --gold3:#996307;
      --shadow:0 28px 80px rgba(0,0,0,.45);
      --max:1220px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(90,169,255,.14), transparent 32%),
        radial-gradient(circle at top right, rgba(255,90,90,.10), transparent 28%),
        radial-gradient(circle at bottom center, rgba(255,214,106,.08), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }

    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    .wrap{width:min(calc(100% - 28px), var(--max));margin:0 auto}

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      backdrop-filter:blur(14px);
      background:rgba(7,9,15,.72);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      width:min(calc(100% - 28px), var(--max));
      margin:0 auto;
      min-height:68px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .brand-mark{
      width:40px;
      height:40px;
      border-radius:12px;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 36%),
        linear-gradient(135deg, rgba(255,76,89,.28), rgba(255,214,106,.18));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 12px 32px rgba(0,0,0,.35);
    }
    .top-links{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:999px;
      color:#d8e5ff;
      background:rgba(255,255,255,.03);
      font-weight:800;
      font-size:14px;
    }

    .hero{
      padding:34px 0 54px;
    }
    .hero-grid{
      display:grid;
      grid-template-columns:minmax(320px,520px) 1fr;
      gap:34px;
      align-items:center;
    }
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,214,106,.22);
      color:#ffe9ac;
      background:rgba(255,214,106,.08);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    h1{
      margin:16px 0 10px;
      font-size:clamp(42px,6vw,84px);
      line-height:.94;
      letter-spacing:-.05em;
    }
    .sub{
      margin:0;
      font-size:18px;
      line-height:1.6;
      color:var(--muted);
      max-width:540px;
    }
    .cta-row{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:24px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 18px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:.02em;
      border:1px solid var(--line);
    }
    .btn-secondary{
      background:rgba(255,255,255,.04);
      color:var(--text);
    }
    .btn-machine{
      background:linear-gradient(180deg, rgba(255,214,106,.22), rgba(242,173,27,.10));
      border:1px solid rgba(255,214,106,.24);
      color:#ffefbf;
      pointer-events:none;
      cursor:not-allowed;
    }

    .machine-stage{
      display:flex;
      justify-content:center;
      align-items:flex-end;
    }
    .machine{
      width:min(100%, 620px);
      position:relative;
      filter:drop-shadow(0 34px 70px rgba(0,0,0,.42));
    }

    .top-cap{
      width:74%;
      height:58px;
      margin:0 auto -6px;
      border-radius:26px 26px 14px 14px;
      background:
        linear-gradient(180deg, #ff8d96 0%, var(--red1) 18%, var(--red2) 72%, var(--red3) 100%);
      border:2px solid rgba(255,255,255,.18);
      box-shadow:
        inset 0 10px 14px rgba(255,255,255,.18),
        inset 0 -12px 18px rgba(0,0,0,.22);
      position:relative;
      z-index:4;
    }
    .top-cap:before{
      content:"";
      position:absolute;
      left:10%;
      right:10%;
      top:8px;
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.20);
      filter:blur(.4px);
    }

    .globe-shell{
      position:relative;
      width:100%;
      aspect-ratio:1 / 1;
      border-radius:50%;
      background:
        radial-gradient(circle at 28% 24%, rgba(255,255,255,.58) 0%, rgba(255,255,255,.22) 10%, rgba(255,255,255,.05) 22%, transparent 30%),
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.18), transparent 38%),
        radial-gradient(circle at 50% 56%, rgba(173,224,255,.14), rgba(173,224,255,.05) 55%, rgba(255,255,255,.02) 75%, rgba(255,255,255,.01) 100%);
      border:3px solid rgba(226,241,255,.30);
      box-shadow:
        inset 0 0 0 8px rgba(255,255,255,.03),
        inset 0 -40px 80px rgba(0,0,0,.14),
        0 18px 40px rgba(0,0,0,.20);
      overflow:hidden;
      z-index:3;
    }
    .globe-shell:after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      box-shadow:
        inset -20px -36px 80px rgba(0,0,0,.18),
        inset 18px 20px 50px rgba(255,255,255,.05);
      pointer-events:none;
    }

    .globe-inner{
      position:absolute;
      inset:8% 8% 12% 8%;
      border-radius:50%;
    }

    .gumball{
      position:absolute;
      width:70px;
      height:70px;
      border-radius:50%;
      box-shadow:
        inset 0 6px 12px rgba(255,255,255,.24),
        inset 0 -10px 16px rgba(0,0,0,.18),
        0 8px 14px rgba(0,0,0,.18);
    }
    .gumball:before{
      content:"";
      position:absolute;
      width:24px;
      height:14px;
      left:12px;
      top:12px;
      border-radius:50%;
      background:rgba(255,255,255,.30);
      transform:rotate(-18deg);
      filter:blur(.4px);
    }

    .g1{left:7%; top:20%; background:linear-gradient(180deg,#7ad5ff,#297dff)}
    .g2{left:22%; top:12%; background:linear-gradient(180deg,#ff8eb8,#db285e)}
    .g3{left:39%; top:18%; background:linear-gradient(180deg,#ffe47f,#f0a90a)}
    .g4{left:56%; top:12%; background:linear-gradient(180deg,#94f6a8,#26b44e)}
    .g5{left:70%; top:21%; background:linear-gradient(180deg,#d59bff,#7f43d7)}
    .g6{left:15%; top:39%; background:linear-gradient(180deg,#ffba7a,#ef6f10)}
    .g7{left:31%; top:34%; background:linear-gradient(180deg,#86f7f3,#00a9b0)}
    .g8{left:49%; top:37%; background:linear-gradient(180deg,#ff8fe7,#ff4db2)}
    .g9{left:66%; top:38%; background:linear-gradient(180deg,#dfff81,#93c91d)}
    .g10{left:24%; top:56%; background:linear-gradient(180deg,#9ab8ff,#4050dd)}
    .g11{left:43%; top:58%; background:linear-gradient(180deg,#ffd878,#dd8a00)}
    .g12{left:60%; top:58%; background:linear-gradient(180deg,#ff9292,#d4293b)}

    .neck{
      width:170px;
      height:56px;
      margin:-18px auto 0;
      border-radius:18px 18px 10px 10px;
      background:
        linear-gradient(180deg, #ff7e87 0%, var(--red2) 55%, var(--red3) 100%);
      border:2px solid rgba(255,255,255,.14);
      box-shadow:
        inset 0 8px 12px rgba(255,255,255,.12),
        inset 0 -12px 18px rgba(0,0,0,.22);
      position:relative;
      z-index:4;
    }

    .body{
      width:72%;
      margin:0 auto;
      padding:24px 26px 28px;
      border-radius:34px 34px 28px 28px;
      background:
        linear-gradient(180deg, #ff6f79 0%, var(--red1) 10%, var(--red2) 62%, var(--red3) 100%);
      border:2px solid rgba(255,255,255,.14);
      box-shadow:
        inset 0 14px 18px rgba(255,255,255,.14),
        inset 0 -26px 36px rgba(0,0,0,.25);
      position:relative;
      z-index:2;
    }

    .brand-plate{
      width:86%;
      margin:0 auto 22px;
      padding:16px 18px;
      border-radius:18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(218,226,236,.92));
      color:#c91d2c;
      border:2px solid rgba(255,255,255,.40);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.8),
        0 12px 24px rgba(0,0,0,.18);
      text-align:center;
    }
    .brand-plate .mini{
      display:block;
      font-size:11px;
      font-weight:900;
      letter-spacing:.18em;
      color:#8e99ab;
      text-transform:uppercase;
      margin-bottom:4px;
    }
    .brand-plate .main{
      display:block;
      font-size:34px;
      line-height:1;
      font-weight:1000;
      letter-spacing:-.05em;
    }

    .controls{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:22px;
      align-items:center;
    }

    .coin-panel{
      width:120px;
      height:120px;
      border-radius:26px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08)),
        linear-gradient(180deg, #dbe3ee, #9ea9be);
      border:2px solid rgba(255,255,255,.28);
      box-shadow:
        inset 0 8px 14px rgba(255,255,255,.28),
        inset 0 -10px 16px rgba(0,0,0,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    .coin-panel:before{
      content:"";
      position:absolute;
      width:44px;
      height:10px;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      border-radius:999px;
      background:linear-gradient(180deg,#5a6579,#2e3645);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    }
    .coin-knob{
      width:62px;
      height:62px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 28%),
        linear-gradient(180deg, #f2f5f9, #9ba7bb);
      border:2px solid rgba(255,255,255,.36);
      box-shadow:
        inset 0 6px 12px rgba(255,255,255,.30),
        inset 0 -8px 10px rgba(0,0,0,.14);
      position:relative;
    }
    .coin-knob:after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:8px;
      height:30px;
      transform:translate(-50%,-50%);
      border-radius:999px;
      background:linear-gradient(180deg,#59667b,#283040);
    }

    .dispense{
      display:grid;
      gap:16px;
    }

    .chute{
      height:88px;
      border-radius:22px;
      background:
        linear-gradient(180deg, rgba(0,0,0,.34), rgba(255,255,255,.04)),
        linear-gradient(180deg, #aab3c4, #636f84);
      border:2px solid rgba(255,255,255,.20);
      box-shadow:
        inset 0 10px 20px rgba(0,0,0,.22),
        inset 0 2px 0 rgba(255,255,255,.16);
      position:relative;
      overflow:hidden;
    }
    .chute:before{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      top:14px;
      bottom:14px;
      border-radius:14px;
      background:linear-gradient(180deg, #161d29, #090d14);
      box-shadow:inset 0 4px 10px rgba(255,255,255,.05);
    }
    .chute-ball{
      position:absolute;
      right:26px;
      top:50%;
      transform:translateY(-50%);
      width:46px;
      height:46px;
      border-radius:50%;
      background:linear-gradient(180deg,#7ad5ff,#297dff);
      box-shadow:
        inset 0 4px 8px rgba(255,255,255,.25),
        inset 0 -6px 8px rgba(0,0,0,.18),
        0 6px 12px rgba(0,0,0,.16);
      z-index:2;
    }
    .chute-ball:before{
      content:"";
      position:absolute;
      width:14px;
      height:8px;
      left:8px;
      top:8px;
      border-radius:50%;
      background:rgba(255,255,255,.28);
      transform:rotate(-20deg);
    }

    .label-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:0 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      color:#eef5ff;
    }
    .status.gold{
      background:rgba(255,214,106,.10);
      border-color:rgba(255,214,106,.22);
      color:#ffeeb9;
    }

    .floor{
      width:86%;
      height:24px;
      margin:0 auto;
      border-radius:999px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.08)),
        linear-gradient(180deg, #444d62, #212736);
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.12),
        0 12px 18px rgba(0,0,0,.20);
      position:relative;
      top:-4px;
      z-index:1;
    }
    .stand{
      width:54%;
      height:94px;
      margin:0 auto;
      border-radius:0 0 28px 28px;
      background:
        linear-gradient(180deg, #d7dfeb, #99a6bb 45%, #626e83 100%);
      border:2px solid rgba(255,255,255,.24);
      box-shadow:
        inset 0 10px 14px rgba(255,255,255,.24),
        inset 0 -16px 24px rgba(0,0,0,.18);
      position:relative;
      z-index:0;
    }
    .stand:before{
      content:"";
      position:absolute;
      left:50%;
      top:18px;
      transform:translateX(-50%);
      width:68%;
      height:18px;
      border-radius:999px;
      background:linear-gradient(180deg,#6b758a,#2b3342);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
    }

    .base-shadow{
      width:64%;
      height:18px;
      margin:10px auto 0;
      border-radius:999px;
      background:rgba(0,0,0,.30);
      filter:blur(8px);
    }

    .footer{
      padding:20px 0 46px;
      color:var(--muted);
    }
    .footer-box{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:14px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }

    @media (max-width:980px){
      .hero-grid{
        grid-template-columns:1fr;
      }
      .machine{
        max-width:560px;
      }
    }

    @media (max-width:640px){
      .topbar-inner{
        padding:8px 0;
        align-items:flex-start;
        flex-direction:column;
      }
      .top-links{
        width:100%;
        overflow:auto;
        flex-wrap:nowrap;
        padding-bottom:2px;
      }
      .pill{white-space:nowrap}
      .hero{padding:30px 0 42px}
      .sub{font-size:16px}
      .body{
        width:84%;
        padding:18px 18px 22px;
      }
      .brand-plate .main{
        font-size:28px;
      }
      .controls{
        grid-template-columns:92px 1fr;
        gap:14px;
      }
      .coin-panel{
        width:92px;
        height:92px;
        border-radius:20px;
      }
      .coin-panel:before{
        width:34px;
        top:14px;
      }
      .coin-knob{
        width:48px;
        height:48px;
      }
      .chute{
        height:70px;
      }
      .chute-ball{
        width:38px;
        height:38px;
      }
      .gumball{
        width:56px;
        height:56px;
      }
      .neck{
        width:132px;
        height:42px;
      }
      .stand{
        height:76px;
        width:60%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="https://houseofcauliman.com/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>HOMEEZ</span>
      </a>
      <nav class="top-links" aria-label="Page navigation">
        <a class="pill" href="https://houseofcauliman.com/">House</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <div class="eyebrow">Active Build</div>
          <h1>HOMEEZ</h1>
          <p class="sub">The digital gumball machine is being built now. Real machine look first. Spin logic next.</p>
          <div class="cta-row">
            <span class="btn btn-machine">Machine Not Live Yet</span>
            <a class="btn btn-secondary" href="https://houseofcauliman.com/">Back to House</a>
          </div>
        </div>

        <div class="machine-stage">
          <div class="machine" aria-label="HOMEEZ digital gumball machine">
            <div class="top-cap"></div>

            <div class="globe-shell">
              <div class="globe-inner">
                <div class="gumball g1"></div>
                <div class="gumball g2"></div>
                <div class="gumball g3"></div>
                <div class="gumball g4"></div>
                <div class="gumball g5"></div>
                <div class="gumball g6"></div>
                <div class="gumball g7"></div>
                <div class="gumball g8"></div>
                <div class="gumball g9"></div>
                <div class="gumball g10"></div>
                <div class="gumball g11"></div>
                <div class="gumball g12"></div>
              </div>
            </div>

            <div class="neck"></div>

            <div class="body">
              <div class="brand-plate">
                <span class="mini">House of Cauliman</span>
                <span class="main">HOMEEZ</span>
              </div>

              <div class="controls">
                <div class="coin-panel">
                  <div class="coin-knob"></div>
                </div>

                <div class="dispense">
                  <div class="label-row">
                    <span class="status gold">Founding Machine</span>
                    <span class="status">Stand By</span>
                  </div>
                  <div class="chute">
                    <div class="chute-ball"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="floor"></div>
            <div class="stand"></div>
            <div class="base-shadow"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-box">
      <div>HOMEEZ • House of Cauliman</div>
      <div><a href="https://houseofcauliman.com/">houseofcauliman.com</a></div>
    </div>
  </footer>
</body>
</html>
