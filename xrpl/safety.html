<style>
  :root{
    --bg:#06080c;
    --panel:#0d1218;
    --panel2:#111823;
    --line:rgba(255,255,255,.10);
    --text:#eef3f8;
    --muted:#aeb8c6;
    --blue:#58a6ff;
    --gold:#d4a44a;
    --green:#42d392;
    --radius:18px;
    --shadow:0 16px 48px rgba(0,0,0,.35);
    --sans:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(circle at top, rgba(88,166,255,.10) 0%, rgba(0,0,0,0) 28%),
      linear-gradient(180deg,#06080c 0%,#0b1018 100%);
    color:var(--text);
    font-family:var(--sans);
  }

  a{color:var(--blue);text-decoration:none}

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:28px 18px 90px;
  }

  .hero{
    background:
      radial-gradient(circle at 10% 0, rgba(88,166,255,.12) 0, rgba(255,255,255,0) 55%),
      linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    border-radius:24px;
    padding:28px;
    box-shadow:var(--shadow);
  }

  h1{
    margin:0;
    font-size:34px;
    line-height:1.05;
    letter-spacing:.2px;
  }

  .sub{
    margin-top:10px;
    color:var(--muted);
    line-height:1.7;
    max-width:820px;
    font-size:15px;
  }

  .pillbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:999px;
    background:var(--green);
  }

  .section{
    margin-top:18px;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
  }

  h2{
    margin:0 0 12px;
    font-size:18px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:.4px;
  }

  h3{
    margin:0 0 8px;
    color:var(--text);
    font-size:16px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }

  p{
    margin:10px 0;
    color:var(--muted);
    line-height:1.75;
    font-size:15px;
  }

  ul{
    margin:10px 0 0 18px;
    color:var(--muted);
    line-height:1.75;
    padding:0;
  }

  li{margin:6px 0}

  .defs{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
    margin-top:18px;
  }

  .def-card{
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
  }

  .cta-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:22px;
  }

  .cta{
    display:inline-block;
    padding:12px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    color:var(--text);
    font-weight:800;
    font-size:14px;
  }

  .cta:hover{
    border-color:var(--blue);
    box-shadow:0 0 0 1px rgba(88,166,255,.15), 0 0 24px rgba(88,166,255,.12);
  }

  .footer{
    margin-top:18px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
  }

  @media (max-width: 820px){
    .defs{grid-template-columns:1fr;}
    h1{font-size:28px;}
  }
  .topnav{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:0 0 18px;
    padding:14px;
    border:1px solid var(--line);
    border-radius:16px;
    background:rgba(255,255,255,.03);
    box-shadow:var(--shadow);
  }

  .topnav a{
    display:inline-block;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    color:var(--text);
    font-size:14px;
    font-weight:700;
    text-decoration:none;
  }

  .topnav a:hover{
    border-color:var(--blue);
    box-shadow:0 0 0 1px rgba(88,166,255,.15), 0 0 24px rgba(88,166,255,.12);
  }

</style>
